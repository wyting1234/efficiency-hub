            color: #4F7DF3;
        }

        /* 新增统计摘要 */
        .stats-summary {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 24px;
            padding: 12px 18px;
            background: #f0f4ff;
            border-radius: 12px;
            margin-bottom: 16px;
            border: 1px solid #d6e0ff;
        }
        .stats-summary .stat-block {
            display: flex;
            align-items: baseline;
            gap: 4px;
            font-size: 14px;
            color: #334155;
        }
        .stats-summary .stat-block .label {
            font-weight: 500;
        }
        .stats-summary .stat-block .value {
            font-weight: 700;
            color: #4F7DF3;
        }
        .stats-summary .stat-block .value.green {
            color: #10b981;
        }
        .stats-summary .stat-block .value.red {
            color: #f43f5e;
        }
        .stats-summary .stat-block .value.orange {
            color: #f59e0b;
        }
        .stats-summary .stat-block .hint {
            font-size: 13px;
            color: #64748b;
        }

        @media (max-width: 768px) {
            .app-container { padding: 16px; border-radius: 20px; }
            .app-header h1 { font-size: 20px; }
            .header-date { font-size: 13px; padding: 4px 14px; }
            .header-actions .btn { font-size: 12px; padding: 4px 12px; }
            .tab-btn { min-width: 60px; padding: 8px 10px; font-size: 12px; }
            .tab-btn .badge { display: none; }
            .card { padding: 16px; }
            .form-row input, .form-row select, .form-row textarea { flex: 1 1 100%; min-width:0; }
            .form-row .btn { flex: 1 1 100%; }
            .stats { flex-direction: column; gap: 8px; }
            .progress-bar { width: 80px; }
            .item-row { flex-wrap: wrap; gap: 8px; }
            .item-row .actions { margin-left: auto; }
            .todo-item { flex-wrap: wrap; gap: 8px; }
            .history-item { flex-direction: column; align-items: stretch; }
            .history-item .bar-wrap { width: 100%; }
            .trend-banner { flex-direction: column; align-items: flex-start; }
            .generate-options { flex-direction: column; align-items: stretch; }
            .generate-options .option-group { justify-content: flex-start; }
            .chart-wrapper { height: 140px; }
            .chart-bar { min-width: 10px; }
            .chart-bar-label { font-size: 8px; max-width: 28px; }
            .stats-summary { flex-direction: column; gap: 6px; }
        }
        @media (max-width: 480px) {
            .app-header { flex-direction: column; align-items: stretch; }
            .header-actions { justify-content: flex-start; }
            .tab-btn { flex: 1 1 45%; font-size: 11px; padding: 6px 8px; }
            .card-header { flex-direction: column; align-items: flex-start; }
            .chart-wrapper { height: 120px; }
        }
    </style>
</head>
<body>
    <div class="app-container" id="app">
        <header class="app-header">
            <h1><span>🎯</span> 偶像模仿工具</h1>
            <div class="header-actions">
                <button class="btn btn-outline btn-sm" id="exportBtn">📤 导出数据</button>
                <button class="btn btn-outline btn-sm" id="importBtn">📥 导入数据</button>
                <button class="btn btn-danger-outline btn-sm" id="resetBtn">🔄 重置</button>
                <input type="file" id="fileInput" accept=".json" />
            </div>
            <div class="header-date">
                <span class="dot"></span>
                <span id="todayDisplay"></span>
            </div>
        </header>

        <nav class="tabs" role="tablist">
            <button class="tab-btn active" data-tab="checklist">📋 待办清单 <span class="badge" id="checklistBadge">0</span></button>
            <button class="tab-btn" data-tab="targets">🎯 模仿对象 <span class="badge" id="targetsBadge">0</span></button>
            <button class="tab-btn" data-tab="habits">✅ 良好行为 <span class="badge" id="habitsBadge">0</span></button>
            <button class="tab-btn" data-tab="badhabits">⚠️ 不良习惯 <span class="badge" id="badhabitsBadge">0</span></button>
            <button class="tab-btn" data-tab="history">📊 历史 <span class="badge" id="historyBadge">0</span></button>
        </nav>

        <!-- 待办清单 -->
        <section class="tab-content active" id="tab-checklist">
            <div class="card">
                <div class="card-header">
                    <h2><span class="icon">📋</span> 今日待办 <span class="sub" id="checklistDate"></span></h2>
                    <div class="card-actions">
                        <button class="btn btn-outline btn-sm" id="clearTodoBtn">🗑️ 清空待办</button>
                    </div>
                </div>

                <div class="generate-options">
                    <div class="option-group">
                        <label>生成模式：</label>
                        <select id="generateMode">
                            <option value="auto">全部随机</option>
                            <option value="target">指定对象随机</option>
                        </select>
                    </div>
                    <div class="option-group" id="targetSelectorGroup" style="display:none;">
                        <label>选择对象：</label>
                        <select id="targetSelector"><option value="">-- 请选择 --</option></select>
                    </div>
                    <div class="option-group">
                        <label>生成数量：</label>
                        <input type="number" id="genCountInput" min="1" max="20" value="10" />
                        <span class="count-hint">（1~20项）</span>
                    </div>
                    <button class="btn btn-success btn-sm" id="generateBtn">⚡ 生成今日待办</button>
                    <span class="text-muted" style="font-size:12px;margin-left:auto;">每项1分，满分根据数量自动调整</span>
                </div>

                <div class="stats" id="checklistStats">
                    <span class="stat-item">剩余待办：<strong class="num" id="remainingCount">0</strong></span>
                    <span class="stat-item">今日完成：<strong class="num" id="doneCount">0</strong></span>
                    <span class="stat-item">今日得分：<strong class="num" id="todayScore">0</strong> / <span id="maxScoreDisplay">10</span></span>
                    <span class="stat-item">
                        完成率：
                        <span class="progress-bar"><span class="fill" id="progressFill" style="width:0%;"></span></span>
                        <span id="progressPercent">0%</span>
                    </span>
                </div>
                <div id="checklistContainer">
                    <div class="item-list" id="checklistList"></div>
                </div>
                <div class="form-row mt-12">
                    <input type="text" id="newChecklistInput" placeholder="手动添加待办事项（不计入生成配额）…" />
                    <button class="btn btn-primary" id="addChecklistBtn">➕ 添加</button>
                </div>
                <p class="text-muted" style="margin-top:6px;">💡 点击复选框 → 事项消失，计入今日完成。手动添加不影响生成项。</p>
            </div>
        </section>

        <!-- 模仿对象 -->
        <section class="tab-content" id="tab-targets">
            <div class="card">
                <div class="card-header">
                    <h2><span class="icon">🎯</span> 模仿对象库</h2>
                    <span class="sub" id="targetsCount">共 0 个</span>
                </div>
                <div class="item-list" id="targetsList"></div>
                <div class="form-row mt-12">
                    <input type="text" id="newTargetInput" placeholder="模仿对象名称" />
                    <input type="text" id="newTargetDesc" placeholder="简短描述（可选）" />
                    <button class="btn btn-primary" id="addTargetBtn">➕ 添加</button>
                </div>
            </div>
        </section>

        <!-- 良好行为 -->
        <section class="tab-content" id="tab-habits">
            <div class="card">
                <div class="card-header">
                    <h2><span class="icon">✅</span> 良好行为库</h2>
                    <span class="sub" id="habitsCount">共 0 个</span>
                </div>
                <div class="item-list" id="habitsList"></div>
                <div class="form-row mt-12">
                    <input type="text" id="newHabitName" placeholder="行为名称" />
                    <input type="text" id="newHabitBenefit" placeholder="好处" />
                    <select id="newHabitTarget"><option value="">关联模仿对象（可选）</option></select>
                    <button class="btn btn-primary" id="addHabitBtn">➕ 添加</button>
                </div>
                <p class="text-muted" style="margin-top:6px;">💡 良好行为会用于自动生成待办项。</p>
            </div>
        </section>

        <!-- 不良习惯 -->
        <section class="tab-content" id="tab-badhabits">
            <div class="card">
                <div class="card-header">
                    <h2><span class="icon">⚠️</span> 不良习惯库</h2>
                    <span class="sub" id="badhabitsCount">共 0 个</span>
                </div>
                <div class="item-list" id="badhabitsList"></div>
                <div class="form-row mt-12">
                    <input type="text" id="newBadhabitName" placeholder="不良习惯" />
                    <input type="text" id="newBadhabitEffect" placeholder="坏影响" />
                    <button class="btn btn-primary" id="addBadhabitBtn">➕ 添加</button>
                </div>
            </div>
        </section>

        <!-- 历史记录（含柱状图和统计摘要） -->
        <section class="tab-content" id="tab-history">
            <div class="card">
                <div class="card-header">
                    <h2><span class="icon">📊</span> 历史完成记录</h2>
                    <span class="sub" id="historyCount">共 0 天</span>
                </div>

                <!-- 新增统计摘要 -->
                <div class="stats-summary" id="statsSummary">
                    <!-- 由 JS 动态渲染 -->
                </div>

                <div class="chart-container" id="chartContainer">
                    <div class="chart-title">📊 每日得分趋势（100分制）</div>
                    <div id="chartWrapper" class="chart-wrapper">
                        <!-- 由 JS 动态渲染 -->
                    </div>
                    <div class="chart-stats-summary" id="chartStatsSummary">
                        <!-- 由 JS 动态渲染 -->
                    </div>
                    <div class="chart-legend">
                        <span class="legend-item"><span class="legend-color low"></span> 低分 (0-39)</span>
                        <span class="legend-item"><span class="legend-color mid"></span> 中分 (40-69)</span>
                        <span class="legend-item"><span class="legend-color high"></span> 高分 (70-100)</span>
                    </div>
                </div>

                <div id="trendBanner" class="trend-banner" style="display:none;">
                    <span class="trend-icon">📈</span>
                    <span class="trend-text" id="trendText">整体趋势：上升</span>
                    <span class="trend-sub" id="trendSub">继续努力，保持进步！</span>
                </div>

                <div id="historyContainer">
                    <div class="history-list" id="historyList"></div>
                </div>
                <div class="mt-12 flex-wrap gap-8">
                    <button class="btn btn-outline btn-sm" id="clearHistoryBtn">🗑️ 清空所有历史</button>
                    <span class="text-muted" style="font-size:12px;">（仅清除历史记录，不影响今日待办）</span>
                </div>
            </div>
        </section>
    </div>

    <script>
        // ================================================================
        //  数据层（与之前相同）
        // ================================================================
        const STORAGE_KEYS = {
            TARGETS: 'imitation_targets',
            HABITS: 'good_habits',
            CHECKLIST: 'daily_checklist',
            BADHABITS: 'bad_habits',
        };

        function genId() { return Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6); }

        function getToday() { return new Date().toISOString().slice(0, 10); }

        function formatDate(d) { return new Date(d + 'T00:00:00').toLocaleDateString('zh-CN', { year: 'numeric', month: 'long',
                day: 'numeric', weekday: 'short' }); }

        function formatDateShort(d) { return new Date(d + 'T00:00:00').toLocaleDateString('zh-CN', { month: 'numeric',
                day: 'numeric' }); }

        function getData(key) { try { return JSON.parse(localStorage.getItem(key)); } catch { return null; } }

        function setData(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

        function getTargets() { return getData(STORAGE_KEYS.TARGETS) || []; }

        function setTargets(d) { setData(STORAGE_KEYS.TARGETS, d); }

        function getHabits() { return getData(STORAGE_KEYS.HABITS) || []; }

        function setHabits(d) { setData(STORAGE_KEYS.HABITS, d); }

        function getBadHabits() { return getData(STORAGE_KEYS.BADHABITS) || []; }

        function setBadHabits(d) { setData(STORAGE_KEYS.BADHABITS, d); }

        function getChecklist() { return getData(STORAGE_KEYS.CHECKLIST) || {}; }

        function setChecklist(d) { setData(STORAGE_KEYS.CHECKLIST, d); }

        function getTodayData() {
            const all = getChecklist();
            const today = getToday();
            if (!all[today]) { all[today] = { items: [], done: 0 };
                setChecklist(all); }
            if (Array.isArray(all[today])) { all[today] = { items: all[today], done: 0 };
                setChecklist(all); }
            return all[today];
        }

        function setTodayData(items, done) {
            const all = getChecklist();
            all[getToday()] = { items: items || [], done: done || 0 };
            setChecklist(all);
        }

        function getTodayItems() { return getTodayData().items; }

        function getTodayDone() { return getTodayData().done; }

        function incTodayDone() {
            const data = getTodayData();
            data.done += 1;
            setTodayData(data.items, data.done);
        }

        function setTodayItems(items) {
            const data = getTodayData();
            setTodayData(items, data.done);
        }

        function clearTodayItems() { setTodayItems([]); }

        function getHistoryDates() {
            const all = getChecklist();
            const today = getToday();
            return Object.keys(all).filter(d => d !== today).sort().reverse();
        }

        // 获取某天的得分（100分制）
        function getDailyScore100(date) {
            const all = getChecklist();
            const data = all[date];
            if (!data) return 0;
            const done = data.done || 0;
            const items = data.items || [];
            const total = items.length + done;
            if (total === 0) return 0;
            return Math.round((done / total) * 100);
        }

        // 获取某天的总项数
        function getDailyTotal(date) {
            const all = getChecklist();
            const data = all[date];
            if (!data) return 0;
            const items = data.items || [];
            return items.length + (data.done || 0);
        }

        function getHistoryScores100() {
            const all = getChecklist();
            const today = getToday();
            return Object.keys(all).filter(d => d !== today).sort().map(d => ({
                date: d,
                score: getDailyScore100(d),
                total: getDailyTotal(d),
                done: all[d].done || 0
            }));
        }

        // 计算过去N天平均分（不含今日）
        function getPastAverage(days = 20) {
            const scores = getHistoryScores100();
            const recent = scores.slice(-days);
            if (recent.length === 0) return 0;
            const sum = recent.reduce((a, b) => a + b.score, 0);
            return Math.round(sum / recent.length);
        }

        // 趋势判断（基于过去20天）
        function getTrend(scores) {
            if (scores.length < 2) return 'stable';
            const recent = scores.slice(-5);
            if (recent.length < 2) return 'stable';
            const first = recent[0].score;
            const last = recent[recent.length - 1].score;
            const diff = last - first;
            if (diff > 5) return 'up';
            if (diff < -5) return 'down';
            return 'stable';
        }

        // ================================================================
        //  工具
        // ================================================================
        function escHtml(s) { if (!s) return ''; const d = document.createElement('div');
            d.textContent = s; return d.innerHTML; }

        // ================================================================
        //  渲染函数
        // ================================================================
        function renderTargets() {
            const list = document.getElementById('targetsList');
            const data = getTargets();
            document.getElementById('targetsCount').textContent = `共 ${data.length} 个`;
            if (!data.length) {
                list.innerHTML = `<div class="empty-state"><div class="icon">🎯</div><p>还没有模仿对象</p></div>`;
                return;
            }
            list.innerHTML = data.map(t => `
                    <div class="item-row" data-id="${t.id}">
                        <div class="info"><div class="title">${escHtml(t.name)}</div>${t.description ? `<div class="desc">${escHtml(t.description)}</div>` : ''}</div>
                        <div class="actions"><button class="btn-icon btn-sm delete-target" data-id="${t.id}">✕</button></div>
                    </div>
                `).join('');
            list.querySelectorAll('.delete-target').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.dataset.id;
                    if (!confirm('删除？')) return;
                    let d = getTargets().filter(t => t.id !== id);
                    setTargets(d);
                    renderAll();
                });
            });
            populateTargetSelect();
        }

        function renderHabits() {
            const list = document.getElementById('habitsList');
            const habits = getHabits();
            const targets = getTargets();
            document.getElementById('habitsCount').textContent = `共 ${habits.length} 个`;
            const sel = document.getElementById('newHabitTarget');
            const cur = sel.value;
            sel.innerHTML = '<option value="">关联模仿对象（可选）</option>' +
                targets.map(t => `<option value="${t.id}">${escHtml(t.name)}</option>`).join('');
            sel.value = cur;
            if (!habits.length) {
                list.innerHTML = `<div class="empty-state"><div class="icon">✅</div><p>还没有良好行为</p></div>`;
                return;
            }
            list.innerHTML = habits.map(h => {
                const target = targets.find(t => t.id === h.targetId);
                return `
                        <div class="item-row" data-id="${h.id}">
                            <div class="info">
                                <div class="title">${escHtml(h.name)}</div>
                                <div class="desc">💡 ${escHtml(h.benefit || '未填写好处')}</div>
                                ${target ? `<div class="meta"><span class="tag">🎯 ${escHtml(target.name)}</span></div>` : ''}
                            </div>
                            <div class="actions"><button class="btn-icon btn-sm delete-habit" data-id="${h.id}">✕</button></div>
                        </div>
                    `;
            }).join('');
            list.querySelectorAll('.delete-habit').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.dataset.id;
                    if (!confirm('删除？')) return;
                    let d = getHabits().filter(h => h.id !== id);
                    setHabits(d);
                    renderAll();
                });
            });
        }

        function renderBadHabits() {
            const list = document.getElementById('badhabitsList');
            const data = getBadHabits();
            document.getElementById('badhabitsCount').textContent = `共 ${data.length} 个`;
            if (!data.length) {
                list.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><p>还没有不良习惯</p></div>`;
                return;
            }
            list.innerHTML = data.map(b => `
                        <div class="item-row" data-id="${b.id}">
                            <div class="info">
                                <div class="title">${escHtml(b.name)}</div>
                                <div class="desc">⚠️ ${escHtml(b.effect || '未填写影响')}</div>
                            </div>
                            <div class="actions"><button class="btn-icon btn-sm delete-badhabit" data-id="${b.id}">✕</button></div>
                        </div>
                    `).join('');
            list.querySelectorAll('.delete-badhabit').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.dataset.id;
                    if (!confirm('删除？')) return;
                    let d = getBadHabits().filter(b => b.id !== id);
                    setBadHabits(d);
                    renderAll();
                });
            });
        }

        function renderChecklist() {
            const container = document.getElementById('checklistList');
            const items = getTodayItems();
            const done = getTodayDone();
            const today = getToday();
            document.getElementById('checklistDate').textContent = formatDate(today);

            const total = items.length;
            const totalAll = total + done;
            const maxScore = Math.max(totalAll, 1);
            const pct = totalAll === 0 ? 0 : Math.round((done / totalAll) * 100);

            document.getElementById('remainingCount').textContent = total;
            document.getElementById('doneCount').textContent = done;
            document.getElementById('todayScore').textContent = done;
            document.getElementById('maxScoreDisplay').textContent = totalAll;
            document.getElementById('progressFill').style.width = pct + '%';
            document.getElementById('progressPercent').textContent = pct + '%';

            if (!total) {
                container.innerHTML =
                    `<div class="empty-state"><div class="icon">📋</div><p>今日待办已清空，点击「生成今日待办」或手动添加。</p></div>`;
                return;
            }
            container.innerHTML = items.map((item, idx) => `
                        <div class="todo-item" data-index="${idx}">
                            <div class="checkbox" data-index="${idx}"></div>
                            <span class="text">${escHtml(item.text)}</span>
                            <button class="delete-btn" data-index="${idx}">✕</button>
                        </div>
                    `).join('');

            container.querySelectorAll('.checkbox').forEach(el => {
                el.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index);
                    const items = getTodayItems();
                    if (idx >= 0 && idx < items.length) {
                        items.splice(idx, 1);
                        setTodayItems(items);
                        incTodayDone();
                        renderChecklist();
                        updateBadges();
                    }
                });
            });

            container.querySelectorAll('.delete-btn').forEach(el => {
                el.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index);
                    if (!confirm('删除此项？')) return;
                    const items = getTodayItems();
                    if (idx >= 0 && idx < items.length) {
                        items.splice(idx, 1);
                        setTodayItems(items);
                        renderChecklist();
                        updateBadges();
                    }
                });
            });
        }

        // ================================================================
        //  柱状图渲染 (使用100分制)
        // ================================================================
        function renderChart() {
            const wrapper = document.getElementById('chartWrapper');
            const scores = getHistoryScores100();
            const recent = scores.slice(-30);
            const maxScore = 100;

            if (recent.length === 0) {
                wrapper.innerHTML = `<div class="chart-empty">📭 暂无历史数据，开始使用后柱状图将自动生成</div>`;
                document.getElementById('chartStatsSummary').innerHTML = '';
                return;
            }

            const values = recent.map(d => d.score);
            const totalDays = values.length;
            const avg = values.reduce((a, b) => a + b, 0) / totalDays;
            const max = Math.max(...values);
            const min = Math.min(...values);
            const highDays = values.filter(v => v >= 70).length;
            const lowDays = values.filter(v => v < 40).length;

            document.getElementById('chartStatsSummary').innerHTML = `
                        <span class="item">📅 统计天数：<strong class="val">${totalDays}</strong></span>
                        <span class="item">📊 平均得分：<strong class="val">${avg.toFixed(1)}</strong></span>
                        <span class="item">📈 最高分：<strong class="val">${max}</strong></span>
                        <span class="item">📉 最低分：<strong class="val">${min}</strong></span>
                        <span class="item">🏆 高分日（≥70分）：<strong class="val">${highDays}</strong></span>
                        <span class="item">⚠️ 低分日（<40分）：<strong class="val">${lowDays}</strong></span>
                    `;

            const barHeight = 160;
            let html = '';
            recent.forEach((item) => {
                const score = item.score;
                const pct = score / 100;
                const height = Math.max(4, pct * barHeight);
                const dateLabel = formatDateShort(item.date);

                let color = '#4F7DF3';
                if (score >= 70) color = '#10b981';
                else if (score >= 40) color = '#f59e0b';
                else color = '#fcd34d';

                const tooltip = `${formatDate(item.date)}：得分 ${score} 分（${item.done}/${item.total}）`;

                html += `
                            <div class="chart-bar-group">
                                <div class="chart-bar" style="height:${height}px; background:${color};" title="${tooltip}">
                                    <span class="bar-value">${score}</span>
                                </div>
                                <div class="chart-bar-label">${dateLabel}</div>
                            </div>
                        `;
            });

            wrapper.innerHTML = html;
        }

        // ================================================================
        //  历史列表渲染（含对比提示）
        // ================================================================
        function renderHistory() {
            const container = document.getElementById('historyList');
            const scores = getHistoryScores100();
            const today = getToday();
            const all = getChecklist();
            const dates = Object.keys(all).filter(d => d !== today).sort().reverse();

            document.getElementById('historyCount').textContent = `共 ${dates.length} 天`;

            // 过去20日平均分
            const avg20 = getPastAverage(20);

            // 趋势横幅
            const banner = document.getElementById('trendBanner');
            const trendText = document.getElementById('trendText');
            const trendSub = document.getElementById('trendSub');

            if (scores.length < 2) {
                banner.style.display = 'none';
            } else {
                banner.style.display = 'flex';
                const trend = getTrend(scores);
                const iconMap = { up: '📈', down: '📉', stable: '➡️' };
                const textMap = { up: '整体趋势：上升 📈', down: '整体趋势：下降 📉', stable: '整体趋势：平稳 ➡️' };
                const messageMap = {
                    up: '太棒了！继续保持，你正在变得更好！ 💪',
                    down: '别灰心，偶尔波动正常，调整心态，明天继续加油！ 🌟',
                    stable: '稳扎稳打，持之以恒就是胜利！ 🎯'
                };
                const clsMap = { up: 'trend-up', down: 'trend-down', stable: 'trend-stable' };
                banner.className = 'trend-banner ' + clsMap[trend];
                document.querySelector('.trend-icon').textContent = iconMap[trend];
                trendText.textContent = textMap[trend];
                trendSub.textContent = messageMap[trend];
            }

            // 统计摘要（顶部）
            const summaryDiv = document.getElementById('statsSummary');
            const todayScore = getDailyScore100(today);
            const todayTotal = getDailyTotal(today);
            let summaryHtml = `
                        <div class="stat-block"><span class="label">📊 过去20日平均分：</span><span class="value">${avg20}</span></div>
                    `;
            if (todayTotal > 0) {
                summaryHtml += `
                            <div class="stat-block"><span class="label">📌 今日得分：</span><span class="value">${todayScore}</span></div>
                        `;
                let compareClass = 'orange';
                let compareText = '持平';
                if (todayScore > avg20) { compareClass = 'green';
                    compareText = '高于平均 🎉'; } else if (todayScore < avg20) { compareClass = 'red';
                    compareText = '低于平均 💪'; } else { compareClass = 'orange';
                    compareText = '持平 👏'; }
                summaryHtml += `
                            <div class="stat-block"><span class="label">📈 今日对比：</span><span class="value ${compareClass}">${compareText}</span></div>
                        `;
            } else {
                summaryHtml += `
                            <div class="stat-block"><span class="hint">今日暂无记录</span></div>
                        `;
            }
            summaryDiv.innerHTML = summaryHtml;

            if (!dates.length) {
                container.innerHTML =
                `<div class="empty-state"><div class="icon">📊</div><p>暂无历史记录，开始使用待办清单吧！</p></div>`;
                return;
            }

            // 渲染历史条目
            container.innerHTML = dates.map(date => {
                const data = all[date];
                const items = data.items || [];
                const done = data.done || 0;
                const total = items.length + done;
                const score = getDailyScore100(date);
                const pct = total === 0 ? 0 : Math.round((done / total) * 100);

                // 与平均分比较
                let compareClass = 'equal';
                let compareText = '持平';
                let compareHint = '稳扎稳打，继续保持！';
                if (score > avg20) {
                    compareClass = 'up';
                    compareText = '高于平均 🎉';
                    compareHint = '太棒了，继续超越自己！';
                } else if (score < avg20) {
                    compareClass = 'down';
                    compareText = '低于平均 💪';
                    compareHint = '别灰心，调整状态，明天会更好！';
                } else {
                    compareClass = 'equal';
                    compareText = '持平 👏';
                    compareHint = '稳定输出，坚持就是胜利！';
                }

                return `
                            <div class="history-item">
                                <span class="date">${formatDate(date)}</span>
                                <div class="summary">
                                    <span class="done">✅ ${done}</span>
                                    <span class="total">📋 ${total}</span>
                                    <span class="score">${score}分</span>
                                    <span class="compare ${compareClass}" title="${compareHint}">${compareText}</span>
                                </div>
                                <div class="bar-wrap"><div class="fill" style="width:${pct}%;"></div></div>
                            </div>
                        `;
            }).join('');
        }

        function updateBadges() {
            document.getElementById('targetsBadge').textContent = getTargets().length;
            document.getElementById('habitsBadge').textContent = getHabits().length;
            document.getElementById('badhabitsBadge').textContent = getBadHabits().length;
            const items = getTodayItems();
            const done = getTodayDone();
            document.getElementById('checklistBadge').textContent = items.length > 0 ? `${items.length}待办` : `${done}完成`;
            document.getElementById('historyBadge').textContent = getHistoryDates().length;
        }

        function renderAll() {
            renderTargets();
            renderHabits();
            renderBadHabits();
            renderChecklist();
            renderChart();
            renderHistory();
            updateBadges();
            populateTargetSelect();
            updateGenerateUI();
        }

        // ================================================================
        //  生成逻辑
        // ================================================================
        function populateTargetSelect() {
            const sel = document.getElementById('targetSelector');
            const targets = getTargets();
            const current = sel.value;
            sel.innerHTML = '<option value="">-- 请选择 --</option>' +
                targets.map(t => `<option value="${t.id}">${escHtml(t.name)}</option>`).join('');
            sel.value = current;
        }

        function updateGenerateUI() {
            const mode = document.getElementById('generateMode').value;
            const isTarget = (mode === 'target');
            document.getElementById('targetSelectorGroup').style.display = isTarget ? 'flex' : 'none';
        }

        function generateTasks() {
            const mode = document.getElementById('generateMode').value;
            const countInput = document.getElementById('genCountInput');
            let count = parseInt(countInput.value) || 10;
            count = Math.min(20, Math.max(1, count));
            countInput.value = count;

            let habitList = [];

            if (mode === 'auto') {
                const allHabits = getHabits();
                if (allHabits.length === 0) {
                    alert('良好行为库为空，请先添加良好行为！');
                    return;
                }
                const shuffled = [...allHabits].sort(() => Math.random() - 0.5);
                habitList = shuffled.slice(0, count);
                while (habitList.length < count) {
                    const extra = allHabits[Math.floor(Math.random() * allHabits.length)];
                    habitList.push(extra);
                }
            } else if (mode === 'target') {
                const targetId = document.getElementById('targetSelector').value;
                if (!targetId) { alert('请选择一个模仿对象。'); return; }
                const target = getTargets().find(t => t.id === targetId);
                if (!target) { alert('所选对象不存在。'); return; }
                const habits = getHabits().filter(h => h.targetId === targetId);
                if (habits.length === 0) {
                    alert(`对象「${target.name}」下没有关联的良好行为，请先添加关联。`);
                    return;
                }
                const shuffled = [...habits].sort(() => Math.random() - 0.5);
                habitList = shuffled.slice(0, count);
                while (habitList.length < count) {
                    const extra = habits[Math.floor(Math.random() * habits.length)];
                    habitList.push(extra);
                }
            }

            const newItems = habitList.map((h, idx) => ({
                id: genId() + '_' + idx,
                text: h.name,
            }));
            setTodayItems(newItems);
            setTodayData(newItems, 0);
            renderChecklist();
            updateBadges();
            alert(`✅ 已生成 ${newItems.length} 项待办，每项1分，加油完成！`);
        }

        // ================================================================
        //  其他操作
        // ================================================================
        function addChecklistItem(text) {
            text = text.trim();
            if (!text) return false;
            const items = getTodayItems();
            items.push({ id: genId(), text });
            setTodayItems(items);
            renderChecklist();
            updateBadges();
            return true;
        }

        function clearTodoItems() {
            const items = getTodayItems();
            if (items.length === 0) { alert('待办清单已为空。'); return; }
            if (confirm(`确定要清空所有待办事项吗？（已完成数 ${getTodayDone()} 不受影响）`)) {
                clearTodayItems();
                renderChecklist();
                updateBadges();
            }
        }

        function exportData() {
            const data = {
                targets: getTargets(),
                habits: getHabits(),
                badHabits: getBadHabits(),
                checklist: getChecklist(),
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `habit_data_${getToday()}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importData(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.targets) setTargets(data.targets);
                    if (data.habits) setHabits(data.habits);
                    if (data.badHabits) setBadHabits(data.badHabits);
                    if (data.checklist) setChecklist(data.checklist);
                    renderAll();
                    alert('✅ 数据导入成功！');
                } catch (err) {
                    alert('❌ 数据格式错误，请检查文件。');
                    console.error(err);
                }
            };
            reader.readAsText(file);
        }

        function resetAll() {
            if (!confirm('⚠️ 确定要清除所有数据吗？此操作不可撤销！')) return;
            if (!confirm('再次确认：所有模仿对象、行为、清单和历史都将被清除。')) return;
            localStorage.removeItem(STORAGE_KEYS.TARGETS);
            localStorage.removeItem(STORAGE_KEYS.HABITS);
            localStorage.removeItem(STORAGE_KEYS.BADHABITS);
            localStorage.removeItem(STORAGE_KEYS.CHECKLIST);
            initSampleData();
            renderAll();
            alert('已重置为初始示例数据。');
        }

        function clearHistory() {
            if (!confirm('确定要清空所有历史记录吗？（今日待办不受影响）')) return;
            const all = getChecklist();
            const today = getToday();
            const newAll = { [today]: all[today] || { items: [], done: 0 } };
            setChecklist(newAll);
            renderChart();
            renderHistory();
            updateBadges();
            alert('历史记录已清空。');
        }

        // ================================================================
        //  示例数据初始化
        // ================================================================
        function initSampleData() {
            if (localStorage.getItem(STORAGE_KEYS.TARGETS) !== null) return;
            const targets = [
                { id: genId(), name: '高校人士的高效习惯', description: '学习时间管理与工作方法' },
                { id: genId(), name: '健康生活家', description: '注重健康饮食与规律运动' },
            ];
            setTargets(targets);
            const habits = [
                { id: genId(), targetId: targets[0].id, name: '早起', benefit: '获得更多时间，头脑清醒' },
                { id: genId(), targetId: targets[0].id, name: '每日阅读', benefit: '增长知识，提升思维深度' },
                { id: genId(), targetId: targets[0].id, name: '制定计划', benefit: '明确目标，提高效率' },
                { id: genId(), targetId: targets[0].id, name: '定期复盘', benefit: '总结经验，持续改进' },
                { id: genId(), targetId: targets[1].id, name: '健康饮食', benefit: '保持精力，预防疾病' },
                { id: genId(), targetId: targets[1].id, name: '规律运动', benefit: '增强体质，缓解压力' },
                { id: genId(), targetId: targets[1].id, name: '充足睡眠', benefit: '恢复精力，提高免疫力' },
            ];
            setHabits(habits);
            const bads = [
                { id: genId(), name: '熬夜', effect: '损害健康，影响精力' },
                { id: genId(), name: '拖延', effect: '降低效率，增加焦虑' },
                { id: genId(), name: '过度使用手机', effect: '分散注意力，浪费时间' },
            ];
            setBadHabits(bads);
            const all = getChecklist();
            const today = getToday();
            for (let i = 1; i <= 25; i++) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                const dateStr = d.toISOString().slice(0, 10);
                if (dateStr !== today) {
                    const totalItems = Math.floor(Math.random() * 10) + 3;
                    const done = Math.floor(Math.random() * (totalItems + 1));
                    const items = [];
                    for (let j = 0; j < totalItems; j++) {
                        items.push({ id: genId(), text: `示例习惯 ${j+1}` });
                    }
                    all[dateStr] = { items, done };
                }
            }
            setChecklist(all);
        }

        // ================================================================
        //  事件绑定
        // ================================================================
        function bindEvents() {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    const tabId = this.dataset.tab;
                    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
                    document.getElementById('tab-' + tabId).classList.add('active');
                    renderAll();
                });
            });

            document.getElementById('generateMode').addEventListener('change', updateGenerateUI);
            document.getElementById('generateBtn').addEventListener('click', generateTasks);

            document.getElementById('addTargetBtn').addEventListener('click', () => {
                const name = document.getElementById('newTargetInput').value.trim();
                const desc = document.getElementById('newTargetDesc').value.trim();
                if (!name) { alert('请输入名称'); return; }
                const d = getTargets();
                d.push({ id: genId(), name, description: desc });
                setTargets(d);
                document.getElementById('newTargetInput').value = '';
                document.getElementById('newTargetDesc').value = '';
                renderAll();
            });
            document.getElementById('newTargetInput').addEventListener('keydown', e => { if (e.key === 'Enter') document
                    .getElementById('addTargetBtn').click(); });
            document.getElementById('newTargetDesc').addEventListener('keydown', e => { if (e.key === 'Enter') document
                    .getElementById('addTargetBtn').click(); });

            document.getElementById('addHabitBtn').addEventListener('click', () => {
                const name = document.getElementById('newHabitName').value.trim();
                const benefit = document.getElementById('newHabitBenefit').value.trim();
                const targetId = document.getElementById('newHabitTarget').value;
                if (!name) { alert('请输入行为名称'); return; }
                const d = getHabits();
                d.push({ id: genId(), targetId, name, benefit });
                setHabits(d);
                document.getElementById('newHabitName').value = '';
                document.getElementById('newHabitBenefit').value = '';
                renderAll();
            });
            document.getElementById('newHabitName').addEventListener('keydown', e => { if (e.key === 'Enter') document
                    .getElementById('addHabitBtn').click(); });
            document.getElementById('newHabitBenefit').addEventListener('keydown', e => { if (e.key === 'Enter') document
                    .getElementById('addHabitBtn').click(); });

            document.getElementById('addBadhabitBtn').addEventListener('click', () => {
                const name = document.getElementById('newBadhabitName').value.trim();
                const effect = document.getElementById('newBadhabitEffect').value.trim();
                if (!name) { alert('请输入不良习惯名称'); return; }
                const d = getBadHabits();
                d.push({ id: genId(), name, effect });
                setBadHabits(d);
                document.getElementById('newBadhabitName').value = '';
                document.getElementById('newBadhabitEffect').value = '';
                renderAll();
            });
            document.getElementById('newBadhabitName').addEventListener('keydown', e => { if (e.key === 'Enter') document
                    .getElementById('addBadhabitBtn').click(); });
            document.getElementById('newBadhabitEffect').addEventListener('keydown', e => { if (e.key === 'Enter') document
                    .getElementById('addBadhabitBtn').click(); });

            document.getElementById('addChecklistBtn').addEventListener('click', () => {
                const input = document.getElementById('newChecklistInput');
                const ok = addChecklistItem(input.value);
                if (ok) input.value = '';
                else if (input.value.trim()) alert('请输入有效内容');
            });
            document.getElementById('newChecklistInput').addEventListener('keydown', e => { if (e.key === 'Enter') document
                    .getElementById('addChecklistBtn').click(); });

            document.getElementById('clearTodoBtn').addEventListener('click', clearTodoItems);

            document.getElementById('exportBtn').addEventListener('click', exportData);
            document.getElementById('importBtn').addEventListener('click', () => document.getElementById('fileInput').click());
            document.getElementById('fileInput').addEventListener('change', function(e) {
                if (this.files.length) {
                    importData(this.files[0]);
                    this.value = '';
                }
            });
            document.getElementById('resetBtn').addEventListener('click', resetAll);
            document.getElementById('clearHistoryBtn').addEventListener('click', clearHistory);
        }

        // ================================================================
        //  启动
        // ================================================================
        function init() {
            document.getElementById('todayDisplay').textContent =
                new Date().toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric',
                    weekday: 'short' });
            initSampleData();
            renderAll();
            bindEvents();
            updateGenerateUI();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
