<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F4EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="生活工作台">
<title>生活工作台</title>
<style>
:root{
  --bg:#F6F4EF; --paper:#FFFDFA; --paper2:#FBF9F4;
  --ink:#1F1D1A; --ink2:#5E594F; --ink3:#948C7F;
  --line:#E5DFD4; --line2:#EFEAE0;
  --accent:#3E5C50; --accent2:#5B7D6E; --accent-soft:#E9EFEB;
  --clay:#A8674A; --clay-soft:#F4EAE3;
  --gold:#A98536; --gold-soft:#F5EFE0;
  --red:#BE4536; --green:#3B7A56; --blue:#4A6B8A; --violet:#6D5B86;
  --r:12px; --rs:8px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",serif;
  --sh:0 1px 2px rgba(60,50,35,.04);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.62;
  background-image:radial-gradient(circle at 12% 8%,rgba(62,92,80,.045),transparent 42%),radial-gradient(circle at 88% 4%,rgba(168,103,74,.04),transparent 38%);
  background-attachment:fixed;min-height:100vh}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:.01em}
a{color:var(--accent);text-decoration:none}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
svg{display:block}

/* ---------- 顶栏 ---------- */
.top{position:relative;z-index:60;background:rgba(246,244,239,.9);backdrop-filter:saturate(1.6) blur(12px);-webkit-backdrop-filter:saturate(1.6) blur(12px);border-bottom:1px solid var(--line)}
html.in-iframe .top{display:none}
.top-in{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--serif);font-size:18px;letter-spacing:.06em;color:var(--ink)}
.brand svg{color:var(--accent)}
.brand small{font-family:var(--sans);font-size:11px;letter-spacing:.18em;color:var(--ink3);text-transform:uppercase}
.top-sp{flex:1}
.top-acts{display:flex;align-items:center;gap:8px}
.pillbtn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 13px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink2);font-size:13px;transition:.16s}
.pillbtn:hover{border-color:var(--accent);color:var(--accent)}
.pillbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.badge-dot{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;font-weight:600}

/* ---------- 布局 ---------- */
.shell{max-width:1240px;margin:0 auto;padding:0 20px;display:flex;gap:34px;align-items:flex-start}
.side{width:176px;flex:none;position:sticky;top:66px;padding:26px 0 40px}
.side-t{font-size:11px;letter-spacing:.2em;color:var(--ink3);padding:0 0 10px 12px;text-transform:uppercase}
.navi{display:flex;flex-direction:column;gap:1px}
.navi button{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--rs);color:var(--ink2);font-size:14.5px;text-align:left;position:relative;transition:.15s}
.navi button svg{opacity:.7;flex:none}
.navi button:hover{background:rgba(62,92,80,.06);color:var(--ink)}
.navi button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.navi button.on svg{opacity:1}
.navi button .cnt{margin-left:auto;font-size:11px;color:var(--red);font-weight:600}
.side-foot{margin-top:22px;padding:12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink3);line-height:1.7}
main{flex:1;min-width:0;padding:26px 0 90px}

/* ---------- 通用板块 ---------- */
.hd{display:flex;align-items:flex-end;gap:14px;margin:0 0 18px}
.hd .t{font-family:var(--serif);font-size:27px;line-height:1.25;letter-spacing:.02em}
.hd .s{font-size:13px;color:var(--ink3);padding-bottom:5px}
.hd .sp{flex:1}
.sec{margin:0 0 30px}
.sec-h{display:flex;align-items:center;gap:10px;margin:0 0 14px;padding-bottom:9px;border-bottom:1px solid var(--line)}
.sec-h h3{font-family:var(--serif);font-size:16.5px;letter-spacing:.04em}
.sec-h .n{font-size:11.5px;color:var(--ink3);letter-spacing:.06em}
.sec-h .sp{flex:1}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel.flat{background:var(--paper2)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.muted{color:var(--ink3)}
.sm{font-size:12.5px}
.xs{font-size:11.5px;letter-spacing:.04em}
.right{text-align:right}
.mono{font-variant-numeric:tabular-nums}
.hr{height:1px;background:var(--line2);margin:14px 0}

/* 指标块（非模板卡片：细线分隔+留白排版） */
.stats{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);overflow:hidden}
.stat{flex:1 1 150px;padding:15px 17px;border-right:1px solid var(--line2);min-width:0}
.stat:last-child{border-right:none}
.stat .k{font-size:11.5px;letter-spacing:.1em;color:var(--ink3);margin-bottom:5px}
.stat .v{font-family:var(--serif);font-size:24px;line-height:1.15;font-variant-numeric:tabular-nums}
.stat .v small{font-size:12px;font-family:var(--sans);color:var(--ink3);margin-left:3px;letter-spacing:0}
.stat .d{font-size:11.5px;color:var(--ink3);margin-top:3px}

/* 表单 */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:11.5px;letter-spacing:.09em;color:var(--ink3)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=url],select,textarea{
  width:100%;height:44px;padding:0 11px;font-size:16px;background:var(--paper);border:1px solid var(--line);border-radius:var(--rs);outline:none;transition:.15s;color:var(--ink)}
textarea{height:auto;min-height:74px;padding:10px 11px;line-height:1.6;resize:vertical}
select{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1.5L6 6.5L11 1.5' stroke='%23948C7F' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 11px center;padding-right:30px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(62,92,80,.09)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:44px;padding:0 18px;border-radius:var(--rs);background:var(--accent);color:#fff;font-size:14.5px;font-weight:500;border:1px solid var(--accent);transition:.16s}
.btn:hover{background:var(--accent2);border-color:var(--accent2)}
.btn.sec{background:var(--paper);color:var(--ink2);border-color:var(--line)}
.btn.sec:hover{background:var(--paper2);border-color:var(--accent);color:var(--accent)}
.btn.danger{background:var(--paper);color:var(--red);border-color:#E7C9C4}
.btn.danger:hover{background:#FBEFED}
.btn.wide{width:100%}
.iconbtn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--rs);color:var(--ink3);transition:.15s;flex:none}
.iconbtn:hover{background:rgba(190,69,54,.08);color:var(--red)}
.iconbtn.plain:hover{background:rgba(62,92,80,.08);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--paper);font-size:13px;color:var(--ink2);transition:.15s}
.chip:hover{border-color:var(--accent2);color:var(--accent)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.on.a{background:var(--accent);border-color:var(--accent)}
.tabs{display:flex;gap:2px;background:var(--paper2);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{flex:1;height:36px;padding:0 14px;border-radius:999px;font-size:13.5px;color:var(--ink2);white-space:nowrap}
.tabs button.on{background:var(--paper);color:var(--accent);font-weight:600;box-shadow:var(--sh)}

/* 列表行 */
.rows{border:1px solid var(--line);border-radius:var(--r);background:var(--paper);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 15px;border-bottom:1px solid var(--line2)}
.row:last-child{border-bottom:none}
.row:hover{background:var(--paper2)}
.row .main{flex:1;min-width:0}
.row .ttl{font-size:14.5px;line-height:1.4;word-break:break-word}
.row .sub{font-size:12px;color:var(--ink3);margin-top:2px}
.row .amt{font-family:var(--serif);font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.daygrp{padding:9px 15px;background:var(--paper2);font-size:11.5px;letter-spacing:.08em;color:var(--ink3);border-bottom:1px solid var(--line2);display:flex}
.daygrp span:last-child{margin-left:auto}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;letter-spacing:.03em;background:var(--paper2);border:1px solid var(--line);color:var(--ink2)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.empty{padding:34px 18px;text-align:center;color:var(--ink3);font-size:13.5px}
.empty svg{margin:0 auto 10px;opacity:.35}
.txprev{margin-top:11px;padding:9px 13px;border-radius:var(--r);background:var(--paper2);border:1px dashed var(--line);font-size:13px;color:var(--ink2)}
.txprev b{color:var(--ink);font-variant-numeric:tabular-nums}
.txprev .save{color:var(--accent);font-weight:500}
.tx-grid{grid-template-columns:repeat(auto-fit,minmax(118px,1fr));align-items:end}
.tx-submit{grid-column:1/-1;width:100%;height:46px;margin-top:3px;font-size:15px}
.row.flash{animation:rowflash 1.4s ease}
@keyframes rowflash{0%{background:rgba(62,92,80,.18)}60%{background:rgba(62,92,80,.12)}100%{background:transparent}}

/* 进度条 */
.bar{height:7px;border-radius:99px;background:var(--line2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .5s cubic-bezier(.2,.8,.3,1)}

/* 横幅提示 */
.banners{position:sticky;top:0;z-index:80}
.banner{display:flex;align-items:center;gap:11px;padding:11px 20px;font-size:13.5px;border-bottom:1px solid;animation:slidein .3s ease}
@keyframes slidein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.banner.warn{background:#FBF3E2;border-color:#EBDCB9;color:#6B5218}
.banner.err{background:#FBEDEB;border-color:#EFD2CD;color:#8A2E22}
.banner.ok{background:#EAF2EC;border-color:#CFE0D4;color:#2C5C41}
.banner .sp{flex:1}
.banner button{font-size:12.5px;padding:6px 11px;border-radius:999px;border:1px solid currentColor;opacity:.85}
.banner button:hover{opacity:1}
.banner .x{border:none;font-size:18px;line-height:1;padding:4px 8px}

/* 弹层 */
.mask{position:fixed;inset:0;background:rgba(31,29,26,.42);backdrop-filter:blur(3px);z-index:200;display:flex;align-items:center;justify-content:center;padding:18px;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--paper);border-radius:16px;max-width:460px;width:100%;padding:24px;box-shadow:0 24px 60px rgba(40,32,20,.24);max-height:88vh;overflow:auto}
.modal h3{font-family:var(--serif);font-size:19px;margin-bottom:9px}
.modal p{color:var(--ink2);font-size:14px;margin:0 0 16px}
.modal .acts{display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;font-size:13.5px;z-index:300;box-shadow:0 10px 30px rgba(0,0,0,.2);animation:up .26s ease}
@keyframes up{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

/* 今日要处理 */
.todo{border:1px solid var(--line);border-radius:var(--r);background:var(--paper);overflow:hidden}
.todo .it{display:flex;align-items:center;gap:12px;padding:12px 15px;border-bottom:1px solid var(--line2)}
.todo .it:last-child{border-bottom:none}
.todo .it.over{background:linear-gradient(90deg,rgba(190,69,54,.055),transparent 62%)}
.todo .it .k{width:3px;height:26px;border-radius:2px;background:var(--accent2);flex:none}
.todo .it.over .k{background:var(--red)}
.todo .it .tx{flex:1;min-width:0}
.todo .it .tx b{font-weight:500;font-size:14.5px}
.todo .it .tx em{font-style:normal;color:var(--red);font-size:11.5px;margin-left:7px;letter-spacing:.03em}
.todo .it .tx div{font-size:12px;color:var(--ink3)}
.doit{height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--paper2);font-size:12.5px;color:var(--ink2);white-space:nowrap;flex:none}
.doit:hover{background:var(--accent);color:#fff;border-color:var(--accent)}

/* 热力图 */
.heat-wrap{overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.heat{display:grid;grid-template-columns:repeat(30,14px);gap:3px}
.heat i{width:14px;height:14px;border-radius:3px;background:var(--line2);display:block}
.heat i.l1{background:#CFDDD4}.heat i.l2{background:#A2BFAF}.heat i.l3{background:#6E9A83}.heat i.l4{background:var(--accent)}
.heat i.today{box-shadow:0 0 0 1.5px var(--clay)}

/* 封面墙 */
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:15px}
.cov{position:relative;aspect-ratio:3/4;border-radius:9px;overflow:hidden;background:var(--line2);display:flex;align-items:flex-end;padding:9px;color:#fff;font-size:13px;line-height:1.35;cursor:pointer;box-shadow:var(--sh)}
.cov img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cov .sd{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.02) 38%,rgba(0,0,0,.62))}
.cov .nm{position:relative;z-index:1;font-weight:500;text-shadow:0 1px 4px rgba(0,0,0,.45);word-break:break-word;max-height:56px;overflow:hidden}
.cov .st{position:absolute;top:8px;left:8px;z-index:1;font-size:10.5px;padding:2px 7px;border-radius:99px;background:rgba(255,255,255,.9);color:var(--ink)}
.stars{display:inline-flex;gap:1px;color:var(--gold)}
.stars.pick svg{cursor:pointer}

/* 周计划 */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.wd{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--paper);min-height:104px;display:flex;flex-direction:column;gap:6px}
.wd.today{border-color:var(--accent);background:var(--accent-soft)}
.wd .d{font-size:11px;letter-spacing:.1em;color:var(--ink3)}
.wd textarea{min-height:52px;font-size:13px;border:none;background:transparent;padding:0;resize:none;line-height:1.45}
.wd textarea:focus{box-shadow:none}
.wd .ck{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink3);margin-top:auto}

label.ckline{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:14px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none;margin:0}
.fileline{display:inline-flex;align-items:center;gap:7px;height:44px;padding:0 16px;border:1px dashed var(--line);border-radius:var(--rs);color:var(--ink2);font-size:14px;cursor:pointer;background:var(--paper)}
.fileline:hover{border-color:var(--accent);color:var(--accent)}

.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.mobile-only{display:none}

/* ---------- 响应式 ---------- */
@media(max-width:1000px){
  .shell{display:block;padding:0 15px}
  main{padding:16px 0 calc(74px + env(safe-area-inset-bottom))}
  .side{position:static;width:auto;padding:0;margin:0 -15px;border-bottom:1px solid var(--line);background:rgba(246,244,239,.94);backdrop-filter:blur(10px)}
  .side-t,.side-foot{display:none}
  .navi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 15px}
  .navi button{flex:none;border-radius:12px;padding:9px 4px;font-size:12.5px;border:1px solid transparent;min-height:0;flex-direction:column;gap:4px;text-align:center}
  .navi button.on{border-color:rgba(62,92,80,.2);background:var(--accent-soft)}
  .navi button svg{opacity:.7;flex:none}
  .navi button .cnt{margin-left:0;position:absolute;top:4px;right:8px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .hd .t{font-size:23px}
  .hd{flex-wrap:wrap;gap:8px}
  .stat{flex:1 1 45%;border-bottom:1px solid var(--line2)}
  .stat:nth-child(2n){border-right:none}
  .top-in{padding:9px 15px}
  .lbl{display:none}
  .pillbtn{padding:0 11px}
  .mobile-only{display:block}
  .week{grid-template-columns:repeat(2,1fr)}
  .modal{border-radius:14px}
}
@media(max-width:400px){ .wall{grid-template-columns:repeat(2,1fr)} }
@media print{.side,.top,.banners{display:none}}
</style>

</header>

function parseD(s){var p=String(s).split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(s,n){var d=parseD(s);d.setDate(d.getDate()+n);return dstr(d);}
function diffDays(a,b){return Math.round((parseD(a)-parseD(b))/86400000);}

function money(n){var neg=n<0;n=Math.abs(+n||0);var s=n.toFixed(2).replace(/\.00$/,'');var a=s.split('.');a[0]=a[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');return (neg?'-':'')+a.join('.');}
function moneyShort(n){n=Math.abs(+n||0);if(n>=10000)return (n/10000).toFixed(n>=100000?0:1)+'万';if(n>=1000)return (n/1000).toFixed(1)+'k';return money(n);}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

function relDay(s){var d=diffDays(s,TODAY());if(d===0)return '今天';if(d===1)return '明天';if(d===-1)return '昨天';if(d<0)return '逾期'+(-d)+'天';return d+'天后';}

/* 时间分桶：周/月/季/年 */
function cmpBuckets(range,today){
  var t=parseD(today),res=[],i;
  if(range==='week'){
    var dow=(t.getDay()+6)%7; // 周一为起点
    var cm=new Date(t.getFullYear(),t.getMonth(),t.getDate()-dow);
    for(i=9;i>=0;i--){
      var s=new Date(cm); s.setDate(cm.getDate()-i*7);
      var e=new Date(s); e.setDate(s.getDate()+6);
      res.push({label:(s.getMonth()+1)+'/'+s.getDate(),start:dstr(s),end:dstr(e)});
    }
  }else if(range==='quarter'){
    var q=Math.floor(t.getMonth()/3);
    for(i=7;i>=0;i--){
      var qi=q-i,yr=t.getFullYear();
      while(qi<0){qi+=4;yr--;}
      var qs=new Date(yr,qi*3,1), qe=new Date(yr,qi*3+3,0);
      res.push({label:(yr%100)+'Q'+(qi+1),start:dstr(qs),end:dstr(qe)});
    }
  }else if(range==='year'){
    for(i=4;i>=0;i--){
      var y=t.getFullYear()-i;
      res.push({label:''+y,start:y+'-01-01',end:y+'-12-31'});
    }
  }else{
    for(i=5;i>=0;i--){
      var d=new Date(t.getFullYear(),t.getMonth()-i,1), e=new Date(t.getFullYear(),t.getMonth()-i+1,0);
      res.push({label:(d.getMonth()+1)+'月',start:dstr(d),end:dstr(e)});
    }
  }
  res.forEach(function(bk){
    bk.a=0;bk.b=0;
    state.tx.forEach(function(x){ if(x.date>=bk.start&&x.date<=bk.end){ if(x.type==='expense')bk.a+=+x.amt; else bk.b+=+x.amt; } });
  });
  return res;
}

/* 时间轴对比柱状图（支出/收入分组） */
function cmpBarsSVG(groups){
  var W=680,H=238,pl=44,pr=10,pt=16,pb=28;
  var max=1; groups.forEach(function(g){ max=Math.max(max,g.a,g.b); });
  var p=Math.pow(10,Math.floor(Math.log(max)/Math.LN10)), niceMax=Math.ceil(max/p)*p;
  if(niceMax<max) niceMax+=p;
  var iw=W-pl-pr, ih=H-pt-pb, n=groups.length, gw=iw/n;
  var bw=Math.min(11,gw/3.4), off=bw/2+1;
  var s='';
  for(var i=0;i<=3;i++){
    var y=pt+ih*i/3, val=niceMax*(1-i/3);
    s+='<line x1="'+pl+'" y1="'+y+'" x2="'+(W-pr)+'" y2="'+y+'" stroke="var(--line2)" stroke-width="1"/>';
    s+='<text x="'+(pl-6)+'" y="'+(y+3.5)+'" text-anchor="end" style="font-size:9.5px;fill:var(--ink3)">'+(val>=1000?moneyShort(val):val)+'</text>';
  }
  groups.forEach(function(g,i){
    var cx=pl+gw*i+gw/2;
    var ha=ih*(g.a/niceMax), hb=ih*(g.b/niceMax);
    s+='<rect x="'+(cx-off-bw)+'" y="'+(pt+ih-ha)+'" width="'+bw+'" height="'+Math.max(0,ha)+'" rx="2.5" fill="var(--red)" opacity=".82"><title>'+g.label+' 支出 '+money(g.a)+'</title></rect>';
    s+='<rect x="'+(cx+off)+'" y="'+(pt+ih-hb)+'" width="'+bw+'" height="'+Math.max(0,hb)+'" rx="2.5" fill="var(--green)" opacity=".75"><title>'+g.label+' 收入 '+money(g.b)+'</title></rect>';
    s+='<text x="'+cx+'" y="'+(H-9)+'" text-anchor="middle" style="font-size:9px;fill:var(--ink3)">'+g.label+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" preserveAspectRatio="xMidYMid meet" style="display:block">'+s+'</svg>';
}

function load(){
  var raw=null;
  try{ raw=localStorage.getItem(KEY); }
  catch(e){ storeOK=false; setBanner('store','err','浏览器禁止访问本地存储（可能处于无痕模式），本次修改将不会被保存。',[]); }
  if(!raw){ state=seed(); save(true); return; }
  try{
    var o=JSON.parse(raw);
    if(!o||typeof o!=='object'||!Array.isArray(o.tx)||!Array.isArray(o.habits)) throw new Error('数据结构不完整');
    state=normalize(o);
  }catch(err){
    corruptRaw=raw;
    try{ localStorage.setItem(CKEY,raw); }catch(e){}
    state=seed();
    setTimeout(function(){ showRecovery(err.message); },60);
  }
}
function normalize(o){
  var d=seed(); d.demo=false;
  var keys=['tx','habits','body','events','wish','media'];
  keys.forEach(function(k){ if(!Array.isArray(o[k])) o[k]=[]; });
  o.settings=Object.assign({},d.settings,o.settings||{});
  o.meta=Object.assign({},d.meta,o.meta||{});
  o.plan=Object.assign({},o.plan||{});
  o.planDone=o.planDone||{};
  o.habits.forEach(function(h){ h.logs=h.logs||{}; h.type=h.type||'check'; });
  o.events.forEach(function(e){ e.doneDates=e.doneDates||[]; e.repeat=e.repeat||'once'; });
  o.v=1;
  return o;
}

function eventsToday(){
  var t=TODAY(), out=[];
  state.events.forEach(function(e){
    if(e.repeat==='once'){
      if(!e.done && e.date<=t) out.push({e:e,over:e.date<t,day:e.date});
    }else if(e.repeat==='daily'){
      if(e.date<=t && e.doneDates.indexOf(t)<0) out.push({e:e,over:false,day:t});
    }else if(e.repeat==='weekly'){
      if(e.date<=t && parseD(e.date).getDay()===parseD(t).getDay() && e.doneDates.indexOf(t)<0) out.push({e:e,over:false,day:t});
      else if(e.date<t && parseD(e.date).getDay()!==parseD(t).getDay()){
        var last=e.doneDates.length?e.doneDates[e.doneDates.length-1]:null;
        var lastDue=lastWeeklyDue(e.date,t);
        if(lastDue && (!last||last<lastDue)) out.push({e:e,over:true,day:lastDue});
      }
    }
  });
  out.sort(function(a,b){ return (b.over-a.over)||(a.e.pri-b.e.pri)||String(a.e.time).localeCompare(String(b.e.time)); });
  return out;
}
function lastWeeklyDue(start,t){
  var d=parseD(t), sd=parseD(start).getDay();
  for(var i=0;i<7;i++){ var s=addDays(t,-i); if(parseD(s).getDay()===sd && s>=start) return s; }
  return null;
}
function habitVal(h,d){ var v=h.logs[d]; return v==null?0:v; }
function habitDone(h,d){
  var v=habitVal(h,d);
  if(h.type==='check') return v>=1;
  return v>=(h.target||1);
}
function scores(){
  var t=TODAY(), d=parseD(t), y=d.getFullYear(), m=d.getMonth()+1;
  var mk=y+'-'+pad(m), dim=monthDays(y,m), dayN=d.getDate();
  var spent=0; state.tx.forEach(function(x){ if(x.type==='expense'&&ym(x.date)===mk) spent+=+x.amt; });
  var budget=+state.settings.budget||0;
  var expect=budget*dayN/dim;
  var sBudget=budget<=0?70:(spent<=expect?100:clamp(100-(spent/Math.max(1,expect)-1)*130,0,100));
  var hs=state.habits.length, hd=0; state.habits.forEach(function(h){ if(habitDone(h,t)) hd++; });
  var sHabit=hs?hd/hs*100:70;
  var evs=eventsToday(), overN=evs.filter(function(x){return x.over;}).length;
  var doneToday=0; state.events.forEach(function(e){
    if(e.repeat==='once'&&e.done&&e.date===t) doneToday++;
    if(e.repeat!=='once'&&e.doneDates.indexOf(t)>=0) doneToday++;
  });
  var totalToday=evs.length+doneToday;
  var sPlan=totalToday?clamp(doneToday/totalToday*100-overN*12,0,100):(overN?40:85);
  var b=state.body.slice().sort(function(a,c){return a.date<c.date?-1:1;});
  var sBody=50;
  if(b.length){
    var last=b[b.length-1], fresh=diffDays(t,last.date);

    if(b.length>=2){
      var prev=b[Math.max(0,b.length-4)], tw=+state.settings.tw||last.w;
      var moving=(last.w-prev.w);
      var wantDown=last.w>tw;
      if((wantDown&&moving<0)||(!wantDown&&Math.abs(moving)<0.4)) sBody=Math.min(100,sBody+12); else sBody=Math.max(20,sBody-10);
    }
  }
  var parts=[

    {k:'身体状态',v:sBody,c:'var(--blue)'},
    {k:'日程掌控',v:sPlan,c:'var(--violet)'}
  ];
  var total=parts.reduce(function(a,p){return a+p.v;},0)/parts.length;

     '</div>';

  var pie=Object.keys(byCat).map(function(k){return {k:k,v:byCat[k],c:catColor(k,'expense')};}).sort(function(a,b){return b.v-a.v;});
  var pieTotal=pie.reduce(function(a,x){return a+x.v;},0);

  /* 时间对比 —— 周/月/季/年 筛选 + 柱状图 */
  h+='<div class="sec"><div class="panel">'+
     '<div class="sec-h" style="border:none;padding:0;margin-bottom:10px">'+ic('money',16)+'<h3>收支对比</h3><span class="sp"></span>'+
     '<span class="xs muted"><span class="dot" style="display:inline-block;background:var(--red);opacity:.82"></span> 支出　<span class="dot" style="display:inline-block;background:var(--green);opacity:.75"></span> 收入</span></div>'+
     '<div class="chips" style="margin-bottom:12px">';
  [['week','周'],['month','月'],['quarter','季'],['year','年']].forEach(function(r){
    h+='<button class="chip'+(ui.cmpRange===r[0]?' on a':'')+'" data-act="cmpRange" data-id="'+r[0]+'">'+r[1]+'</button>';
  });
  h+='</div>'+
     '<div style="font-size:12px;color:var(--ink3);margin-bottom:6px">'+rngLabel+'　·　横轴为时间</div>'+
     cmpBarsSVG(groups)+'</div>';

  /* 消费结构 —— 环形图 + 右侧图例 */
  h+='<div class="sec" style="margin-top:12px"><div class="panel"><div class="sec-h" style="border:none;padding:0;margin-bottom:12px">'+ic('sparkle',16)+'<h3>消费结构</h3><span class="sp"></span>'+
     '<span class="num xs muted">'+cur.replace('-','年')+'月支出 <b style="color:var(--ink)">'+money(pieTotal)+'</b></span></div>';
  if(!pie.length){
    h+='<div class="empty">'+ic('money',26,1.4)+'本月还没有支出记录</div>';
  }else{
    h+='<div style="display:flex;gap:14px;align-items:center;overflow-x:auto;min-width:0">';
    h+=donutSVG(pie,118);
    h+='<div style="flex:1;min-width:130px;display:flex;flex-direction:column;gap:6px">';
    pie.slice(0,7).forEach(function(x){
      var pct=x.v/pieTotal*100;
      h+='<div style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer" data-act="filterCat" data-id="'+esc(x.k)+'">'+
         '<span class="dot" style="background:'+x.c+'"></span>'+
         '<span style="flex:1">'+esc(x.k)+'</span>'+
         '<span class="num muted" style="font-variant-numeric:tabular-nums">'+(pct>=10?pct.toFixed(0):pct.toFixed(1))+'%</span>'+
         '<span class="num" style="min-width:62px;text-align:right;font-variant-numeric:tabular-nums">'+money(x.v)+'</span></div>';
    });
    if(pie.length>7) h+='<div class="xs muted" style="font-size:11.5px">+ 其他 '+(pie.length-7)+' 项</div>';
    h+='</div></div>';
  }
  h+='</div></div>';

  /* 筛选 + 明细 */
  h+='<div class="sec"><div class="sec-h">'+ic('note',16)+'<h3>收支明细</h3><span class="n">'+list.length+' 笔</span><span class="sp"></span></div>';
  h+='<div style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px;align-items:center">'+
     '<select data-live="month" style="width:auto;min-width:130px;height:38px;font-size:14px">'+months.map(function(m){return '<option value="'+m+'"'+(m===cur?' selected':'')+'>'+m.replace('-','年')+'月</option>';}).join('')+'</select>'+
     '<div class="chips">';
  ['全部','expense','income'].forEach(function(v){
    h+='<button class="chip'+(ui.moneyType===v?' on':'')+'" data-act="filterType" data-id="'+v+'">'+(v==='全部'?'全部':v==='expense'?'支出':'收入')+'</button>';
  });
  h+='</div><div class="chips" style="flex:1">';
  var catsUsed=['全部'].concat(Object.keys(byCat));
  monAll.forEach(function(x){ if(x.type==='income'&&catsUsed.indexOf(x.cat)<0) catsUsed.push(x.cat); });
  if(catsUsed.indexOf(ui.moneyCat)<0) catsUsed.push(ui.moneyCat);
  catsUsed.forEach(function(c){ h+='<button class="chip'+(ui.moneyCat===c?' on a':'')+'" data-act="filterCat" data-id="'+esc(c)+'">'+esc(c)+'</button>'; });
  h+='</div></div>';

  if(!list.length){
    h+='<div class="rows"><div class="empty">'+ic('money',28,1.3)+'这个筛选条件下没有记录</div></div>';
  }else{
    h+='<div class="rows">';
    var curDay=null;
    list.forEach(function(x){
      if(x.date!==curDay){
        curDay=x.date;
        var dayExp=list.filter(function(z){return z.date===curDay&&z.type==='expense';}).reduce(function(a,z){return a+(+z.amt);},0);
        h+='<div class="daygrp"><span>'+md(x.date)+' '+wkOf(x.date)+(x.date===t?' · 今天':'')+'</span><span class="num">支出 ¥'+money(dayExp)+'</span></div>';
      }
      var flash=(x.id===ui._lastTx)?' flash':'';
      h+='<div class="row'+flash+'"><span class="dot" style="background:'+catColor(x.cat,x.type)+'"></span>'+
         '<div class="main"><div class="ttl">'+esc(x.cat)+(x.note?' <span class="muted sm">· '+esc(x.note)+'</span>':'')+'</div></div>'+
         '<div class="amt" style="color:'+(x.type==='expense'?'var(--red)':'var(--green)')+'">'+(x.type==='expense'?'-':'+')+money(x.amt)+'</div>'+
         '<button class="iconbtn" data-act="txDel" data-id="'+x.id+'" aria-label="删除">'+ic('trash',16)+'</button></div>';
    });
    ui._lastTx=null;
    h+='</div>';
  }
  h+='</div>';
  return h;
}

/* ============================================================
   三、习惯健康
   ============================================================ */
function renderHabit(){
  var t=TODAY();
  var h='';
  var doneN=state.habits.filter(function(x){return habitDone(x,t);}).length;
  h+='<div class="hd"><div class="t">习惯健康</div><div class="s">今天完成 '+doneN+' / '+state.habits.length+'</div><div class="sp"></div>'+
     '<button class="btn sec" data-act="habitToggleEdit">'+(ui.habitEdit?'完成编辑':ic('edit',15)+'<span class="lbl">管理习惯</span>')+'</button></div>';

  /* 新增 */
  if(ui.habitEdit){
    h+='<div class="sec"><div class="panel flat"><form data-form="habit">'+
       '<div class="grid" style="grid-template-columns:1fr 140px 110px 100px auto;gap:11px;align-items:end">'+
       '<div class="field"><label>习惯名称</label><input type="text" name="name" placeholder="如：冥想、护肤、不喝奶茶" required maxlength="24"></div>'+
       '<div class="field"><label>打卡方式</label><select name="type"><option value="check">勾选（做了就打勾）</option><option value="count">计数（累加次数）</option><option value="value">数值（记录数量）</option></select></div>'+
       '<div class="field"><label>每日目标</label><input type="number" name="target" value="1" min="1" step="1"></div>'+
       '<div class="field"><label>单位</label><input type="text" name="unit" placeholder="杯 / 分钟" maxlength="6"></div>'+
       '<button class="btn" type="submit">'+ic('plus',16)+'添加</button></div></form></div></div>';
  }

  if(!state.habits.length){
    h+='<div class="rows"><div class="empty">'+ic('habit',28,1.3)+'还没有习惯，点右上角「管理习惯」添加第一个</div></div>';
    return h;
  }

  /* 今日打卡 */
  h+='<div class="sec"><div class="sec-h">'+ic('check',16)+'<h3>今日打卡</h3><span class="sp"></span></div><div class="rows">';
  state.habits.forEach(function(hb){
    var v=habitVal(hb,t), ok=habitDone(hb,t), st=streak(hb);
    h+='<div class="row">'+
       '<span style="width:4px;height:30px;border-radius:2px;background:'+(ok?hb.color:'var(--line)')+';flex:none"></span>'+
       '<div class="main"><div class="ttl" style="'+(ok?'color:var(--ink2)':'')+'">'+esc(hb.name)+'</div>'+
       '<div class="sub">'+(hb.type==='check'?(ok?'今天已完成':'今天还没做'):v+' / '+hb.target+' '+esc(hb.unit||''))+
       (st>0?' · 连续 '+st+' 天':'')+'</div></div>';
    if(hb.type==='check'){
      h+='<button class="doit" data-act="hbCheck" data-id="'+hb.id+'" style="'+(ok?'background:'+hb.color+';color:#fff;border-color:'+hb.color:'')+'">'+(ok?'已打卡':'打卡')+'</button>';
    }else if(hb.type==='count'){
      h+='<div style="display:flex;align-items:center;gap:4px"><button class="iconbtn plain" data-act="hbDec" data-id="'+hb.id+'">'+ic('minus',16)+'</button>'+
         '<span class="num" style="min-width:34px;text-align:center;font-family:var(--serif);font-size:18px">'+v+'</span>'+
         '<button class="iconbtn plain" data-act="hbInc" data-id="'+hb.id+'">'+ic('plus',16)+'</button></div>';
    }else{
      h+='<input type="number" value="'+(v||'')+'" placeholder="0" data-live="hbVal" data-id="'+hb.id+'" style="width:88px;height:40px;text-align:right;font-size:15px" inputmode="decimal">'+
         '<span class="xs muted" style="width:26px">'+esc(hb.unit||'')+'</span>';
    }
    if(ui.habitEdit) h+='<button class="iconbtn" data-act="hbDel" data-id="'+hb.id+'">'+ic('trash',16)+'</button>';
    h+='</div>';
  });
  h+='</div></div>';

  /* 30 天热力图 */
  h+='<div class="sec"><div class="sec-h">'+ic('sparkle',16)+'<h3>近 30 天热力图</h3><span class="sp"></span>'+
     '<span class="xs muted">浅 → 深 表示完成度</span></div><div class="panel"><div class="heat-wrap">';
  state.habits.forEach(function(hb){
    var total=0,done=0;
    h+='<div style="display:flex;align-items:center;gap:12px;margin-bottom:11px;min-width:600px">'+
       '<span style="width:118px;flex:none;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(hb.name)+'">'+esc(hb.name)+'</span>'+
       '<div class="heat">';
    for(var i=29;i>=0;i--){
      var dd=addDays(t,-i), v=habitVal(hb,dd), tg=hb.type==='check'?1:(hb.target||1);
      var ratio=v/tg, lv=v<=0?0:ratio>=1?4:ratio>=0.66?3:ratio>=0.33?2:1;
      if(v>0) done++;
      total++;
      h+='<i class="'+(lv?'l'+lv:'')+(i===0?' today':'')+'" style="'+(lv===4?'background:'+hb.color:lv===3?'background:'+hb.color+'BB':lv===2?'background:'+hb.color+'77':lv===1?'background:'+hb.color+'3A':'')+'" title="'+dd+' · '+v+(hb.unit?hb.unit:'')+'"></i>';
    }
    h+='</div><span class="xs muted num" style="width:56px;text-align:right;flex:none">'+Math.round(done/total*100)+'%</span></div>';
  });
  h+='</div><div class="hr"></div><div class="sm muted">左侧为 30 天前，最右侧（陶土色描边）为今天。百分比 = 30 天内有记录的天数占比。</div></div></div>';

  /* 统计 */
  h+='<div class="sec"><div class="grid g3">';
  state.habits.forEach(function(hb){
    var last7=[],sum=0;
    for(var i=6;i>=0;i--){ var v=habitVal(hb,addDays(t,-i)); last7.push(v); sum+=v; }
    h+='<div class="panel"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">'+
       '<span class="dot" style="background:'+hb.color+'"></span><span style="font-size:13.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(hb.name)+'</span>'+
       '<span class="num xs muted">连续 '+streak(hb)+' 天</span></div>'+
       miniBars(last7,hb.color)+
       '<div class="xs muted" style="margin-top:6px">近 7 天合计 '+(hb.type==='check'?sum+' 次':sum+' '+esc(hb.unit||''))+'</div></div>';
  });
  h+='</div></div>';
  return h;
}


/* ============================================================
   四、减脂健身
   ============================================================ */
function bodySorted(){ return state.body.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0;}); }
function renderFit(){
  var t=TODAY(), b=bodySorted(), s=state.settings;
  var last=b[b.length-1]||null, first=b[0]||null;
  var hM=(+s.height||170)/100;
  var bmi=last?last.w/(hM*hM):0;
  var bmiTxt=bmi<18.5?'偏瘦':bmi<24?'正常':bmi<28?'超重':'肥胖';
  var bmiColor=bmi<18.5?'var(--blue)':bmi<24?'var(--green)':bmi<28?'var(--gold)':'var(--red)';
  var tw=+s.tw||0;
  var prog=0;
  if(first&&last&&Math.abs(first.w-tw)>0.01) prog=clamp((first.w-last.w)/(first.w-tw)*100,0,100);

  /* 7 日均线 */
  var pts=b.slice(-24).map(function(x){return {label:md(x.date).replace('月','/').replace('日',''),v:x.w,date:x.date};});
  var avg=pts.map(function(p,i){
    var win=[], base=parseD(p.date);
    b.forEach(function(x){ var dd=diffDays(p.date,x.date); if(dd>=0&&dd<7) win.push(x.w); });
    return {v:win.length>=2?win.reduce(function(a,c){return a+c;},0)/win.length:null};
  });

  /* 热量缺口 */
  var tdee=+s.tdee||1800;
  var todayRec=b.filter(function(x){return x.date===t;})[0];
  var todayDef=todayRec?(tdee+(+todayRec.burn||0)-(+todayRec.intake||0)):null;
  var week=b.filter(function(x){return diffDays(t,x.date)>=0&&diffDays(t,x.date)<7;});
  var weekDef=week.reduce(function(a,x){return a+(tdee+(+x.burn||0)-(+x.intake||0));},0);
  var predict=weekDef/7700;

  var h='';
  h+='<div class="hd"><div class="t">减脂健身</div><div class="s">'+(last?'最近记录 '+relDay(last.date):'暂无记录')+'</div><div class="sp"></div></div>';

  /* 关键指标 */
  h+='<div class="sec"><div class="stats">'+
    '<div class="stat"><div class="k">当前体重</div><div class="v">'+(last?last.w.toFixed(1):'—')+'<small>kg</small></div>'+
      '<div class="d">'+(b.length>1?(last.w-b[b.length-2].w>=0?'↑ +':'↓ ')+(last.w-b[b.length-2].w).toFixed(1)+' kg 较上次':'首次记录')+'</div></div>'+
    '<div class="stat"><div class="k">体脂率</div><div class="v">'+(last&&last.f?last.f.toFixed(1):'—')+'<small>%</small></div>'+
      '<div class="d">目标 '+(s.tf||'—')+'%</div></div>'+
    '<div class="stat"><div class="k">BMI</div><div class="v" style="color:'+bmiColor+'">'+(bmi?bmi.toFixed(1):'—')+'</div><div class="d">'+(bmi?bmiTxt+' · 身高 '+s.height+'cm':'先填身高')+'</div></div>'+
    '<div class="stat"><div class="k">今日热量缺口</div><div class="v" style="color:'+(todayDef==null?'var(--ink3)':todayDef>0?'var(--green)':'var(--red)')+'">'+(todayDef==null?'—':(todayDef>0?'+':'')+Math.round(todayDef))+'<small>kcal</small></div>'+
      '<div class="d">'+(todayDef==null?'今天还没记录摄入':'TDEE '+tdee+' + 运动 - 摄入')+'</div></div>'+
    '</div></div>';

  /* 记录 + 目标 */
  h+='<div class="sec"><div class="grid g2">';
  h+='<div class="panel"><div class="sec-h" style="border:none;padding:0;margin-bottom:12px">'+ic('plus',16)+'<h3>记录今天</h3></div><form data-form="body">'+
     '<div class="grid" style="grid-template-columns:repeat(2,1fr);gap:10px">'+
     '<div class="field"><label>日期</label><input type="date" name="date" value="'+t+'" required></div>'+
     '<div class="field"><label>体重 (kg)</label><input type="number" name="w" step="0.1" min="20" max="300" inputmode="decimal" placeholder="'+(last?last.w:'65.0')+'" required></div>'+
     '<div class="field"><label>体脂率 (%)</label><input type="number" name="f" step="0.1" min="3" max="60" inputmode="decimal" placeholder="'+(last&&last.f?last.f:'22.0')+'"></div>'+
     '<div class="field"><label>今日摄入 (kcal)</label><input type="number" name="intake" step="10" min="0" inputmode="numeric" placeholder="1700"></div>'+
     '<div class="field"><label>运动消耗 (kcal)</label><input type="number" name="burn" step="10" min="0" inputmode="numeric" placeholder="300"></div>'+
     '<div class="field"><label>&nbsp;</label><button class="btn wide" type="submit">保存记录</button></div>'+
     '</div></form></div>';

  h+='<div class="panel"><div class="sec-h" style="border:none;padding:0;margin-bottom:12px">'+ic('flag',16)+'<h3>目标进度</h3></div>'+
     '<div style="display:flex;flex-direction:column;align-items:center;gap:14px">'+
     ringSVG(prog,120,10,'var(--clay)',Math.round(prog)+'%','已完成')+
     '<div style="width:100%;font-size:13px;display:grid;grid-template-columns:1fr 1fr;gap:6px 16px">'+
     '<div style="display:flex;justify-content:space-between"><span class="muted">起始</span><span class="num">'+(first?first.w.toFixed(1):'—')+' kg</span></div>'+
     '<div style="display:flex;justify-content:space-between"><span class="muted">当前</span><span class="num">'+(last?last.w.toFixed(1):'—')+' kg</span></div>'+
     '<div style="display:flex;justify-content:space-between"><span class="muted">目标</span><span class="num" style="color:var(--clay)">'+tw+' kg</span></div>'+
     '<div style="display:flex;justify-content:space-between"><span class="muted">还差</span><span class="num">'+(last?Math.max(0,last.w-tw).toFixed(1):'—')+' kg</span></div>'+
     '</div></div>'+
     '<div class="hr"></div>'+
     '<div class="grid g3" style="gap:10px">'+
     '<div class="field"><label>身高(cm)</label><input type="number" value="'+s.height+'" data-live="height" style="height:38px;font-size:14px"></div>'+
     '<div class="field"><label>目标(kg)</label><input type="number" step="0.1" value="'+s.tw+'" data-live="tw" style="height:38px;font-size:14px"></div>'+
     '<div class="field"><label>TDEE</label><input type="number" step="50" value="'+s.tdee+'" data-live="tdee" style="height:38px;font-size:14px"></div>'+
     '</div></div>';
  h+='</div></div>';

  /* 曲线 */
  h+='<div class="sec"><div class="sec-h">'+ic('fit',16)+'<h3>体重趋势与 7 日均线</h3><span class="sp"></span>'+
     '<span class="xs muted">实线 = 每次称重　虚线 = 7 日移动平均</span></div>'+
     '<div class="panel">'+lineSVG(pts,avg,{goal:tw,h:236})+'</div></div>';

  /* 热量缺口 */
  h+='<div class="sec"><div class="grid g2">'+
     '<div class="panel"><div class="sec-h" style="border:none;padding:0;margin-bottom:10px">'+ic('sparkle',16)+'<h3>近 7 天热量缺口</h3></div>'+
     '<div style="display:flex;align-items:baseline;gap:10px"><span style="font-family:var(--serif);font-size:32px;color:'+(weekDef>=0?'var(--green)':'var(--red)')+'" class="num">'+(weekDef>=0?'+':'')+Math.round(weekDef)+'</span><span class="sm muted">kcal 累计</span></div>'+
     '<div class="sm muted" style="margin-top:6px">按 7700 kcal ≈ 1 kg 脂肪推算，理论上'+(predict>=0?'可减 ':'会增 ')+'<b style="color:var(--ink)">'+Math.abs(predict).toFixed(2)+' kg</b>。'+
     (week.length<3?'（记录天数偏少，仅供参考）':'')+'</div>'+
     '<div class="hr"></div>'+miniBars(week.map(function(x){return Math.max(0,tdee+(+x.burn||0)-(+x.intake||0));}),'var(--accent)')+
     '<div class="xs muted" style="margin-top:5px">仅显示正缺口，共 '+week.length+' 天有记录</div></div>';

  /* 记录列表 */
  h+='<div class="panel" style="padding:0;overflow:hidden"><div style="padding:14px 16px 10px;display:flex;align-items:center;gap:8px">'+ic('note',16)+'<h3 style="font-family:var(--serif);font-size:15.5px">称重记录</h3><span class="sp" style="flex:1"></span><span class="xs muted">'+b.length+' 条</span></div>';
  if(!b.length) h+='<div class="empty">还没有记录</div>';
  else{ h+='<div style="max-height:250px;overflow-y:auto">';
    b.slice().reverse().slice(0,30).forEach(function(x){
      h+='<div class="row" style="padding:9px 16px"><div class="main"><div class="ttl" style="font-size:13.5px">'+md(x.date)+' <span class="muted xs">'+wkOf(x.date)+'</span></div>'+

/* ============================================================
   五、日程统筹
   ============================================================ */
var PRI=[['','',''],[1,'重要','var(--red)'],[2,'一般','var(--gold)'],[3,'随缘','var(--ink3)']];
function evDoneOn(e,d){ return e.repeat==='once'?(e.done&&e.date===d):e.doneDates.indexOf(d)>=0; }
function evOnDay(e,d){
  if(e.repeat==='once') return e.date===d;
  if(e.date>d) return false;
  if(e.repeat==='daily') return true;
  if(e.repeat==='weekly') return parseD(e.date).getDay()===parseD(d).getDay();
  return false;
}
function renderPlan(){
  var t=TODAY(), h='';
  var todo=eventsToday();
  var allOpen=state.events.filter(function(e){return e.repeat!=='once'||!e.done;});
  var doneN=state.events.filter(function(e){return e.repeat==='once'&&e.done;}).length;
  var rate=state.events.length?Math.round(doneN/state.events.length*100):0;

  h+='<div class="hd"><div class="t">日程统筹</div><div class="s">'+todo.length+' 项待办'+(todo.filter(function(x){return x.over;}).length?' · '+todo.filter(function(x){return x.over;}).length+' 项逾期':'')+'</div><div class="sp"></div></div>';

  h+='<div class="sec"><div class="panel"><form data-form="event">'+
     '<div class="grid" style="grid-template-columns:1fr 140px 110px auto;gap:11px;align-items:end">'+
     '<div class="field"><label>事项</label><input type="text" name="title" placeholder="要做什么" required maxlength="40"></div>'+
     '<div class="field"><label>日期</label><input type="date" name="date" value="'+t+'" required></div>'+
     '<div class="field"><label>时间</label><input type="time" name="time"></div>'+
     '<button class="btn" type="submit">'+ic('plus',16)+'添加</button></div>'+
     '<div class="grid" style="grid-template-columns:repeat(3,1fr);gap:11px;margin-top:11px">'+
     '<div class="field"><label>标签</label><input type="text" name="tag" placeholder="工作 / 家人 / 健康" maxlength="8"></div>'+
     '<div class="field"><label>优先级</label><select name="pri"><option value="1">重要</option><option value="2" selected>一般</option><option value="3">随缘</option></select></div>'+
     '<div class="field"><label>重复</label><select name="repeat"><option value="once">不重复</option><option value="daily">每天</option><option value="weekly">每周</option></select></div>'+
     '</div></form></div></div>';

  /* 本周视图 */
  var mon=addDays(t,-((parseD(t).getDay()+6)%7));
  h+='<div class="sec"><div class="sec-h">'+ic('plan',16)+'<h3>本周概览</h3><span class="n">'+md(mon)+' - '+md(addDays(mon,6))+'</span><span class="sp"></span>'+
     '<span class="xs muted">总完成率 '+rate+'%</span></div><div class="week">';
  for(var i=0;i<7;i++){
    var dd=addDays(mon,i);
    var evs=state.events.filter(function(e){return evOnDay(e,dd);});
    h+='<div class="wd'+(dd===t?' today':'')+'" style="min-height:96px"><div class="d">'+WK[parseD(dd).getDay()]+' '+(+dd.slice(8))+'</div>';
    if(!evs.length) h+='<div class="xs muted" style="opacity:.6">—</div>';
    evs.slice(0,4).forEach(function(e){
      var ok=evDoneOn(e,dd);
      h+='<div style="font-size:12px;line-height:1.4;display:flex;gap:5px;'+(ok?'opacity:.42;text-decoration:line-through':'')+'">'+
         '<span class="dot" style="background:'+PRI[e.pri||2][2]+';margin-top:5px"></span><span style="flex:1;min-width:0;word-break:break-word">'+esc(e.title)+'</span></div>';
    });
    if(evs.length>4) h+='<div class="xs muted">+'+(evs.length-4)+'</div>';
    h+='</div>';
  }
  h+='</div></div>';

  /* 待办列表 */
  h+='<div class="sec"><div class="sec-h">'+ic('clock',16)+'<h3>待办与逾期</h3><span class="sp"></span></div>';
  if(!todo.length) h+='<div class="rows"><div class="empty">'+ic('check',26,1.3)+'当前没有待办</div></div>';
  else{
    h+='<div class="rows">';
    todo.forEach(function(x){
      var e=x.e;
      h+='<div class="row"'+(x.over?' style="background:linear-gradient(90deg,rgba(190,69,54,.05),transparent 60%)"':'')+'>'+
         '<span class="dot" style="background:'+PRI[e.pri||2][2]+'"></span>'+
         '<div class="main"><div class="ttl">'+esc(e.title)+(x.over?' <span style="color:var(--red);font-size:11.5px">· '+relDay(x.day)+'</span>':'')+'</div>'+
         '<div class="sub">'+(e.time?e.time+' · ':'')+(e.tag?esc(e.tag)+' · ':'')+PRI[e.pri||2][1]+(e.repeat!=='once'?' · '+(e.repeat==='daily'?'每天':'每周'+wkOf(e.date)):'')+'</div></div>';
      if(x.over&&e.repeat==='once') h+='<button class="doit" data-act="evPush" data-id="'+e.id+'">顺延到今天</button>';
      h+='<button class="doit" data-act="evDone" data-id="'+e.id+'" data-d="'+x.day+'">完成</button>'+
         '<button class="iconbtn" data-act="evDel" data-id="'+e.id+'">'+ic('trash',16)+'</button></div>';
    });
    h+='</div>';
  }
  h+='</div>';

  /* 已完成 */
  var done=state.events.filter(function(e){return e.repeat==='once'&&e.done;}).sort(function(a,b){return a.date<b.date?1:-1;}).slice(0,12);
  var upcoming=state.events.filter(function(e){return e.repeat==='once'&&!e.done&&e.date>t;}).sort(function(a,b){return a.date<b.date?-1:1;});
  if(upcoming.length){
    h+='<div class="sec"><div class="sec-h">'+ic('flag',16)+'<h3>接下来</h3><span class="sp"></span></div><div class="rows">';
    upcoming.slice(0,10).forEach(function(e){
      h+='<div class="row"><span class="dot" style="background:'+PRI[e.pri||2][2]+'"></span><div class="main"><div class="ttl">'+esc(e.title)+'</div>'+
         '<div class="sub">'+md(e.date)+' '+wkOf(e.date)+' '+(e.time||'')+' · '+relDay(e.date)+'</div></div>'+
         '<button class="iconbtn" data-act="evDel" data-id="'+e.id+'">'+ic('trash',16)+'</button></div>';
    });
    h+='</div></div>';
  }
  if(done.length){
    h+='<div class="sec"><div class="sec-h">'+ic('check',16)+'<h3>最近完成</h3><span class="n">'+done.length+'</span><span class="sp"></span></div><div class="rows">';
    done.forEach(function(e){
      h+='<div class="row" style="opacity:.62"><span style="color:var(--accent)">'+ic('check',15)+'</span><div class="main"><div class="ttl" style="text-decoration:line-through">'+esc(e.title)+'</div>'+
         '<div class="sub">'+md(e.date)+'</div></div><button class="iconbtn plain" data-act="evUndo" data-id="'+e.id+'">撤销</button>'+
         '<button class="iconbtn" data-act="evDel" data-id="'+e.id+'">'+ic('trash',16)+'</button></div>';
    });
    h+='</div></div>';
  }
  return h;
}

function renderWish(){
  var t=TODAY(), h='';
  var todo=state.wish.filter(function(w){return !w.bought;});
  var bought=state.wish.filter(function(w){return w.bought;});
  var sum=todo.reduce(function(a,w){return a+(+w.price||0);},0);

  var cool=todo.filter(function(w){return diffDays(t,w.added)>=7;});

  h+='<div class="hd"><div class="t">待买清单</div><div class="s">'+todo.length+' 件待定 · 合计 ¥'+money(sum)+'</div><div class="sp"></div></div>';

  h+='<div class="sec"><div class="panel"><form data-form="wish">'+
     '<div class="grid" style="grid-template-columns:1fr 120px 120px 130px auto;gap:11px;align-items:end">'+
     '<div class="field"><label>想买什么</label><input type="text" name="title" placeholder="物品名称" required maxlength="30"></div>'+
     '<div class="field"><label>预估价格</label><input type="number" name="price" step="0.01" min="0" inputmode="decimal" placeholder="0"></div>'+

     '<div class="field"><label>需求度</label><select name="need"><option value="5">5 · 非买不可</option><option value="4">4 · 很想要</option><option value="3" selected>3 · 一般</option><option value="2">2 · 可有可无</option><option value="1">1 · 随便看看</option></select></div>'+
     '<button class="btn" type="submit">'+ic('plus',16)+'加入</button></div></form></div></div>';

  h+='<div class="sec"><div class="stats">'+
     '<div class="stat"><div class="k">待买合计</div><div class="v">¥'+money(sum)+'</div><div class="d">'+todo.length+' 件</div></div>'+

     '<div class="stat"><div class="k">冷静期已过</div><div class="v" style="color:'+(cool.length?'var(--clay)':'var(--ink)')+'">'+cool.length+'<small>件</small></div><div class="d">加入超过 7 天仍未买</div></div>'+
     '<div class="stat"><div class="k">占月预算</div><div class="v">'+(state.settings.budget>0?Math.round(sum/state.settings.budget*100):0)+'<small>%</small></div><div class="d">月预算 ¥'+money(state.settings.budget)+'</div></div>'+
     '</div></div>';

  h+='<div class="sec"><div style="display:flex;gap:9px;margin-bottom:12px">'+
     '<div class="tabs" style="max-width:280px;flex:1">'+
     '<button class="'+(ui.wishView==='todo'?'on':'')+'" data-act="wishView" data-id="todo">想买 '+todo.length+'</button>'+
     '<button class="'+(ui.wishView==='bought'?'on':'')+'" data-act="wishView" data-id="bought">已买 '+bought.length+'</button>'+
     '</div></div>';

  var list=(ui.wishView==='todo'?todo:bought).slice().sort(function(a,b){
    if(ui.wishView==='todo') return (b.need-a.need)||(a.added<b.added?-1:1);
    return (b.boughtAt||'')<(a.boughtAt||'')?-1:1;
  });
  if(!list.length) h+='<div class="rows"><div class="empty">'+ic('wish',28,1.3)+'这里还是空的</div></div>';
  else{
    h+='<div class="rows">';
    list.forEach(function(w){
      var days=diffDays(t,w.added);
      h+='<div class="row"><div class="main"><div class="ttl">'+esc(w.title)+
         (w.cat?' <span class="tag">'+esc(w.cat)+'</span>':'')+'</div>'+
         '<div class="sub">'+stars(w.need)+' <span style="vertical-align:2px">· '+(w.bought?'已于 '+md(w.boughtAt||w.added)+' 入手':'加入 '+days+' 天'+(days>=7?' · 冷静期已过，还想要吗':''))+'</span></div></div>'+
         '<div class="amt">¥'+money(w.price)+'</div>';
      if(!w.bought) h+='<button class="doit" data-act="wishBuy" data-id="'+w.id+'">已买到</button>';
      else h+='<button class="doit" data-act="wishUnbuy" data-id="'+w.id+'">放回清单</button>';
      h+='<button class="iconbtn" data-act="wishDel" data-id="'+w.id+'">'+ic('trash',16)+'</button></div>';

       '如果这几天都没再想起它，也许可以删掉了。</div></div></div>';
  }
  return h;

var MSTATUS={wish:'想看',doing:'在看',done:'已完成'};
var MCOLOR={book:'#6E8C5A',movie:'#6D5B86',music:'#4A6B8A'};
function coverBg(m){
  var seed=0; for(var i=0;i<m.title.length;i++) seed+=m.title.charCodeAt(i);
  var hues=[[28,45],[152,38],[210,40],[275,32],[8,42],[186,36]];
  var p=hues[seed%hues.length];
  return 'linear-gradient(150deg,hsl('+p[0]+','+p[1]+'%,52%),hsl('+((p[0]+34)%360)+','+(p[1]-8)+'%,34%))';
}
function renderMedia(){
  var t=TODAY(), year=t.slice(0,4), h='';

    if(ui.mediaFilter==='全部') return true;

     '<button class="btn" type="submit">'+ic('plus',16)+'收藏</button></div>'+
     '<div class="field" style="margin-top:11px"><input type="text" name="note" placeholder="一句话短评（可选）" maxlength="80"></div>'+
     '</form></div></div>';

  /* 年度统计 */
  h+='<div class="sec"><div class="grid g2">'+
     '<div class="panel"><div class="sec-h" style="border:none;padding:0;margin-bottom:12px">'+ic('media',16)+'<h3>'+year+' 年度统计</h3></div>'+
     '<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">';

       '<span style="width:52px;flex:none" class="stars xs">'+r+' 星</span>'+

       '<span class="num xs muted" style="width:22px;text-align:right">'+rateDist[r-1]+'</span></div>';
  }
  h+='<div class="xs muted" style="margin-top:8px">统计口径：'+year+' 年内标记为「已完成」的条目</div></div>';
  h+='</div></div>';

  /* 筛选 */
  h+='<div class="sec"><div class="chips" style="margin-bottom:13px">';
  [['全部','全部'],['book','书'],['movie','影视'],['music','音乐'],['wish','想看'],['doing','在看'],['done','已完成']].forEach(function(f){

         '<span class="st">'+MTYPE[m.type]+' · '+MSTATUS[m.status]+'</span>'+
         '<span class="nm">'+esc(m.title)+(m.rate?'<br><span style="font-size:11px;opacity:.9">'+'★'.repeat(m.rate)+'</span>':'')+'</span></div>';

   ============================================================ */
function dataSize(){
  try{ var s=localStorage.getItem(KEY)||''; return (s.length/1024).toFixed(1); }catch(e){ return '?'; }
}
function counts(){
  return [['收支记录',state.tx.length],['习惯',state.habits.length],['身体记录',state.body.length],
          ['日程',state.events.length],['待买',state.wish.length],['书影音',state.media.length]];
}
function renderData(){
  var h='';
  var total=counts().reduce(function(a,c){return a+c[1];},0);
  var demoN=['tx','habits','body','events','wish','media'].reduce(function(a,k){return a+state[k].filter(function(x){return x._d;}).length;},0);
  h+='<div class="hd"><div class="t">数据备份</div><div class="s">共 '+total+' 条记录 · 占用 '+dataSize()+' KB</div><div class="sp"></div></div>';

  h+='<div class="sec"><div class="panel"><div class="sec-h" style="border:none;padding:0;margin-bottom:12px">'+ic('data',16)+'<h3>备份与恢复</h3></div>'+
     '<div class="sm muted" style="margin-bottom:14px">所有数据只保存在这台设备的浏览器里，不会上传到任何服务器。清理浏览器数据、换设备、换浏览器都会导致丢失，所以<b style="color:var(--ink)">请定期导出一份 JSON 存到网盘或发给自己</b>。</div>'+
     '<div style="display:flex;gap:10px;flex-wrap:wrap">'+
     ''+
     ''+
     ''+
     '</div>'+
     '<div class="hr"></div>'+
     '<div class="sm"><span class="muted">上次备份：</span>'+(state.meta.lastBackup?esc(state.meta.lastBackup):'从未备份')+
     '　<span class="muted">未备份新增：</span><b class="num" style="color:'+((state.meta.since||0)>=20?'var(--red)':'var(--ink)')+'">'+(state.meta.since||0)+'</b> 条</div>'+
     '</div></div>';

  h+='<div class="sec"><div class="grid g2">';
  h+='<div class="panel"><div class="sec-h" style="border:none;padding:0;margin-bottom:10px">'+ic('note',16)+'<h3>数据构成</h3></div>';
  counts().forEach(function(c){
    h+='<div style="display:flex;font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--line2)"><span class="muted">'+c[0]+'</span><span style="flex:1"></span><span class="num">'+c[1]+' 条</span></div>';

     '<div class="sm muted" style="margin-bottom:12px">演示数据是首次打开时预置的示例，用于让你立刻看到效果。删除它们不会影响你自己录入的内容。</div>'+
     '<button class="btn sec wide" data-act="clearDemo"'+(demoN?'':' disabled style="opacity:.45"')+'>清空演示数据（'+demoN+' 条）</button>'+
     '<div style="height:9px"></div>'+
     '<button class="btn danger wide" data-act="clearAll">清空全部数据</button>'+
     '<div class="xs muted" style="margin-top:10px">清空全部会删除本工作台的所有记录，操作不可撤销，会要求二次确认。</div></div>';
  h+='</div></div>';

  h+='<div class="sec"><div class="panel flat"><div class="sec-h" style="border:none;padding:0;margin-bottom:10px">'+ic('sparkle',16)+'<h3>把它装进手机</h3></div>'+
     '<div class="sm" style="line-height:1.85">'+
     '<b>iPhone</b>：用 Safari 打开 → 底部分享按钮 → 「添加到主屏幕」<br>'+
     '<b>Android</b>：用 Chrome 打开 → 右上角菜单 → 「添加到主屏幕 / 安装应用」<br>'+
     '<b>电脑</b>：直接把这个 HTML 文件存到桌面，双击即可，无需联网。<br>'+
     '<span class="muted">注意：手机和电脑的数据是各自独立的，跨设备同步请用「导出 JSON → 导入恢复」。</span></div></div></div>';
  return h;
}

function storageHTML(){
  if(STORAGE_HTML) return STORAGE_HTML;
  try{
    var bin = atob(STORAGE_B64);
    var bytes = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    var _d = new TextDecoder('utf-8').decode(bytes);
    var _k = _d.indexOf('</head>');
    STORAGE_HTML = (_k >= 0) ? (_d.slice(0,_k) + STORAGE_BRIDGE + _d.slice(_k)) : (_d + STORAGE_BRIDGE);
  }catch(e){ STORAGE_HTML = '<p style="padding:24px;color:#b00">收纳盒加载失败：'+ (e && e.message ? e.message : e) +'</p>'; }
  return STORAGE_HTML;
}
function renderStorage(){
  var f = document.createElement('iframe');
  f.id = 'storageFrame';
  f.title = '收纳盒';
  f.setAttribute('style','width:100%;height:calc(100vh - 150px);min-height:560px;border:0;background:#F6F4EF;display:block');
  f.setAttribute('sandbox','allow-scripts allow-same-origin allow-forms allow-modals');
  f.srcdoc = storageHTML();
  return '<div class="storage-wrap">'+ f.outerHTML +'</div>';
}

function render(){
  var sc=null;
  try{ sc=scores(); }catch(e){ sc={evs:[],over:0}; }
  var pending=sc.evs.length;
  var nav='';
  TABS.forEach(function(tb){
    var cnt='';
    if(tb[0]==='today'&&pending) cnt='<span class="cnt">'+pending+'</span>';
    nav+='<button data-nav="'+tb[0]+'" class="'+(view===tb[0]?'on':'')+'">'+ic(tb[2],17)+'<span>'+tb[1]+'</span>'+cnt+'</button>';
  });
  $('#navi').innerHTML=nav;

function getHabit(id){ return state.habits.filter(function(h){return h.id===id;})[0]; }
function getEvent(id){ return state.events.filter(function(e){return e.id===id;})[0]; }

document.addEventListener('click',function(ev){

function act(a,id,el){
  var t=TODAY();
  switch(a){
    case 'go': view=id; render(); window.scrollTo({top:0,behavior:'smooth'}); return;

    /* 记账 */
    case 'txDel': confirm2('删除这笔记录？','删除后无法恢复。',function(){ state.tx=state.tx.filter(function(x){return x.id!==id;}); commit(0); toast('已删除'); }); return;
    case 'filterCat': ui.moneyCat=(ui.moneyCat===id?'全部':id); if(view!=='money'){view='money';} render(); return;
    case 'filterType': ui.moneyType=id; render(); return;
    case 'cmpRange': ui.cmpRange=id; render(); return;
    case 'exportCSV': exportCSV(); return;

    /* 习惯 */
    case 'habitToggleEdit': ui.habitEdit=!ui.habitEdit; render(); return;
    case 'hbCheck': { var h=getHabit(id); if(!h)return; if(h.logs[t]>=1) delete h.logs[t]; else h.logs[t]=1; commit(h.logs[t]?1:0); return; }
    case 'hbInc': { var h2=getHabit(id); if(!h2)return; h2.logs[t]=(+h2.logs[t]||0)+1; commit(1); return; }
    case 'hbDec': { var h3=getHabit(id); if(!h3)return; var v=(+h3.logs[t]||0)-1; if(v<=0) delete h3.logs[t]; else h3.logs[t]=v; commit(0); return; }
    case 'hbDel': { var h4=getHabit(id); if(!h4)return;
      confirm2('删除习惯「'+h4.name+'」？','该习惯的所有打卡历史会一并删除。',function(){ state.habits=state.habits.filter(function(x){return x.id!==id;}); commit(0); toast('已删除'); }); return; }

    /* 身体 */
    case 'bodyDel': confirm2('删除这条称重记录？','',function(){ state.body=state.body.filter(function(x){return x.id!==id;}); commit(0); }); return;

    /* 日程 */
    case 'evDone': { var e=getEvent(id); if(!e)return;
      if(e.repeat==='once'){ e.done=true; }
      else { var d=el.dataset.d||t; if(e.doneDates.indexOf(d)<0) e.doneDates.push(d); e.doneDates=e.doneDates.slice(-90); }
      commit(0); toast('已完成：'+e.title); return; }
    case 'evUndo': { var e2=getEvent(id); if(!e2)return; e2.done=false; commit(0); return; }
    case 'evPush': { var e3=getEvent(id); if(!e3)return; e3.date=t; commit(0); toast('已顺延到今天'); return; }
    case 'evDel': confirm2('删除这个日程？','',function(){ state.events=state.events.filter(function(x){return x.id!==id;}); commit(0); }); return;

    /* 待买 */
    case 'wishView': ui.wishView=id; render(); return;
    case 'wishBuy': { var w=state.wish.filter(function(x){return x.id===id;})[0]; if(!w)return; w.bought=true; w.boughtAt=t; commit(0); toast('已标记为入手'); return; }
    case 'wishUnbuy': { var w2=state.wish.filter(function(x){return x.id===id;})[0]; if(!w2)return; w2.bought=false; delete w2.boughtAt; commit(0); return; }
    case 'wishDel': confirm2('从清单中删除？','',function(){ state.wish=state.wish.filter(function(x){return x.id!==id;}); commit(0); }); return;

    /* 书影音 */
    case 'mediaView': ui.mediaView=id; render(); return;
    case 'mediaFilter': ui.mediaFilter=id; render(); return;
    case 'mediaOpen': mediaEditor(id); return;
    case 'mediaDel': confirm2('删除这条收藏？','',function(){ state.media=state.media.filter(function(x){return x.id!==id;}); commit(0); }); return;
    case 'mRate': { var m=state.media.filter(function(x){return x.id===id;})[0]; if(!m)return;
      m.rate=+el.dataset.v; save();
      var box=el.parentNode; box.innerHTML=stars(m.rate,true,'mRate',m.id).replace(/^<span[^>]*>|<\/span>$/g,''); return; }

    /* 数据 */
    case 'clearDemo': {
      var n=0;
      ['tx','habits','body','events','wish','media'].forEach(function(k){
        var before=state[k].length; state[k]=state[k].filter(function(x){return !x._d;}); n+=before-state[k].length;
      });
      state.demo=false; save(); render(); toast('已清空 '+n+' 条演示数据'); return; }
    case 'clearAll':
      confirm2('确认清空全部数据？','这会删除记账、习惯、身体、日程、待买、书影音的所有记录，且无法撤销。建议先导出一份备份。',function(){
        ['tx','habits','body','events','wish','media'].forEach(function(k){ state[k]=[]; });
        state.plan={}; state.planDone={}; state.demo=false; state.meta.since=0;
        save(); render(); toast('已清空全部数据');
      },'确认清空');
      return;
  }
}

/* 全局动作 */
function globalAct(g,el){
  switch(g){
    case 'export': exportJSON(); return;
    case 'import': $('#fileImport').value=''; $('#fileImport').click(); return;
    case 'dismissBackup': state.meta.since=0; save(); clearBanner('backup'); return;
    case 'closeBanner': clearBanner(el.dataset.id); return;
    case 'dlCorrupt': download('生活工作台-损坏数据副本-'+TODAY()+'.txt',corruptRaw||localStorage.getItem(CKEY)||'','text/plain;charset=utf-8'); return;
    case 'resetFresh': closeModal(); state=seed(); save(); render(); toast('已重置为演示数据'); return;
  }
}
function modalAct(g){
  if(g==='cancel'){ closeModal(); return; }
  if(g==='cancel2'){ closeModal(); if(modalCb){ var f=modalCb; modalCb=null; f(); } return; }
  if(g==='pickCover'){ $('#fileCover').value=''; $('#fileCover').click(); return; }
  if(g==='rmCover'){ var m0=state.media.filter(function(x){return x.id===window.__editId;})[0]; if(m0){ m0.cover=''; save(); } closeModal(); render(); return; }
  if(g==='delMedia'){ var id=window.__editId; closeModal();
    confirm2('删除这条收藏？','',function(){ state.media=state.media.filter(function(x){return x.id!==id;}); commit(0); }); return; }
  if(g==='saveMedia'){
    var m=state.media.filter(function(x){return x.id===window.__editId;})[0];
    if(m){ m.title=($('#mTitle').value||'').trim()||m.title; m.type=$('#mType').value; m.status=$('#mStatus').value; m.note=($('#mNote').value||'').trim(); }
    closeModal(); commit(0); toast('已保存'); return;
  }
  if(g==='import'){ closeModal(); $('#fileImport').click(); return; }
  if(g==='dlCorrupt'){ globalAct('dlCorrupt'); return; }
  if(g==='resetFresh'){ globalAct('resetFresh'); return; }
  if(g==='mergeImport'||g==='replaceImport'){ applyImport(g==='mergeImport'); return; }
}

/* ---------- 导入导出 ---------- */
function download(name,content,mime){
  var blob=new Blob([content],{type:mime||'application/json;charset=utf-8'});
  var url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },400);
}
function exportJSON(){
  var payload=JSON.stringify(state,null,1);
  download('生活工作台-备份-'+TODAY()+'.json',payload);
  state.meta.lastBackup=TODAY(); state.meta.since=0; save(); clearBanner('backup'); render();
  toast('备份已导出，记得存到网盘');
}
function exportCSV(){
  var cur=ui.moneyMonth||TODAY().slice(0,7);
  var rows=state.tx.filter(function(x){return ym(x.date)===cur;}).sort(function(a,b){return a.date<b.date?-1:1;});
  if(!rows.length){ toast('本月没有记录可导出'); return; }
  var out='日期,类型,分类,金额,备注\r\n';
  rows.forEach(function(x){
    out+=[x.date,(x.type==='expense'?'支出':'收入'),x.cat,(x.type==='expense'?-x.amt:x.amt),'"'+String(x.note||'').replace(/"/g,'""')+'"'].join(',')+'\r\n';
  });
  var exp=rows.filter(function(x){return x.type==='expense';}).reduce(function(a,x){return a+(+x.amt);},0);
  var inc=rows.filter(function(x){return x.type==='income';}).reduce(function(a,x){return a+(+x.amt);},0);
  out+='\r\n合计,支出,'+exp+',收入,'+inc+'\r\n结余,,'+(inc-exp)+',,\r\n';
  download('记账明细-'+cur+'.csv','\ufeff'+out,'text/csv;charset=utf-8');
  toast('已导出，可直接用 Excel / WPS 打开');
}
var pendingImport=null;
$('#fileImport').addEventListener('change',function(){
  var f=this.files&&this.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var o=JSON.parse(r.result);
      if(!o||typeof o!=='object'||(!Array.isArray(o.tx)&&!Array.isArray(o.habits))) throw new Error('不是本工作台的备份文件');
      pendingImport=o;
      var n=['tx','habits','body','events','wish','media'].reduce(function(a,k){return a+(Array.isArray(o[k])?o[k].length:0);},0);
      modal('导入备份','文件校验通过，共 <b>'+n+'</b> 条记录。<br><br><b>覆盖</b>：清空当前数据，完全使用备份内容。<br><b>合并</b>：保留当前数据，把备份中新的记录追加进来（按 ID 去重）。',
        [['取消','cancel'],['合并追加','mergeImport','sec'],['覆盖导入','replaceImport','']]);
    }catch(err){
      modal('导入失败','这个文件无法解析：'+esc(err.message)+'<br><br>请确认选择的是本工作台导出的 <code>.json</code> 备份文件，且文件没有被截断。',[['知道了','cancel']]);
    }
  };
  r.onerror=function(){ modal('读取失败','浏览器无法读取该文件，请重试或换一个文件。',[['知道了','cancel']]); };
  r.readAsText(f);
});
function applyImport(merge){
  var o=pendingImport; if(!o){ closeModal(); return; }
  var keys=['tx','habits','body','events','wish','media'];
  if(merge){
    keys.forEach(function(k){
      if(!Array.isArray(o[k])) return;
      var ids={}; state[k].forEach(function(x){ ids[x.id]=1; });
      o[k].forEach(function(x){ if(!x.id) x.id=uid(); if(!ids[x.id]) state[k].push(x); });
    });
    state.plan=Object.assign({},o.plan||{},state.plan);
    state.planDone=Object.assign({},o.planDone||{},state.planDone);
  }else{
    state=normalize(o);
  }
  state.meta.since=0; state.meta.lastBackup=state.meta.lastBackup||TODAY();
  save(); closeModal(); pendingImport=null; clearBanner('backup'); render();
  toast(merge?'已合并导入':'已覆盖导入');
}

/* ---------- 封面上传：压缩后转 base64 ---------- */
$('#fileCover').addEventListener('change',function(){
  var f=this.files&&this.files[0]; if(!f) return;
  var withCover=state.media.filter(function(m){return m.cover;}).length;
  var m=state.media.filter(function(x){return x.id===window.__editId;})[0];
  if(!m) return;
  if(withCover>=9&&!m.cover){ toast('封面最多保存 9 张，请先移除一些'); return; }
  var r=new FileReader();
  r.onload=function(){
    var img=new Image();
    img.onload=function(){
      var maxW=400, sc=Math.min(1,maxW/img.width);
      var cv=document.createElement('canvas');
      cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      try{
        m.cover=cv.toDataURL('image/jpeg',0.72);
        save();
        if(!storeOK){ m.cover=''; save(); toast('空间不足，封面未能保存'); }
        else toast('封面已保存');
      }catch(e){ toast('图片处理失败'); }
      closeModal(); render();
    };
    img.onerror=function(){ toast('图片读取失败'); };
    img.src=r.result;
  };
  r.readAsDataURL(f);
});
