*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f8f8fc;--card:#fff;--pri:#7c3aed;--pri-l:#a855f7;--grn:#10b981;--red:#ef4444;--amb:#f59e0b;--txt:#1f2937;--txt2:#6b7280;--brd:#e5e7eb;--shd:0 1px 3px rgba(0,0,0,.08);--rd:12px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
#app{min-height:100vh}
/* Nav: desktop sidebar */
.nav-sidebar{position:fixed;left:0;top:0;bottom:0;width:200px;background:#fff;border-right:1px solid var(--brd);padding:20px 0;display:flex;flex-direction:column;z-index:100}
.nav-sidebar .logo{padding:0 20px 20px;font-size:18px;font-weight:700;background:linear-gradient(135deg,var(--pri),var(--pri-l));-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:flex;align-items:center;gap:8px}
.nav-sidebar .nav-items{flex:1;display:flex;flex-direction:column;gap:4px;padding:0 12px}
.nav-sidebar .nav-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border:none;background:transparent;border-radius:8px;cursor:pointer;font-size:15px;color:var(--txt2);transition:all .2s;width:100%;text-align:left}
.nav-sidebar .nav-item.active{background:linear-gradient(135deg,var(--pri),var(--pri-l));color:#fff;font-weight:600}
.nav-sidebar .nav-item:hover:not(.active){background:#f3f0ff}
/* Nav: tablet top */
.nav-top{display:none;background:#fff;border-bottom:1px solid var(--brd);padding:0 16px;position:sticky;top:0;z-index:100}
.nav-top .nav-inner{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:8px;height:56px}
.nav-top .logo{font-size:17px;font-weight:700;background:linear-gradient(135deg,var(--pri),var(--pri-l));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-right:auto}
.nav-top .nav-item{display:flex;align-items:center;gap:6px;padding:8px 16px;border:none;background:transparent;border-radius:8px;cursor:pointer;font-size:14px;color:var(--txt2);border-bottom:2px solid transparent}
.nav-top .nav-item.active{color:var(--pri);border-bottom-color:var(--pri);font-weight:600}
/* Nav: mobile bottom */
.nav-bottom{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--brd);z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nav-bottom .nav-items{display:flex;height:56px}
.nav-bottom .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:transparent;cursor:pointer;font-size:11px;color:var(--txt2);padding:4px}
.nav-bottom .nav-item.active{color:var(--pri);font-weight:600}
.nav-bottom .nav-item svg{width:22px;height:22px}
/* Main content */
.main{margin-left:200px;padding:24px;min-height:100vh}
.main-tab-top{padding-top:70px}
.main-tab-bottom{padding-bottom:70px}
.tab-content{display:none;animation:fadeIn .3s ease}
.tab-content.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
/* Cards */
.card{background:var(--card);border-radius:var(--rd);box-shadow:var(--shd);padding:16px;margin-bottom:12px;border:1px solid var(--brd)}
.card-overdue{border-left:4px solid var(--red);background:#fef2f2}
.card-rest{border-left:4px solid var(--amb);background:#fffbeb}
.card-broken{border-left:4px solid var(--red);background:#fef2f2}
.card-complete{border-left:4px solid var(--grn);background:#f0fdf4}
/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;transition:all .2s;min-height:44px}
.btn-primary{background:linear-gradient(135deg,var(--pri),var(--pri-l));color:#fff}
.btn-primary:hover{opacity:.9;transform:translateY(-1px)}
.btn-success{background:var(--grn);color:#fff}
.btn-danger{background:var(--red);color:#fff}
.btn-warning{background:var(--amb);color:#fff}
.btn-ghost{background:transparent;border:1px solid var(--brd);color:var(--txt2)}
.btn-ghost:hover{background:#f9fafb}
.btn-sm{padding:6px 12px;font-size:13px;min-height:36px}
.btn-block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* Forms */
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:14px;font-weight:600;margin-bottom:6px;color:var(--txt)}
.form-input,.form-select,.form-textarea{width:100%;padding:10px 12px;border:1px solid var(--brd);border-radius:8px;font-size:16px;font-family:inherit;background:#fff;color:var(--txt);outline:none;transition:border-color .2s}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--pri)}
.form-textarea{resize:vertical;min-height:80px}
.form-hint{font-size:13px;color:var(--txt2);margin-top:4px}
.form-row{display:flex;gap:12px}
.form-row .form-group{flex:1}
/* Color picker */
.color-picker{display:flex;gap:8px;flex-wrap:wrap}
.color-opt{width:36px;height:36px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all .2s}
.color-opt.selected{border-color:#fff;box-shadow:0 0 0 2px var(--pri)}
/* Progress ring */
.progress-ring{display:inline-block;vertical-align:middle}
/* Stats */
.stat-row{display:flex;gap:16px;flex-wrap:wrap}
.stat-item{text-align:center;flex:1;min-width:80px}
.stat-num{font-size:22px;font-weight:700;color:var(--txt)}
.stat-label{font-size:12px;color:var(--txt2);margin-top:2px}
/* Today handle */
.handle-item{display:flex;align-items:center;gap:10px;padding:12px;border-radius:8px;margin-bottom:8px;font-size:14px}
.handle-item .handle-icon{flex-shrink:0}
.handle-item .handle-text{flex:1}
.handle-item .handle-action{flex-shrink:0}
/* Record item */
.record-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:6px;background:#f9fafb;margin-bottom:6px;font-size:13px}
.record-item .rec-date{font-weight:600;min-width:70px}
.record-item .rec-amount{color:var(--pri);font-weight:600}
.record-item .rec-time{color:var(--txt2)}
.record-item .rec-badge{background:var(--amb);color:#fff;font-size:11px;padding:2px 6px;border-radius:4px;font-weight:600}
.record-item .rec-del{margin-left:auto;cursor:pointer;color:var(--txt2);background:none;border:none;padding:4px}
.record-item .rec-del:hover{color:var(--red)}
/* Modal */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center;padding:20px}
.modal-overlay.active{display:flex}
.modal{background:#fff;border-radius:16px;max-width:480px;width:100%;max-height:90vh;overflow-y:auto;padding:24px;animation:slideUp .3s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.modal-title{font-size:18px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.modal-close{margin-left:auto;cursor:pointer;background:none;border:none;font-size:20px;color:var(--txt2);padding:4px}
/* Toast */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;z-index:300;animation:toastIn .3s ease;max-width:90vw;text-align:center}
.toast.error{background:var(--red)}
.toast.success{background:var(--grn)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
/* Sync status */
.sync-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;font-size:13px;font-weight:600}
.sync-synced{background:#f0fdf4;color:var(--grn)}
.sync-syncing{background:#fef3c7;color:var(--amb)}
.sync-error{background:#fef2f2;color:var(--red)}
.sync-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
/* Loading */
.loading{text-align:center;padding:40px;color:var(--txt2)}
.loading .spinner{width:32px;height:32px;border:3px solid var(--brd);border-top-color:var(--pri);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
/* Empty state */
.empty{text-align:center;padding:32px 16px;color:var(--txt2)}
.empty svg{width:48px;height:48px;margin:0 auto 12px;opacity:.4}
/* Confetti */
.confetti-piece{position:fixed;top:-10px;width:10px;height:10px;z-index:400;pointer-events:none}
@keyframes confettiFall{0%{transform:translateY(-10vh) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
/* Section title */
.section-title{font-size:16px;font-weight:700;margin:20px 0 12px;display:flex;align-items:center;gap:8px}
.section-title .count{background:var(--pri);color:#fff;font-size:12px;padding:2px 8px;border-radius:10px}
/* Weekly */
.week-selector{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.week-arrow{cursor:pointer;background:none;border:none;padding:8px;color:var(--pri);font-size:18px}
.week-label{font-weight:600;font-size:15px}
.week-compare{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.week-compare .wc-item{flex:1;min-width:100px;background:#f9fafb;border-radius:8px;padding:12px;text-align:center}
.wc-num{font-size:20px;font-weight:700}
.wc-label{font-size:12px;color:var(--txt2);margin-top:2px}
.wc-delta{font-size:13px;font-weight:600;margin-top:4px}
.wc-delta.up{color:var(--grn)}
.wc-delta.down{color:var(--red)}
.wc-delta.flat{color:var(--txt2)}
/* Guide steps */
.guide-step{display:flex;gap:12px;margin-bottom:16px;align-items:flex-start}
.guide-num{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pri-l));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.guide-text{flex:1;font-size:14px;color:var(--txt);line-height:1.5}
/* Chart container */
.chart-container{overflow-x:auto;padding:4px 0}
/* Responsive */
@media(max-width:1024px){
.nav-sidebar{display:none}
.nav-top{display:block}
.main{margin-left:0;max-width:900px;margin:0 auto;padding:16px}
.main-tab-top{padding-top:72px}
}
@media(max-width:768px){
.nav-top{display:none}
.nav-bottom{display:block}
.main{margin-left:0;padding:12px;padding-bottom:80px}
.form-row{flex-direction:column}
.stat-row{gap:8px}
.stat-item{min-width:60px}
.stat-num{font-size:18px}
.goal-card-grid{grid-template-columns:1fr!important}
}
/* Goal card grid */
.goal-card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
/* Obstacle plan */
.obstacle-plan{background:#f5f3ff;border-radius:8px;padding:12px;margin-top:12px;font-size:13px}
.obstacle-plan .op-label{font-weight:600;color:var(--pri);margin-bottom:4px}
.obstacle-plan .op-text{color:var(--txt)}
</style>
</head>

function daysBetween(d1,d2){return Math.round((d2-d1)/86400000)}
function getMonday(d){var r=new Date(d);var day=r.getDay();var diff=r.getDate()-day+(day===0?-6:1);r.setDate(diff);r.setHours(0,0,0,0);return r}
function getSunday(m){var r=new Date(m);r.setDate(r.getDate()+6);return r}
function addDays(d,n){var r=new Date(d);r.setDate(r.getDate()+n);return r}
function isSameDay(d1,d2){return dateStr(d1)===dateStr(d2)}
/* ====== DB query all ====== */
function queryAll(dbId,sorts,filter){
var DATABASE_ID=dbId;
var all=[];
function page(cursor){
var p={databaseId:DATABASE_ID,pageSize:100};
if(sorts)p.sorts=sorts;
if(filter)p.filter=filter;
if(cursor)p.startCursor=cursor;
return db.query(p).then(function(r){
all=all.concat(r.results||[]);
if(r.hasMore&&r.nextCursor)return page(r.nextCursor);
return all;
});
}
return page(null);
}

/* ====== Business logic ====== */
function getGoalRecords(gid){
return records.filter(function(r){return r['目标ID']===gid});
}
function getCompletedAmount(gid){
var recs=getGoalRecords(gid);
var sum=0;
recs.forEach(function(r){sum+=(r['数量']||0)});
return sum;
}
function getGoalById(gid){
return goals.find(function(g){return g._id===gid});
}
function calcTodaySuggested(goal){
var total=goal['总量']||0;
var completed=getCompletedAmount(goal._id);
var remaining=total-completed;
if(remaining<=0)return 0;
var deadline=parseDate(goal['截止日']);
var today=new Date();today.setHours(0,0,0,0);
var days=daysBetween(today,deadline)+1;
if(days<=0)return remaining;
return Math.ceil(remaining/days*10)/10;
}
/* Consecutive days with rest day logic */
function calcConsecutiveDays(gid){
var recs=getGoalRecords(gid);
var recDates={};
recs.forEach(function(r){
var d=parseDate(r['日期']);
if(d){var key=dateStr(d);recDates[key]=(recDates[key]||0)+(r['数量']||0)}
});
var today=new Date();today.setHours(0,0,0,0);
var streak=0;
var d=new Date(today);
while(true){
var ds=dateStr(d);
var hasRec=recDates[ds]>0;
if(hasRec){streak++;d=addDays(d,-1);continue}
/* No record - check if rest day */
var monday=getMonday(d);
var misses=0;
var wkEnd=getSunday(monday);
var cd=new Date(monday);
while(cd<=d&&cd<=today){
if(cd<today){
var cds=dateStr(cd);
if(!(recDates[cds]>0))misses++;
}
cd=addDays(cd,1);
}
if(misses===1){streak++;d=addDays(d,-1);continue}
/* second miss or more - break */
break;
}
return streak;
}
/* Check if yesterday was missed and what type */
function checkYesterdayMiss(gid){
var recs=getGoalRecords(gid);
var recDates={};
recs.forEach(function(r){var d=parseDate(r['日期']);if(d)recDates[dateStr(d)]=true});
var today=new Date();today.setHours(0,0,0,0);
var yesterday=addDays(today,-1);
var ydStr=dateStr(yesterday);
if(recDates[ydStr])return null; /* checked in */
/* Yesterday missed - determine rest day or broken */
var monday=getMonday(yesterday);
var misses=0;
var cd=new Date(monday);
while(cd<=yesterday){
if(!(recDates[dateStr(cd)]))misses++;
cd=addDays(cd,1);
}
if(misses===1)return'rest'; /* first miss = rest day */
return'broken';
}
/* Estimated completion date */
function calcEstimatedCompletion(gid){
var recs=getGoalRecords(gid);
var today=new Date();today.setHours(0,0,0,0);
var sevenAgo=addDays(today,-6);
var totalQty=0;
var hasRecords=false;
recs.forEach(function(r){
var d=parseDate(r['日期']);
if(d&&d>=sevenAgo&&d<=today){totalQty+=(r['数量']||0);hasRecords=true}
});
if(!hasRecords)return null;
var avg=totalQty/7;
if(avg<=0)return null;
var goal=getGoalById(gid);
if(!goal)return null;
var remaining=(goal['总量']||0)-getCompletedAmount(gid);
if(remaining<=0)return{date:today,done:true};
var days=Math.ceil(remaining/avg);
var estDate=addDays(today,days);
return{date:estDate,done:false,avg:avg};
}

/* ====== Render: Stacked bar chart ====== */
function renderChart(){
var el=document.getElementById('chart-area');
if(!el)return;
var today=new Date();today.setHours(0,0,0,0);
var days=[];
for(var i=13;i>=0;i--){
days.push(addDays(today,-i));
}
var maxMins=0;
var dayData=days.map(function(d){
var ds=dateStr(d);
var goalMins={};
records.forEach(function(r){
if(dateStr(parseDate(r['日期']))===ds&&r['分钟']>0){
var gn=r['目标名称']||'未知';
goalMins[gn]=(goalMins[gn]||0)+r['分钟'];
}
});
var total=0;
for(var k in goalMins)total+=goalMins[k];
if(total>maxMins)maxMins=total;
return{date:d,goals:goalMins,total:total};
});
if(maxMins===0){
el.innerHTML='<div class="empty"><p>近14天还没有填写投入分钟的记录</p></div>';
return;
}
var barW=28,gap=14,chartH=160,labelH=24,padding=10;
var totalW=days.length*(barW+gap);
var svgW=Math.max(totalW,300);
var colors=['#7c3aed','#3b82f6','#10b981','#f59e0b','#ec4899'];
var colorIdx={};
var ci=0;
goals.forEach(function(g){if(!(g['目标名称']in colorIdx)){colorIdx[g['目标名称']]=colors[ci%colors.length];ci++}});
var svg='<svg viewBox="0 0 '+svgW+' '+(chartH+labelH+20)+' width="'+svgW+'" height="'+(chartH+labelH+20)+'" style="max-width:100%">';
days.forEach(function(dd,i){
var x=i*(barW+gap)+gap/2;
var y=chartH;
for(var gn in dd.goals){
var h=maxMins>0?(dd.goals[gn]/maxMins*chartH):0;
y-=h;
svg+='<rect x="'+x+'" y="'+y+'" width="'+barW+'" height="'+h+'" fill="'+(colorIdx[gn]||'#7c3aed')+'" rx="2"/>';
}
svg+='<text x="'+(x+barW/2)+'" y="'+(chartH+labelH)+'" text-anchor="middle" font-size="10" fill="#6b7280">'+(dd.date.getMonth()+1)+'/'+dd.date.getDate()+'</text>';
});
svg+='</svg>';
el.innerHTML=svg;
}

return d>=lastMonday&&d<=lastSunday;
});

lastMins+=(r['分钟']||0);

});

/* Compare */
function delta(cur,prev){
if(prev===0)return cur>0?'+∞':'持平';
var pct=Math.round((cur-prev)/prev*100);
if(pct>0)return'+'+pct+'%';
if(pct<0)return pct+'%';
return'持平';
}
function deltaClass(d){return d.indexOf('+')===0?'up':(d.indexOf('-')===0?'down':'flat')}
var qtyDelta=delta(totalQty,lastQty);
var dayDelta=delta(dayCount,lastDayCount);
var minDelta=delta(totalMins,lastMins);

}
html+='</div>';
}

window.generateReportText=function(){
var today=new Date();today.setHours(0,0,0,0);
var targetMonday=addDays(getMonday(today),weekOffset*7);
var targetSunday=getSunday(targetMonday);
var weekRecs=records.filter(function(r){
var d=parseDate(r['日期']);
return d>=targetMonday&&d<=targetSunday;
});
var totalQty=0,checkinDays={},totalMins=0;
var goalStats={};
weekRecs.forEach(function(r){
totalQty+=(r['数量']||0);
totalMins+=(r['分钟']||0);
checkinDays[dateStr(parseDate(r['日期']))]=true;
var gn=r['目标名称']||'未知';
if(!goalStats[gn])goalStats[gn]={qty:0,mins:0};
goalStats[gn].qty+=(r['数量']||0);
goalStats[gn].mins+=(r['分钟']||0);
});
var dayCount=Object.keys(checkinDays).length;
/* Last week */
var lastMonday=addDays(targetMonday,-7);
var lastSunday=addDays(targetSunday,-7);
var lastRecs=records.filter(function(r){
var d=parseDate(r['日期']);
return d>=lastMonday&&d<=lastSunday;
});
var lastQty=0,lastDays={},lastMins=0;
lastRecs.forEach(function(r){
lastQty+=(r['数量']||0);
lastMins+=(r['分钟']||0);
lastDays[dateStr(parseDate(r['日期']))]=true;
});
var lastDayCount=Object.keys(lastDays).length;
function deltaStr(cur,prev){
if(prev===0)return cur>0?'（新增）':'';
var pct=Math.round((cur-prev)/prev*100);
return'环比'+(pct>0?'+'+pct:pct)+'%';
}
var text='学习周报\n';
text+=dateCN(targetMonday)+' - '+dateCN(targetSunday)+'\n\n';
text+='本周投入：';
var parts=[];
for(var gn in goalStats){
parts.push(gn+' '+goalStats[gn].qty);
}
text+=parts.join(' / ')+'\n';
text+='打卡天数：'+dayCount+'天\n';
text+='总投入时间：'+totalMins+'分钟\n\n';
text+='上周对比：投入量'+deltaStr(totalQty,lastQty);
text+='，打卡天数'+deltaStr(dayCount,lastDayCount);
text+='，时间'+deltaStr(totalMins,lastMins)+'\n\n';
text+='【保持】'+(document.getElementById('rev-keep').value||'—')+'\n';
text+='【问题】'+(document.getElementById('rev-problem').value||'—')+'\n';
text+='【尝试】'+(document.getElementById('rev-try').value||'—')+'\n';
text+='【下周预案】'+(document.getElementById('rev-plan').value||'—');
var el=document.getElementById('report-output');
el.style.display='block';
el.className='card';
el.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b>周报文本</b><button class="btn btn-ghost btn-sm" onclick="copyReport()">复制</button></div><pre style="white-space:pre-wrap;font-size:13px;line-height:1.8;background:#f9fafb;padding:12px;border-radius:8px">'+text.replace(/</g,'&lt;')+'</pre>';
window._reportText=text;
};
window.copyReport=function(){
if(window._reportText){
var ta=document.createElement('textarea');
ta.value=window._reportText;
document.body.appendChild(ta);
ta.select();
try{document.execCommand('copy');showToast('已复制到剪贴板','success')}catch(e){showToast('复制失败','error')}
document.body.removeChild(ta);
}
};

/* ====== Toast & confetti ====== */

var area=document.getElementById('toast-area');

t.textContent=msg;
area.appendChild(t);

}

function showConfetti(){
var container=document.getElementById('confetti-container');
var colors=['#7c3aed','#a855f7','#10b981','#f59e0b','#ef4444','#3b82f6','#ec4899'];
for(var i=0;i<50;i++){
var piece=document.createElement('div');
piece.className='confetti-piece';
piece.style.left=Math.random()*100+'%';
piece.style.background=colors[Math.floor(Math.random()*colors.length)];
piece.style.borderRadius=Math.random()>0.5?'50%':'0';
piece.style.animation='confettiFall '+(2+Math.random()*2)+'s ease-in forwards';
piece.style.animationDelay=Math.random()*0.5+'s';
container.appendChild(piece);
(function(p){setTimeout(function(){p.remove()},4500)})(piece);
}
}
