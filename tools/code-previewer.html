<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>代码预览器</title>
<!-- CodeMirror 5 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/monokai.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<style>
  :root {
    --accent: #6366f1;
    --accent-2: #8b5cf6;
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #111a2e;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --border: #334155;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); overflow: hidden;
  }

  .app { display: flex; flex-direction: column; height: 100vh; }

  /* ===== 编辑器视图 ===== */
  .view-edit { flex: 1; display: flex; flex-direction: column; min-height: 0; }

  .header {
    flex: 0 0 54px; display: flex; align-items: center; gap: 10px;
    padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: 6px; }
  .brand .logo {
    width: 34px; height: 34px; border-radius: 9px; font-size: 17px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
  }
  .brand .name { font-size: 16px; font-weight: 700; white-space: nowrap; }
  .brand .sub { font-size: 11px; color: var(--muted); }
  .h-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .btn {
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    font-size: 13px; padding: 8px 13px; border-radius: 9px; cursor: pointer;
    display: flex; align-items: center; gap: 6px; transition: .15s; white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); color: #fff; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn.danger { border-color: #7f1d1d; color: #fca5a5; }
  .btn.danger:hover { background: rgba(239, 68, 68, .15); border-color: #ef4444; color: #fff; }

  .tabs { flex: 0 0 42px; display: flex; gap: 4px; padding: 6px 14px 0; background: var(--panel); border-bottom: 1px solid var(--border); }
  .tab {
    padding: 8px 20px; border: none; background: transparent; color: var(--muted);
    font-size: 13px; font-weight: 600; cursor: pointer; border-radius: 8px 8px 0 0; transition: .15s;
  }
  .tab:hover { color: #fff; }
  .tab.active { background: var(--panel-2); color: #fff; box-shadow: inset 0 2px 0 var(--accent); }

  .editor-wrap { flex: 1; min-height: 0; position: relative; }
  .editor-wrap .CodeMirror { position: absolute; inset: 0; height: 100%; font-size: 13.5px; line-height: 1.55; }
  .editor-wrap textarea { display: none; }

  .statusbar {
    flex: 0 0 30px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px; background: var(--panel); border-top: 1px solid var(--border);
    font-size: 12px; color: var(--muted);
  }
  .status { color: #34d399; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status.err { color: #f87171; }

  /* ===== 预览视图 ===== */
  .view-preview { flex: 1; display: none; flex-direction: column; min-height: 0; }
  .preview-topbar {
    flex: 0 0 48px; display: flex; align-items: center; gap: 12px;
    padding: 0 14px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .back-btn {
    display: flex; align-items: center; gap: 7px;
    background: var(--accent); color: #fff; border: none; border-radius: 9px;
    padding: 8px 16px; font-size: 13.5px; font-weight: 600; cursor: pointer; transition: .15s;
  }
  .back-btn:hover { filter: brightness(1.1); }
  .preview-title { font-size: 13.5px; color: var(--muted); }
  .preview-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .preview-err {
    flex: 0 0 auto; font-size: 12.5px; color: #f87171; max-width: 45%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .preview-frame { flex: 1; min-height: 0; background: #fff; }
  iframe#preview { width: 100%; height: 100%; border: none; background: #fff; display: block; }

  /* Toast */
  #toast {
    position: fixed; bottom: 44px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #111a2e; color: #fff; padding: 11px 20px; border-radius: 10px;
    font-size: 13.5px; opacity: 0; pointer-events: none; transition: .25s; z-index: 80;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .3);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Mobile */
  @media (max-width: 760px) {
    .header { flex-wrap: wrap; height: auto; padding: 10px 12px; gap: 8px; }
    .brand .sub { display: none; }
    .h-actions { width: 100%; justify-content: flex-end; }
    .btn { padding: 7px 11px; font-size: 12.5px; }
    .preview-title { display: none; }
  }
</style>
<script src="https://beacon.cdn.qq.com/sdk/4.5.9/beacon_web.min.js"></script>
<script>
(function(){
  try{
    var beacon=new BeaconAction({
      appkey:'0WEB06U85YBSLJNL',
      versionCode:'1.0.0',
      channelID:'share',
      delay:1000,
      sessionDuration:30*60*1000,
      isOversea:false,
      needReportRqdEvent:false
    });
    beacon.onDirectUserAction('preview_page_view',{
      'url':location.href,
      'referrer':document.referrer,
      'title':document.title,
      'sandbox_id':'740fe80d9897445b980904ad9357ddfa'
    });
  }catch(e){}
})();
</script></head>
<body>
<div class="app">

  <!-- ===== 编辑器视图 ===== -->
  <section class="view-edit" id="viewEdit">
    <header class="header">
      <div class="brand">
        <div class="logo">🧪</div>
        <div>
          <div class="name">代码预览器</div>
          <div class="sub">HTML / CSS / JS</div>
        </div>
      </div>
      <div class="h-actions">
        <button class="btn danger" id="clearBtn" title="清空全部代码">🗑️ 清空</button>
        <button class="btn" id="loadBtn" title="从本地打开 HTML 文件">📂 载入</button>
        <button class="btn" id="saveBtn" title="把当前代码导出为 HTML 文件">📤 导出 HTML</button>
        <button class="btn" id="exampleBtn" title="加载示例代码">✨ 示例</button>
        <button class="btn primary" id="runBtn">▶ 预览</button>
        <input type="file" id="fileInput" accept=".html,.htm,text/html" style="display:none">
      </div>
    </header>

    <div class="tabs" id="tabs">
      <button class="tab active" data-lang="html">HTML</button>
      <button class="tab" data-lang="css">CSS</button>
      <button class="tab" data-lang="js">JS</button>
    </div>
    <div class="editor-wrap">
      <textarea id="htmlInput"></textarea>
      <textarea id="cssInput"></textarea>
      <textarea id="jsInput"></textarea>
    </div>

    <footer class="statusbar">
      <span>代码预览器</span>
      <span class="status" id="status">就绪</span>
    </footer>
  </section>

  <!-- ===== 预览视图 ===== -->
  <section class="view-preview" id="viewPreview">
    <div class="preview-topbar">
      <button class="back-btn" id="backBtn">← 返回代码</button>
      <span class="preview-title">预览效果</span>
      <span class="preview-err" id="previewErr"></span>
      <div class="preview-actions">
        <button class="btn" id="previewExportBtn" title="把当前代码导出为 HTML 文件">📤 导出 HTML</button>
        <button class="btn" id="reloadPreview" title="重新渲染预览">⟳ 刷新</button>
      </div>
    </div>
    <div class="preview-frame">
      <iframe id="preview" title="代码预览"></iframe>
    </div>
  </section>

</div>

<div id="toast"></div>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };

  // ===== 示例代码 =====
  var EXAMPLE = {
    html: `<div class="card">
  <div class="badge">✨ 每日一签</div>
  <h1 id="greet">你好，世界！</h1>
  <p id="time" class="time">--:--:--</p>
  <p class="tip">这是一段由 HTML + CSS + JS 渲染的实时效果。</p>
  <button id="btn">换个颜色</button>
</div>`,

    css: `* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
}
.card {
  width: 340px; padding: 34px 30px; border-radius: 20px; text-align: center;
  background: rgba(255, 255, 255, 0.95); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
  transition: all 0.3s ease;
}
.badge {
  display: inline-block; padding: 5px 16px; font-size: 13px; border-radius: 999px;
  background: #eef2ff; color: #6366f1; font-weight: 600; margin-bottom: 14px;
}
.card h1 { font-size: 26px; color: #1e293b; margin-bottom: 10px; }
.card .time { font-size: 32px; font-weight: 700; color: #6366f1; margin: 8px 0; font-variant-numeric: tabular-nums; }
.card .tip { font-size: 13px; color: #64748b; margin-bottom: 20px; }
.card button {
  padding: 10px 26px; border: none; border-radius: 12px; font-size: 14px; font-weight: 600;
  background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
}
.card button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4); }`,

    js: `var colors = ['#6366f1', '#10b981', '#f59e0b', '#ef4444', '#ec4899'];
var idx = 0;
var btn = document.getElementById('btn');
var greet = document.getElementById('greet');
var timeEl = document.getElementById('time');

function tick() {
  var d = new Date();
  var p = function (n) { return String(n).padStart(2, '0'); };
  timeEl.textContent = p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}
setInterval(tick, 1000);
tick();

btn.addEventListener('click', function () {
  idx = (idx + 1) % colors.length;
  timeEl.style.color = colors[idx];
  greet.textContent = '换色成功！🎨';
  setTimeout(function () { greet.textContent = '你好，世界！'; }, 1200);
});`
  };

  // ===== 编辑器 =====
  var editors = {};
  function makeEditor(key, mode, textareaId) {
    editors[key] = CodeMirror.fromTextArea(document.getElementById(textareaId), {
      mode: mode,
      theme: 'monokai',
      lineNumbers: true,
      lineWrapping: true,
      tabSize: 2,
      indentUnit: 2,
      autoCloseBrackets: true,
      matchBrackets: true,
      viewportMargin: 50,
    });
    editors[key].on('change', debounceSave);
  }
  makeEditor('html', 'xml', 'htmlInput');
  makeEditor('css', 'css', 'cssInput');
  makeEditor('js', 'javascript', 'jsInput');

  // ===== Tab 切换 =====
  var tabs = document.querySelectorAll('#tabs .tab');
  tabs.forEach(function (t) {
    t.addEventListener('click', function () {
      tabs.forEach(function (x) { x.classList.remove('active'); });
      t.classList.add('active');
      Object.keys(editors).forEach(function (k) {
        editors[k].display.wrapper.style.display = (k === t.dataset.lang) ? '' : 'none';
      });
      editors[t.dataset.lang].refresh();
    });
  });
  Object.keys(editors).forEach(function (k) {
    if (k !== 'html') editors[k].display.wrapper.style.display = 'none';
  });

  // ===== 状态栏 / Toast =====
  var statusEl = $('#status');
  function setStatus(msg, isErr) {
    statusEl.textContent = msg;
    statusEl.classList.toggle('err', !!isErr);
  }
  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._t);
    t._t = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }

  // ===== 构建完整文档 =====
  function buildFullDoc(withBridge) {
    var html = editors.html.getValue();
    var css = editors.css.getValue();
    var js = editors.js.getValue();
    var bridge = withBridge
      ? '\n<script>\nwindow.addEventListener("error", function (e) { try { window.parent.postMessage({ type: "preview-error", msg: e.message + " (行 " + e.lineno + ")" }, "*"); } catch (_) {} });\nwindow.addEventListener("unhandledrejection", function (e) { try { window.parent.postMessage({ type: "preview-error", msg: "Promise 错误: " + ((e.reason && (e.reason.message || e.reason)) || e.reason) }, "*"); } catch (_) {} });\n<\/script>'
      : '';
    return '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n' +
      '<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n' +
      '<title>代码预览</title>\n<style>' + css + '</style>\n</head>\n<body>\n' + html +
      bridge + '\n<script>\n' + js + '\n<\/script>\n</body>\n</html>';
  }

  // ===== 视图切换（hash 路由）=====
  var previewErrEl = $('#previewErr');
  var iframe = $('#preview');

  function renderPreview() {
    iframe.srcdoc = buildFullDoc(true);
    previewErrEl.textContent = '';
  }

  function showView(name) {
    var edit = $('#viewEdit');
    var prev = $('#viewPreview');
    if (name === 'preview') {
      edit.style.display = 'none';
      prev.style.display = 'flex';
      renderPreview();
    } else {
      prev.style.display = 'none';
      edit.style.display = 'flex';
    }
  }

  function gotoPreview() {
    if (location.hash === '#preview') { showView('preview'); } else { location.hash = '#preview'; }
  }
  function gotoEdit() {
    location.hash = '#edit';
  }

  $('#runBtn').addEventListener('click', gotoPreview);
  $('#backBtn').addEventListener('click', gotoEdit);
  $('#reloadPreview').addEventListener('click', function () {
    renderPreview();
    toast('已刷新预览');
  });

  window.addEventListener('hashchange', function () {
    showView(location.hash === '#preview' ? 'preview' : 'edit');
  });

  // ===== 预览错误回传 =====
  window.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'preview-error') {
      previewErrEl.textContent = '⚠️ ' + e.data.msg;
    }
  });

  // ===== 清空 =====
  $('#clearBtn').addEventListener('click', function () {
    if (!confirm('确定清空全部代码？此操作不可撤销。')) return;
    editors.html.setValue('');
    editors.css.setValue('');
    editors.js.setValue('');
    try {
      localStorage.removeItem('previewer_html');
      localStorage.removeItem('previewer_css');
      localStorage.removeItem('previewer_js');
    } catch (e) {}
    setStatus('已清空');
    toast('已清空全部代码');
  });

  // ===== 保存 / 载入 HTML 文件 =====
  function saveHTMLFile() {
    var doc = buildFullDoc(false);
    var blob = new Blob([doc], { type: 'text/html;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var d = new Date();
    var p = function (n) { return String(n).padStart(2, '0'); };
    var defaultName = '导出HTML-' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) +
      '-' + p(d.getHours()) + p(d.getMinutes()) + '.html';

    // 让用户指定文件名
    var name = prompt('请输入导出文件名：', defaultName);
    if (name === null) { // 用户取消
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      return;
    }
    name = name.trim();
    if (!name) name = defaultName;
    if (!/\.html?$/i.test(name)) name += '.html';

    a.href = url;
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    toast('已导出 HTML 文件：' + name);
  }

  function loadHTMLFile(file) {
    var reader = new FileReader();
    reader.onload = function (e) {
      var text = e.target.result;

      var cssMatch = text.match(/<style[^>]*>([\s\S]*?)<\/style>/i);
      var css = cssMatch ? cssMatch[1] : '';

      var js = '';
      var scriptRe = /<script[^>]*>([\s\S]*?)<\/script>/gi;
      var m;
      while ((m = scriptRe.exec(text)) !== null) {
        if (m[1] && m[1].trim()) js = m[1];
      }

      var bodyMatch = text.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
      var bodyHtml = bodyMatch ? bodyMatch[1] : text;
      bodyHtml = bodyHtml.replace(/<script[\s\S]*?<\/script>/gi, '');
      if (!bodyMatch) {
        bodyHtml = bodyHtml.replace(/<head[\s\S]*?<\/head>/gi, '');
        bodyHtml = bodyHtml.replace(/<!DOCTYPE[^>]*>/i, '');
        bodyHtml = bodyHtml.replace(/<\/?html[^>]*>/gi, '');
        bodyHtml = bodyHtml.replace(/<\/?body[^>]*>/gi, '');
      }

      editors.html.setValue(bodyHtml.trim());
      editors.css.setValue(css.trim());
      editors.js.setValue(js.trim());
      saveCode();
      setStatus('已载入，点击「预览」查看效果');
      toast('已载入 HTML 文件');
    };
    reader.readAsText(file, 'utf-8');
  }

  $('#saveBtn').addEventListener('click', saveHTMLFile);
  $('#previewExportBtn').addEventListener('click', saveHTMLFile);
  $('#loadBtn').addEventListener('click', function () { $('#fileInput').click(); });
  $('#fileInput').addEventListener('change', function (e) {
    if (e.target.files && e.target.files[0]) loadHTMLFile(e.target.files[0]);
    e.target.value = '';
  });

  // ===== 示例 =====
  $('#exampleBtn').addEventListener('click', function () {
    editors.html.setValue(EXAMPLE.html);
    editors.css.setValue(EXAMPLE.css);
    editors.js.setValue(EXAMPLE.js);
    saveCode();
    setStatus('已加载示例，点击「预览」查看效果');
  });

  // ===== 本地持久化 =====
  function saveCode() {
    try {
      localStorage.setItem('previewer_html', editors.html.getValue());
      localStorage.setItem('previewer_css', editors.css.getValue());
      localStorage.setItem('previewer_js', editors.js.getValue());
    } catch (e) {}
  }
  var saveTimer = null;
  function debounceSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveCode, 600);
  }
  function loadCode() {
    var h = null, c = null, j = null;
    try {
      h = localStorage.getItem('previewer_html');
      c = localStorage.getItem('previewer_css');
      j = localStorage.getItem('previewer_js');
    } catch (e) {}
    if (h !== null && h !== '') editors.html.setValue(h); else editors.html.setValue(EXAMPLE.html);
    if (c !== null && c !== '') editors.css.setValue(c); else editors.css.setValue(EXAMPLE.css);
    if (j !== null && j !== '') editors.js.setValue(j); else editors.js.setValue(EXAMPLE.js);
  }

  // ===== 初始化 =====
  loadCode();
  showView(location.hash === '#preview' ? 'preview' : 'edit');
  setStatus('就绪，点击「预览」查看效果');
})();
</script>
</body>
</html>
