<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📖 阅读·思享 · 读书笔记系统</title>
    <style>
        /* ===== 全局 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --primary: #8B6B4A;
            --primary-light: #B6957A;
            --primary-dark: #5E4230;
            --primary-bg: #F8F3EE;
            --bg: #FBF8F5;
            --card-bg: #FFFFFF;
            --text: #2C241E;
            --text-secondary: #7A6B60;
            --border: #E8DFD8;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.25s ease;
            --font: 'Segoe UI', 'PingFang SC', 'Noto Serif SC', Roboto, serif;
            --green: #4C8B6E;
            --orange: #D48C4A;
            --red: #C45A4A;
        }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 24px 20px;
        }
        button {
            cursor: pointer;
            font-family: inherit;
            border: none;
            outline: none;
        }
        input,
        select,
        textarea {
            font-family: inherit;
            outline: none;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            font-size: 14px;
            background: #fff;
            transition: border-color var(--transition), box-shadow var(--transition);
            width: 100%;
            color: var(--text);
        }
        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(139, 107, 74, 0.12);
        }
        textarea {
            resize: vertical;
            min-height: 72px;
        }
        label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            display: block;
            margin-bottom: 4px;
        }
        label .required {
            color: var(--red);
            margin-left: 2px;
        }
        .scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .scrollbar::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        /* ===== 容器 ===== */
        .app {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* ===== 头部 ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 28px;
            padding-bottom: 18px;
            border-bottom: 2px solid var(--border);
        }
        .header .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .header .brand .logo {
            width: 48px;
            height: 48px;
            background: var(--primary);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: #fff;
            flex-shrink: 0;
        }
        .header .brand h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            line-height: 1.2;
        }
        .header .brand h1 small {
            display: block;
            font-size: 13px;
            font-weight: 400;
            color: var(--text-secondary);
            letter-spacing: 0.3px;
        }
        .header .stats {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
        }
        .header .stats .stat-item {
            text-align: center;
            background: var(--card-bg);
            padding: 6px 18px;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            min-width: 70px;
        }
        .header .stats .stat-item .num {
            font-size: 22px;
            font-weight: 700;
            color: var(--primary);
            display: block;
            line-height: 1.2;
        }
        .header .stats .stat-item .label {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        /* ===== 工具栏 ===== */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 16px;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .toolbar .left {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .toolbar .left .filter-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
        }
        .toolbar .left select {
            width: auto;
            padding: 6px 12px;
            font-size: 13px;
            min-width: 90px;
            background: var(--card-bg);
        }
        .toolbar .right {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 8px 22px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(139, 107, 74, 0.2);
        }
        .btn-outline {
            background: transparent;
            border: 1.5px solid var(--border);
            color: var(--text-secondary);
        }
        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-bg);
        }
        .btn-danger {
            background: transparent;
            color: var(--text-secondary);
        }
        .btn-danger:hover {
            background: #FDE8E5;
            color: var(--red);
        }
        .btn-sm {
            padding: 4px 14px;
            font-size: 12px;
        }

        /* ===== 视图切换 ===== */
        .view-tabs {
            display: flex;
            gap: 4px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 4px;
            margin-bottom: 16px;
        }
        .view-tabs .view-btn {
            padding: 6px 20px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            background: transparent;
            color: var(--text-secondary);
            transition: all var(--transition);
        }
        .view-tabs .view-btn:hover {
            background: var(--primary-bg);
            color: var(--primary);
        }
        .view-tabs .view-btn.active {
            background: var(--primary);
            color: #fff;
        }

        /* ===== 表单面板 ===== */
        .form-panel {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 22px 26px 26px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
            transition: all var(--transition);
        }
        .form-panel.collapsed {
            padding: 12px 26px;
            cursor: pointer;
        }
        .form-panel.collapsed .form-body {
            display: none;
        }
        .form-panel.collapsed .form-toggle-icon {
            transform: rotate(-90deg);
        }
        .form-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            user-select: none;
        }
        .form-toggle h3 {
            font-size: 17px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .form-toggle h3 .icon {
            font-size: 20px;
        }
        .form-toggle .form-toggle-icon {
            transition: transform var(--transition);
            font-size: 16px;
            color: var(--text-secondary);
        }
        .form-body {
            margin-top: 18px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px 20px;
            margin-bottom: 12px;
        }
        .form-row.full {
            grid-template-columns: 1fr;
        }
        .form-row.three {
            grid-template-columns: 1fr 1fr 1fr;
        }
        .form-row .field {
            display: flex;
            flex-direction: column;
        }
        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 8px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }
        .form-actions button {
            padding: 10px 28px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 14px;
            transition: all var(--transition);
        }
        .form-actions .btn-submit {
            background: var(--primary);
            color: #fff;
        }
        .form-actions .btn-submit:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }
        .form-actions .btn-reset {
            background: transparent;
            color: var(--text-secondary);
        }
        .form-actions .btn-reset:hover {
            background: var(--bg);
        }
        .form-actions .btn-cancel {
            background: transparent;
            color: var(--text-secondary);
            display: none;
        }
        .form-actions .btn-cancel.visible {
            display: inline-block;
        }
        .form-actions .btn-cancel:hover {
            background: var(--bg);
        }

        /* ===== 阅读列表 ===== */
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .list-header h2 {
            font-size: 19px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .list-header h2 .count {
            font-size: 14px;
            font-weight: 400;
            color: var(--text-secondary);
        }
        .list-header .sort-group {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }
        .list-header .sort-group .sort-label {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .list-header .sort-group select {
            width: auto;
            padding: 4px 10px;
            font-size: 13px;
            border-radius: var(--radius-sm);
            min-width: 80px;
        }

        .record-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .record-card {
            background: var(--card-bg);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            padding: 18px 22px;
            transition: all var(--transition);
            position: relative;
        }
        .record-card:hover {
            border-color: var(--primary-light);
            box-shadow: var(--shadow);
        }
        .record-card .top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            flex-wrap: wrap;
        }
        .record-card .top .left {
            flex: 1;
            min-width: 0;
        }
        .record-card .top .left .book {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary-dark);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .record-card .top .left .book .category {
            font-size: 12px;
            font-weight: 500;
            background: var(--primary-bg);
            color: var(--primary);
            padding: 2px 14px;
            border-radius: 20px;
            letter-spacing: 0.3px;
        }
        .record-card .top .left .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 18px;
            margin-top: 4px;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .record-card .top .left .meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .record-card .top .right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .record-card .top .right .duration {
            font-weight: 600;
            color: var(--primary);
            background: var(--primary-bg);
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 14px;
            white-space: nowrap;
        }
        .record-card .top .right .del-btn {
            background: transparent;
            color: var(--text-secondary);
            font-size: 18px;
            padding: 2px 6px;
            border-radius: 6px;
            transition: all var(--transition);
            line-height: 1;
        }
        .record-card .top .right .del-btn:hover {
            background: #FDE8E5;
            color: var(--red);
        }
        .record-card .top .right .edit-btn {
            background: transparent;
            color: var(--text-secondary);
            font-size: 16px;
            padding: 2px 6px;
            border-radius: 6px;
            transition: all var(--transition);
            line-height: 1;
        }
        .record-card .top .right .edit-btn:hover {
            background: var(--primary-bg);
            color: var(--primary);
        }

        .record-card .content {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 24px;
        }
        .record-card .content .item {
            font-size: 14px;
            line-height: 1.6;
        }
        .record-card .content .item .lbl {
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            display: block;
            margin-bottom: 2px;
        }
        .record-card .content .item .val {
            color: var(--text);
            white-space: pre-wrap;
            word-break: break-word;
        }
        .record-card .content .item .val.empty {
            color: var(--text-secondary);
            font-style: italic;
        }
        .record-card .content .item.full {
            grid-column: 1 / -1;
        }
        .record-card .content .item .quote {
            background: var(--primary-bg);
            padding: 8px 14px;
            border-radius: 8px;
            border-left: 3px solid var(--primary);
            font-style: italic;
            color: var(--text);
        }

        /* ===== 汇总视图 ===== */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }
        .summary-card {
            background: var(--card-bg);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            padding: 18px 20px;
            transition: all var(--transition);
            box-shadow: var(--shadow);
        }
        .summary-card:hover {
            border-color: var(--primary-light);
            transform: translateY(-2px);
        }
        .summary-card .book-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary-dark);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .summary-card .book-title .category {
            font-size: 12px;
            font-weight: 500;
            background: var(--primary-bg);
            color: var(--primary);
            padding: 2px 14px;
            border-radius: 20px;
        }
        .summary-card .stats {
            margin-top: 12px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 12px;
        }
        .summary-card .stats .item {
            font-size: 14px;
            color: var(--text-secondary);
        }
        .summary-card .stats .item .num {
            font-weight: 700;
            color: var(--text);
            font-size: 16px;
        }
        .summary-card .stats .item .num.primary {
            color: var(--primary);
        }
        .summary-card .pages-detail {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed var(--border);
            font-size: 13px;
            color: var(--text-secondary);
        }
        .summary-card .pages-detail .raw {
            font-style: italic;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        .empty-state .icon {
            font-size: 56px;
            margin-bottom: 14px;
            opacity: 0.5;
            display: block;
        }
        .empty-state h3 {
            font-weight: 400;
            font-size: 20px;
            color: var(--text);
        }
        .empty-state p {
            margin-top: 6px;
            font-size: 15px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            body {
                padding: 14px 12px;
            }
            .header .brand h1 {
                font-size: 20px;
            }
            .header .stats {
                gap: 8px;
            }
            .header .stats .stat-item {
                padding: 4px 12px;
                min-width: 56px;
            }
            .header .stats .stat-item .num {
                font-size: 18px;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
            .form-row.three {
                grid-template-columns: 1fr;
            }
            .form-panel {
                padding: 16px;
            }
            .record-card .content {
                grid-template-columns: 1fr;
            }
            .record-card .top {
                flex-direction: column;
            }
            .record-card .top .right {
                width: 100%;
                justify-content: flex-end;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .toolbar .left {
                flex-wrap: wrap;
            }
            .toolbar .left select {
                flex: 1;
                min-width: 60px;
            }
            .list-header {
                flex-direction: column;
                align-items: stretch;
            }
            .list-header .sort-group {
                justify-content: flex-start;
            }
            .summary-grid {
                grid-template-columns: 1fr;
            }
            .view-tabs .view-btn {
                padding: 4px 12px;
                font-size: 13px;
            }
        }

        @media (max-width: 400px) {
            .header .brand .logo {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }
            .header .brand h1 {
                font-size: 18px;
            }
            .btn {
                padding: 6px 14px;
                font-size: 13px;
            }
            .record-card {
                padding: 14px 16px;
            }
        }

        .hidden {
            display: none !important;
        }
        .text-muted {
            color: var(--text-secondary);
        }
        .mt-8 {
            margin-top: 8px;
        }
    </style>
<script src="https://beacon.cdn.qq.com/sdk/4.5.9/beacon_web.min.js"></script>
</head>
<body>

    <div class="app">

        <!-- ===== 头部 ===== -->
        <header class="header">
            <div class="brand">
                <div class="logo">📖</div>
                <h1>
                    阅读·思享
                    <small>读书 · 摘录 · 思考 · 沉淀</small>
                </h1>
            </div>
            <div class="stats" id="statsHeader">
                <div class="stat-item">
                    <span class="num" id="statTotal">0</span>
                    <span class="label">阅读记录</span>
                </div>
                <div class="stat-item">
                    <span class="num" id="statCategories">0</span>
                    <span class="label">类别</span>
                </div>
                <div class="stat-item">
                    <span class="num" id="statHours">0</span>
                    <span class="label">总时长(h)</span>
                </div>
                <div class="stat-item">
                    <span class="num" id="statPages">0</span>
                    <span class="label">总页数</span>
                </div>
            </div>
        </header>

        <!-- ===== 工具栏 ===== -->
        <div class="toolbar">
            <div class="left">
                <span class="filter-label">📂 类别</span>
                <select id="filterCategory">
                    <option value="all">全部</option>
                </select>
                <span class="filter-label" style="margin-left:8px;">🔍</span>
                <input type="text" id="searchInput" placeholder="搜索书名、摘录、思考…" style="width:180px;padding:6px 12px;font-size:13px;" />
            </div>
            <div class="right">
                <button class="btn btn-primary" id="toggleFormBtn">✏️ 记录阅读</button>
                <button class="btn btn-outline btn-sm" id="exportBtn">📤 导出</button>
                <button class="btn btn-outline btn-sm" id="importBtn">📥 导入</button>
                <button class="btn btn-danger btn-sm" id="clearBtn">🗑️ 清空</button>
            </div>
        </div>
        <input type="file" id="importFileInput" accept=".json" style="display:none;" />

        <!-- ===== 表单面板 ===== -->
        <div class="form-panel collapsed" id="formPanel">
            <div class="form-toggle" id="formToggle">
                <h3><span class="icon">✍️</span> <span id="formTitle">记录阅读</span></h3>
                <span class="form-toggle-icon">▶</span>
            </div>
            <div class="form-body" id="formBody">
                <form id="recordForm" autocomplete="off">
                    <div class="form-row">
                        <div class="field">
                            <label>书名 <span class="required">*</span></label>
                            <input type="text" id="fBook" placeholder="输入书名..." required />
                        </div>
                        <div class="field">
                            <label>阅读类别 <span class="required">*</span></label>
                            <select id="fCategory" required>
                                <option value="文学">文学</option>
                                <option value="哲学">哲学</option>
                                <option value="历史">历史</option>
                                <option value="科学">科学</option>
                                <option value="心理">心理</option>
                                <option value="经管">经管</option>
                                <option value="生活">生活</option>
                                <option value="其他">其他</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row three">
                        <div class="field">
                            <label>阅读日期 <span class="required">*</span></label>
                            <input type="date" id="fDate" required />
                        </div>
                        <div class="field">
                            <label>阅读时长 (分钟) <span class="required">*</span></label>
                            <input type="number" id="fDuration" min="1" step="1" placeholder="如 45" required />
                        </div>
                        <div class="field">
                            <label>阅读页数 <span style="font-weight:400;color:var(--text-secondary);">(支持分段，如 4-78)</span></label>
                            <input type="text" id="fPages" placeholder="如 4-78 或 32" />
                        </div>
                    </div>
                    <div class="form-row full">
                        <div class="field">
                            <label>📌 摘录语句 <span style="font-weight:400;color:var(--text-secondary);">(金句 / 原文摘抄)</span></label>
                            <textarea id="fQuote" rows="3" placeholder="记录书中触动你的句子…"></textarea>
                        </div>
                    </div>
                    <div class="form-row full">
                        <div class="field">
                            <label>💭 我的思考 <span class="required">*</span></label>
                            <textarea id="fThought" rows="4" placeholder="写下你的感悟、联想、批判、疑问…" required></textarea>
                        </div>
                    </div>
                    <div class="form-row full">
                        <div class="field">
                            <label>🔗 延伸联想 <span style="font-weight:400;color:var(--text-secondary);">(与其他知识、经历的关联)</span></label>
                            <textarea id="fConnection" rows="2" placeholder="联想到的其他书籍、生活经历、知识点…"></textarea>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn-cancel" id="cancelEditBtn">取消编辑</button>
                        <button type="reset" class="btn-reset">清空</button>
                        <button type="submit" class="btn-submit">✅ 保存阅读</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- ===== 视图切换 ===== -->
        <div class="view-tabs" id="viewTabs">
            <button class="view-btn active" data-view="list">📚 阅读记录</button>
            <button class="view-btn" data-view="summary">📊 书籍汇总</button>
        </div>

        <!-- ===== 列表头部（仅列表视图） ===== -->
        <div class="list-header" id="listHeader">
            <h2>📚 阅读记录 <span class="count" id="listCount">(0)</span></h2>
            <div class="sort-group">
                <span class="sort-label">排序</span>
                <select id="sortSelect">
                    <option value="newest">最新优先</option>
                    <option value="oldest">最早优先</option>
                    <option value="duration">时长最多</option>
                    <option value="book">按书名</option>
                </select>
            </div>
        </div>

        <!-- ===== 内容容器 ===== -->
        <div id="contentContainer">
            <!-- 由 JavaScript 动态渲染 -->
        </div>

    </div>

    <script>
        // ============================================================
        //  数据层
        // ============================================================
        const STORAGE_KEY = 'reading_think_system_v1';
        let state = {
            records: [],
            editingId: null,
            filterCategory: 'all',
            searchKeyword: '',
            sortBy: 'newest',
            viewMode: 'list' // 'list' | 'summary'
        };

        // ============================================================
        //  工具
        // ============================================================
        function generateId() { return 'rd_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6); }

        function getToday() { return new Date().toISOString().split('T')[0]; }

        function formatDate(d) {
            if (!d) return '-';
            const parts = d.split('-');
            return parts[0] + '年' + parseInt(parts[1]) + '月' + parseInt(parts[2]) + '日';
        }

        function formatDuration(min) {
            if (!min || min < 1) return '0m';
            const h = Math.floor(min / 60);
            const m = min % 60;
            if (h > 0 && m > 0) return h + 'h ' + m + 'm';
            if (h > 0) return h + 'h';
            return m + 'm';
        }

        // 解析页数字符串，返回估算页数（数值），若无法解析则返回0
        function parsePages(pagesStr) {
            if (!pagesStr || pagesStr.trim() === '') return 0;
            const s = pagesStr.trim();
            // 尝试纯数字
            const num = parseFloat(s);
            if (!isNaN(num) && num > 0) return Math.round(num);
            // 尝试分段 "a-b"
            const match = s.match(/^\s*(\d+)\s*-\s*(\d+)\s*$/);
            if (match) {
                const a = parseInt(match[1]);
                const b = parseInt(match[2]);
                if (a > 0 && b > a) return b - a + 1; // 包含起始页
                else if (a > 0 && b > 0) return Math.abs(b - a) + 1;
            }
            // 无法解析
            return 0;
        }

        function getTotalHours() {
            const totalMin = state.records.reduce((sum, r) => sum + (r.duration || 0), 0);
            return Math.round((totalMin / 60) * 10) / 10;
        }

        function getTotalPages() {
            return state.records.reduce((sum, r) => sum + parsePages(r.pages), 0);
        }

        function getCategories() {
            const set = new Set(state.records.map(r => r.category).filter(Boolean));
            return [...set].sort();
        }

        function getFilteredRecords() {
            let list = [...state.records];
            if (state.filterCategory !== 'all') {
                list = list.filter(r => r.category === state.filterCategory);
            }
            const kw = state.searchKeyword.trim().toLowerCase();
            if (kw) {
                list = list.filter(r =>
                    (r.book || '').toLowerCase().includes(kw) ||
                    (r.quote || '').toLowerCase().includes(kw) ||
                    (r.thought || '').toLowerCase().includes(kw) ||
                    (r.connection || '').toLowerCase().includes(kw)
                );
            }
            switch (state.sortBy) {
                case 'newest':
                    list.sort((a, b) => (a.date < b.date ? 1 : -1));
                    break;
                case 'oldest':
                    list.sort((a, b) => (a.date > b.date ? 1 : -1));
                    break;
                case 'duration':
                    list.sort((a, b) => (b.duration || 0) - (a.duration || 0));
                    break;
                case 'book':
                    list.sort((a, b) => (a.book || '').localeCompare(b.book || '', 'zh'));
                    break;
                default:
                    list.sort((a, b) => (a.date < b.date ? 1 : -1));
            }
            return list;
        }

        // ============================================================
        //  数据持久化
        // ============================================================
        function loadData() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const data = JSON.parse(raw);
                    state.records = data.records || [];
                } else {
                    const today = getToday();
                    state.records = [{
                        id: 'demo1',
                        book: '百年孤独',
                        category: '文学',
                        date: today,
                        duration: 65,
                        pages: '42',
                        quote: '多年以后，面对行刑队，奥雷里亚诺·布恩迪亚上校将会回想起父亲带他去见识冰块的那个遥远的下午。',
                        thought: '时间与命运的循环，家族的兴衰如同拉美历史的缩影。魔幻现实主义让现实与虚幻交织，读来既震撼又感慨。',
                        connection: '联想到了《红楼梦》的家族叙事，以及马尔克斯对拉美命运的深刻洞察。',
                        createdAt: today
                    }, {
                        id: 'demo2',
                        book: '道德经',
                        category: '哲学',
                        date: today,
                        duration: 40,
                        pages: '18',
                        quote: '上善若水。水善利万物而不争，处众人之所恶，故几于道。',
                        thought: '水的品质——柔韧、谦下、包容、利他。在纷繁的现代生活中，这种「不争」的智慧反而是一种强大的力量。',
                        connection: '与庄子的「无用之用」相通，也联想到现代管理中的「柔性领导力」。',
                        createdAt: today
                    }, {
                        id: 'demo3',
                        book: '人类群星闪耀时',
                        category: '历史',
                        date: today,
                        duration: 55,
                        pages: '30',
                        quote: '一个人生命中最大的幸运，莫过于在他年富力强时发现了自己的使命。',
                        thought: '茨威格笔下的历史瞬间，充满了戏剧性与必然性。每个人都有可能成为历史的推动者，关键在于是否抓住了那个「瞬间」。',
                        connection: '联想到司马迁「究天人之际，通古今之变」的史观，以及个人在时代洪流中的选择。',
                        createdAt: today
                    }, {
                        id: 'demo4',
                        book: '百年孤独',
                        category: '文学',
                        date: today,
                        duration: 70,
                        pages: '78-120',
                        quote: '…',
                        thought: '继续阅读，家族命运愈发复杂。',
                        connection: '',
                        createdAt: today
                    }];
                    saveData();
                }
            } catch (e) {
                state.records = [];
            }
            state.records.forEach(r => {
                if (!r.id) r.id = generateId();
                if (!r.date) r.date = getToday();
                if (!r.category) r.category = '其他';
                if (r.duration === undefined) r.duration = 0;
                if (r.pages !== undefined && r.pages !== null) {
                    r.pages = String(r.pages);
                } else {
                    r.pages = '';
                }
                if (!r.quote) r.quote = '';
                if (!r.thought) r.thought = '';
                if (!r.connection) r.connection = '';
                if (!r.createdAt) r.createdAt = getToday();
            });
            saveData();
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({ records: state.records }));
        }

        // ============================================================
        //  渲染
        // ============================================================

        // ---------- 更新统计 ----------
        function updateStats() {
            document.getElementById('statTotal').textContent = state.records.length;
            document.getElementById('statCategories').textContent = getCategories().length;
            document.getElementById('statHours').textContent = getTotalHours().toFixed(1);
            document.getElementById('statPages').textContent = getTotalPages();
        }

        // ---------- 更新类别筛选器 ----------
        function updateCategoryFilter() {
            const select = document.getElementById('filterCategory');
            const current = select.value;
            const categories = getCategories();
            select.innerHTML = '<option value="all">全部</option>';
            categories.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.textContent = c;
                select.appendChild(opt);
            });
            if (categories.includes(current)) select.value = current;
            else select.value = 'all';
            state.filterCategory = select.value;
        }

        // ---------- 渲染列表视图 ----------
        function renderListView() {
            const container = document.getElementById('contentContainer');
            const filtered = getFilteredRecords();

            document.getElementById('listCount').textContent = `(${filtered.length})`;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <span class="icon">📭</span>
                        <h3>${state.records.length === 0 ? '还没有阅读记录' : '没有匹配的记录'}</h3>
                        <p>${state.records.length === 0 ? '点击「记录阅读」开始你的读书之旅' : '试试调整筛选条件或搜索关键词'}</p>
                    </div>
                `;
                return;
            }

            let html = '';
            filtered.forEach(r => {
                const quoteText = r.quote || '';
                const thoughtText = r.thought || '';
                const connectionText = r.connection || '';
                const dateDisplay = formatDate(r.date);
                const durationDisplay = formatDuration(r.duration);
                const pagesDisplay = r.pages ? `📄 ${r.pages} 页` : '';

                html += `
                    <div class="record-card" data-id="${r.id}">
                        <div class="top">
                            <div class="left">
                                <div class="book">
                                    ${r.book || '未命名'}
                                    <span class="category">${r.category || '其他'}</span>
                                </div>
                                <div class="meta">
                                    <span>📅 ${dateDisplay}</span>
                                    <span>⏱️ ${durationDisplay}</span>
                                    ${pagesDisplay ? `<span>${pagesDisplay}</span>` : ''}
                                    <span>🕐 ${r.createdAt ? formatDate(r.createdAt) : ''}</span>
                                </div>
                            </div>
                            <div class="right">
                                <button class="edit-btn" data-id="${r.id}" title="编辑">✏️</button>
                                <button class="del-btn" data-id="${r.id}" title="删除">✕</button>
                            </div>
                        </div>
                        <div class="content">
                            ${quoteText ? `
                                <div class="item full">
                                    <span class="lbl">📌 摘录</span>
                                    <div class="val quote">${escapeHtml(quoteText)}</div>
                                </div>
                            ` : ''}
                            ${thoughtText ? `
                                <div class="item full">
                                    <span class="lbl">💭 我的思考</span>
                                    <div class="val">${escapeHtml(thoughtText)}</div>
                                </div>
                            ` : ''}
                            ${connectionText ? `
                                <div class="item full">
                                    <span class="lbl">🔗 延伸联想</span>
                                    <div class="val">${escapeHtml(connectionText)}</div>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;

            // 事件绑定
            container.querySelectorAll('.del-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = btn.dataset.id;
                    if (confirm('确定删除这条阅读记录吗？')) {
                        state.records = state.records.filter(r => r.id !== id);
                        saveData();
                        renderAll();
                    }
                });
            });

            container.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = btn.dataset.id;
                    const record = state.records.find(r => r.id === id);
                    if (record) editRecord(record);
                });
            });
        }

        // ---------- 渲染汇总视图 ----------
        function renderSummaryView() {
            const container = document.getElementById('contentContainer');
            // 按书籍分组
            const bookMap = new Map();
            state.records.forEach(r => {
                const key = r.book || '未命名';
                if (!bookMap.has(key)) {
                    bookMap.set(key, {
                        book: key,
                        category: r.category || '其他',
                        records: [],
                        totalDuration: 0,
                        totalPages: 0,
                        pagesRaw: []
                    });
                }
                const entry = bookMap.get(key);
                entry.records.push(r);
                entry.totalDuration += r.duration || 0;
                const parsed = parsePages(r.pages);
                entry.totalPages += parsed;
                if (r.pages) entry.pagesRaw.push(r.pages);
            });

            const books = Array.from(bookMap.values());

            if (books.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <span class="icon">📭</span>
                        <h3>还没有阅读记录</h3>
                        <p>点击「记录阅读」开始你的读书之旅</p>
                    </div>
                `;
                return;
            }

            let html = `<div class="summary-grid">`;
            books.forEach(b => {
                const count = b.records.length;
                const durationDisplay = formatDuration(b.totalDuration);
                const pagesDisplay = b.totalPages > 0 ? `${b.totalPages} 页` : '--';
                // 显示原始页数片段（去重）
                const rawPages = [...new Set(b.pagesRaw)].join('、');
                html += `
                    <div class="summary-card">
                        <div class="book-title">
                            ${b.book}
                            <span class="category">${b.category}</span>
                        </div>
                        <div class="stats">
                            <div class="item">📖 阅读次数 <span class="num primary">${count}</span></div>
                            <div class="item">⏱️ 总时长 <span class="num primary">${durationDisplay}</span></div>
                            <div class="item" style="grid-column: span 2;">📄 总页数 <span class="num primary">${pagesDisplay}</span></div>
                        </div>
                        ${rawPages ? `<div class="pages-detail">📑 页数记录：<span class="raw">${rawPages}</span></div>` : ''}
                    </div>
                `;
            });
            html += `</div>`;
            container.innerHTML = html;
        }

        // ---------- 主渲染函数 ----------
        function renderContent() {
            if (state.viewMode === 'list') {
                document.getElementById('listHeader').style.display = 'flex';
                renderListView();
            } else {
                document.getElementById('listHeader').style.display = 'none';
                renderSummaryView();
            }
        }

        // ---------- 安全转义 ----------
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================================
        //  表单操作
        // ============================================================

        function initForm() {
            document.getElementById('fDate').value = getToday();

            document.getElementById('recordForm').addEventListener('submit', handleFormSubmit);
            document.getElementById('recordForm').addEventListener('reset', () => {
                setTimeout(() => {
                    document.getElementById('fDate').value = getToday();
                    document.getElementById('fDuration').value = '';
                    document.getElementById('fPages').value = '';
                    document.getElementById('fQuote').value = '';
                    document.getElementById('fThought').value = '';
                    document.getElementById('fConnection').value = '';
                    document.getElementById('fBook').value = '';
                    document.getElementById('fCategory').value = '文学';
                    state.editingId = null;
                    document.querySelector('.btn-submit').textContent = '✅ 保存阅读';
                    document.getElementById('cancelEditBtn').classList.remove('visible');
                    document.getElementById('formTitle').textContent = '记录阅读';
                }, 10);
            });

            const panel = document.getElementById('formPanel');
            const toggle = document.getElementById('formToggle');
            toggle.addEventListener('click', () => {
                panel.classList.toggle('collapsed');
                if (!panel.classList.contains('collapsed')) {
                    document.getElementById('fDate').value = getToday();
                }
            });

            document.getElementById('toggleFormBtn').addEventListener('click', () => {
                panel.classList.remove('collapsed');
                document.getElementById('fDate').value = getToday();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            document.getElementById('cancelEditBtn').addEventListener('click', () => {
                state.editingId = null;
                document.querySelector('.btn-submit').textContent = '✅ 保存阅读';
                document.getElementById('cancelEditBtn').classList.remove('visible');
                document.getElementById('formTitle').textContent = '记录阅读';
                document.getElementById('recordForm').reset();
                setTimeout(() => {
                    document.getElementById('fDate').value = getToday();
                }, 10);
                document.getElementById('formPanel').classList.add('collapsed');
            });
        }

        function editRecord(record) {
            state.editingId = record.id;
            document.getElementById('fBook').value = record.book || '';
            document.getElementById('fCategory').value = record.category || '其他';
            document.getElementById('fDate').value = record.date || getToday();
            document.getElementById('fDuration').value = record.duration || '';
            document.getElementById('fPages').value = record.pages || '';
            document.getElementById('fQuote').value = record.quote || '';
            document.getElementById('fThought').value = record.thought || '';
            document.getElementById('fConnection').value = record.connection || '';

            document.querySelector('.btn-submit').textContent = '✏️ 更新记录';
            document.getElementById('cancelEditBtn').classList.add('visible');
            document.getElementById('formTitle').textContent = '编辑阅读';
            document.getElementById('formPanel').classList.remove('collapsed');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function handleFormSubmit(e) {
            e.preventDefault();

            const book = document.getElementById('fBook').value.trim();
            const category = document.getElementById('fCategory').value;
            const date = document.getElementById('fDate').value;
            const duration = parseInt(document.getElementById('fDuration').value);
            const pages = document.getElementById('fPages').value.trim();
            const quote = document.getElementById('fQuote').value.trim();
            const thought = document.getElementById('fThought').value.trim();
            const connection = document.getElementById('fConnection').value.trim();

            if (!book) { alert('请输入书名'); return; }
            if (!date) { alert('请选择阅读日期'); return; }
            if (!duration || duration < 1) { alert('请输入有效阅读时长（分钟）'); return; }
            if (!thought) { alert('请写下你的思考'); return; }

            const record = {
                id: state.editingId || generateId(),
                book,
                category,
                date,
                duration,
                pages: pages || '',
                quote: quote || '',
                thought,
                connection: connection || '',
                createdAt: state.editingId ? (state.records.find(r => r.id === state.editingId)?.createdAt || getToday()) :
                    getToday()
            };

            if (state.editingId) {
                const idx = state.records.findIndex(r => r.id === state.editingId);
                if (idx !== -1) state.records[idx] = record;
                state.editingId = null;
                document.querySelector('.btn-submit').textContent = '✅ 保存阅读';
                document.getElementById('cancelEditBtn').classList.remove('visible');
                document.getElementById('formTitle').textContent = '记录阅读';
            } else {
                state.records.push(record);
            }

            saveData();
            renderAll();

            document.getElementById('recordForm').reset();
            setTimeout(() => {
                document.getElementById('fDate').value = getToday();
                document.getElementById('fCategory').value = category;
            }, 10);
            document.getElementById('formPanel').classList.add('collapsed');
        }

        // ============================================================
        //  筛选 & 排序
        // ============================================================
        function initFilters() {
            const filterSelect = document.getElementById('filterCategory');
            filterSelect.addEventListener('change', () => {
                state.filterCategory = filterSelect.value;
                renderAll();
            });

            const searchInput = document.getElementById('searchInput');
            let searchTimer = null;
            searchInput.addEventListener('input', () => {
                clearTimeout(searchTimer);
                searchTimer = setTimeout(() => {
                    state.searchKeyword = searchInput.value;
                    renderAll();
                }, 300);
            });

            const sortSelect = document.getElementById('sortSelect');
            sortSelect.addEventListener('change', () => {
                state.sortBy = sortSelect.value;
                renderAll();
            });
        }

        // ============================================================
        //  视图切换
        // ============================================================
        function initViewTabs() {
            const tabs = document.querySelectorAll('.view-btn');
            tabs.forEach(btn => {
                btn.addEventListener('click', () => {
                    const view = btn.dataset.view;
                    state.viewMode = view;
                    tabs.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderAll();
                });
            });
        }

        // ============================================================
        //  导入导出
        // ============================================================
        function initExport() {
            document.getElementById('exportBtn').addEventListener('click', () => {
                const data = JSON.stringify({ records: state.records, exportedAt: new Date().toISOString() }, null,
                2);
                const blob = new Blob([data], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `reading_notes_${getToday()}.json`;
                a.click();
                URL.revokeObjectURL(url);
            });
        }

        function initImport() {
            const input = document.getElementById('importFileInput');
            document.getElementById('importBtn').addEventListener('click', () => input.click());
            input.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const data = JSON.parse(ev.target.result);
                        if (!data.records || !Array.isArray(data.records)) {
                            alert('无效的数据文件');
                            return;
                        }
                        if (confirm(`将导入 ${data.records.length} 条记录，当前数据将被覆盖，确认继续？`)) {
                            state.records = data.records;
                            state.records.forEach(r => {
                                if (!r.id) r.id = generateId();
                                if (!r.date) r.date = getToday();
                                if (!r.category) r.category = '其他';
                                if (r.duration === undefined) r.duration = 0;
                                if (r.pages !== undefined && r.pages !== null) {
                                    r.pages = String(r.pages);
                                } else {
                                    r.pages = '';
                                }
                                if (!r.quote) r.quote = '';
                                if (!r.thought) r.thought = '';
                                if (!r.connection) r.connection = '';
                                if (!r.createdAt) r.createdAt = getToday();
                            });
                            saveData();
                            renderAll();
                            alert('导入成功！');
                        }
                    } catch (err) {
                        alert('导入失败：' + err.message);
                    }
                };
                reader.readAsText(file);
                input.value = '';
            });
        }

        // ============================================================
        //  清空
        // ============================================================
        function initClear() {
            document.getElementById('clearBtn').addEventListener('click', () => {
                if (state.records.length === 0) { alert('数据已为空'); return; }
                if (confirm('⚠️ 确定要删除所有阅读记录吗？此操作不可恢复！')) {
                    if (confirm('再次确认：删除所有数据？')) {
                        state.records = [];
                        saveData();
                        renderAll();
                    }
                }
            });
        }

        // ============================================================
        //  主渲染
        // ============================================================
        function renderAll() {
            updateCategoryFilter();
            updateStats();
            renderContent();
            // 同步界面控件
            document.getElementById('searchInput').value = state.searchKeyword;
            document.getElementById('sortSelect').value = state.sortBy;
            document.getElementById('filterCategory').value = state.filterCategory;
            // 同步视图按钮
            document.querySelectorAll('.view-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.view === state.viewMode);
            });
            // 列表头显示控制
            if (state.viewMode === 'list') {
                document.getElementById('listHeader').style.display = 'flex';
            } else {
                document.getElementById('listHeader').style.display = 'none';
            }
        }

        // ============================================================
        //  初始化
        // ============================================================
        function init() {
            loadData();
            initForm();
            initFilters();
            initViewTabs();
            initExport();
            initImport();
            initClear();

            state.viewMode = 'list';
            state.filterCategory = 'all';
            state.searchKeyword = '';
            state.sortBy = 'newest';

            renderAll();

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    document.getElementById('formPanel').classList.add('collapsed');
                }
            });
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>

</body>
</html>
