        let statBarChartInstance = null;
        let actStatChartInstance = null;

        // Populate filter dropdowns with scenes and categories
        function populateStatFilters() {
            const sceneSel = $('statScene');
            const actStatSel = $('actStatActivity');

            // Scene: 工作/生活/成长
            if (sceneSel) {
                const sVal = sceneSel.value;
                sceneSel.innerHTML = '<option value="all">全部场景</option>';
                SCENE_NAMES.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s;
                    opt.textContent = s;
                    sceneSel.appendChild(opt);
                });
                if (sVal) sceneSel.value = sVal;
            }

            // Activity options for per-activity stats (keep "all")
            if (actStatSel) {
                const val = actStatSel.value;
                actStatSel.innerHTML = '<option value="">(无活动)</option>';
                CATEGORIES.forEach(cat => {
                    const opt = document.createElement('option');
                    opt.value = cat.key;
                    opt.textContent = cat.key;
                    actStatSel.appendChild(opt);
                });
                if (val) actStatSel.value = val;
            }

            // 活动筛选联动场景
            rebuildActivityFilter();
        }

        // 根据选中的场景，重建活动筛选下拉框
        function rebuildActivityFilter() {
            const sceneSel = $('statScene');
            const actSel = $('statActivity');
            if (!actSel) return;
            const scene = sceneSel?.value || 'all';
            actSel.innerHTML = '';
            if (scene === 'all') {
                actSel.innerHTML = '<option value="all">全部活动</option>';
                CATEGORIES.forEach(cat => {
                    if (cat.key === '其他') return;
                    const opt = document.createElement('option');
                    opt.value = cat.key;
                    opt.textContent = cat.key;
                    actSel.appendChild(opt);
                });
            } else {
                // "全部XX" 聚合项
                const allOpt = document.createElement('option');
                allOpt.value = 'scene_' + scene;
                allOpt.textContent = '全部' + scene;
                actSel.appendChild(allOpt);
                // 该场景下的二级标签
                const cats = SCENES[scene] || [];
                cats.forEach(catKey => {
                    if (CATEGORIES.some(c => c.key === catKey)) {
                        const opt = document.createElement('option');
                        opt.value = catKey;
                        opt.textContent = catKey;
                        actSel.appendChild(opt);
                    }
                });
            }
        }

        // Get filtered records based on current filter settings (with scene filter)
        function getFilteredRecords() {
            const scene = $('statScene')?.value || 'all';
            const activity = $('statActivity')?.value || 'all';
            let filtered = [...records];
            if (scene !== 'all') {
                // 场景筛选：找出该场景下的所有类别
                const sceneCats = SCENES[scene] || [];
                filtered = filtered.filter(r => sceneCats.includes(r.category));
            }
            // 活动筛选
            if (activity && activity !== 'all') {
                if (activity.startsWith('scene_')) {
                    // "全部XX" 聚合项：等于该场景，已在上一步处理，这里不过滤
                } else {
                    filtered = filtered.filter(r => r.category === activity);
                }
            }
            return filtered;
        }

        // Bucket records by time dimension
        function bucketByDimension(recs, dimension) {
            const buckets = {};
            recs.forEach(r => {
                const d = new Date(r.date || r.startTime?.slice(0,10));
                if (isNaN(d.getTime())) return;
                let key;
                switch (dimension) {
                    case 'daily':
                        key = r.date || r.startTime.slice(0, 10);
                        break;
                    case 'weekly':
                        const monday = new Date(d);
                        monday.setDate(d.getDate() - d.getDay() + (d.getDay() === 0 ? -6 : 1));
                        key = monday.toISOString().slice(0, 10);
                        break;
                    case 'monthly':
                        key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
                        break;
                    case 'yearly':
                        key = String(d.getFullYear());
                        break;
                    default:
                        key = r.date || r.startTime.slice(0, 10);
                }
                if (!buckets[key]) buckets[key] = { total: 0, count: 0, details: [] };
                buckets[key].total += (r.duration || 0);
                buckets[key].count++;
                buckets[key].details.push(r);
            });
            return buckets;
        }

        // Format bucket key to display label
        function formatBucketLabel(key, dimension) {
            switch (dimension) {
                case 'weekly': {
                    const d = new Date(key + 'T00:00:00');
                    const end = new Date(d); end.setDate(end.getDate() + 6);
                    return `${d.getMonth()+1}/${d.getDate()}-${end.getMonth()+1}/${end.getDate()}`;
                }
                case 'monthly': {
                    const [y, m] = key.split('-');
                    return `${parseInt(m)}月`;
                }
                case 'yearly':
                    return key + '年';
                default:
                    return key.slice(5); // MM-DD
            }
        }

        // Render main statistics chart
        function renderStatChart() {
            const dimension = $('statDimension')?.value || 'daily';
            let filtered = getFilteredRecords();
            let bucketDim = dimension;

            // 时间区间维度：限定日期范围，再按每日分桶统计
            if (dimension === 'range') {
                const days = parseInt($('statRange')?.value || '7', 10);
                const start = new Date();
                start.setDate(start.getDate() - (days - 1));
                const startStr = start.toISOString().slice(0, 10);
                const today = getToday();
                filtered = filtered.filter(r => {
                    const d = r.date || (r.startTime ? r.startTime.slice(0, 10) : '');
                    return d >= startStr && d <= today;
                });
                bucketDim = 'daily'; // 区间内按每日
            }

            const buckets = bucketByDimension(filtered, bucketDim);

            // Sort keys chronologically
            const sortedKeys = Object.keys(buckets).sort();

            if (sortedKeys.length === 0) {
                if (statBarChartInstance) { statBarChartInstance.destroy(); statBarChartInstance = null; }
                $('statSummary').innerHTML = '';
                $('statDetailBody').innerHTML = '<tr><td colspan="4" class="stats-empty">暂无数据</td></tr>';
                return;
            }

            const labels = sortedKeys.map(k => formatBucketLabel(k, bucketDim));
            const dataMinutes = sortedKeys.map(k => Math.round(buckets[k].total / 60000)); // ms -> min

            // Update date icon
            const dateIcon = $('statDateIcon');
            if (dateIcon) {
                const dimNames = { range: '📊 时间区间', daily: '📅 今日', weekly: '📆 本周', monthly: '📋 本月', yearly: '📊 本年' };
                dateIcon.textContent = dimNames[dimension] || '📅';
            }

            // Render bar chart
            const ctx = document.getElementById('statBarChart').getContext('2d');
            if (statBarChartInstance) { statBarChartInstance.destroy(); }

            // Generate colors per bar
            const colors = sortedKeys.map((_, i) => {
                const hue = (i * 37) % 360;
                return `hsla(${hue}, 70%, 60%, 0.8)`;
            });

            statBarChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '时长（分钟）',
                        data: dataMinutes,
                        backgroundColor: colors,
                        borderColor: colors.map(c => c.replace('0.8', '1')),
                        borderWidth: 1,
                        borderRadius: 4,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: ctx => `${ctx.parsed.y} 分钟 (${formatDuration(ctx.parsed.y * 60000)})`
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: { display: true, text: '分钟', font: { size: 12 } },
                            grid: { color: '#f1f5f9' }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { maxRotation: 45, font: { size: 11 } }
                        }
                    }
                }
            });

            // Summary stats
            const totalMin = dataMinutes.reduce((a, b) => a + b, 0);
            const avgMin = totalMin / dataMinutes.length || 0;
            const maxMin = Math.max(...dataMinutes);
            const daysCount = sortedKeys.length;
            $('statSummary').innerHTML = `
                <div class="stats-summary-item"><div class="ssi-val">${totalMin.toFixed(0)}</div><div class="ssi-label">总分钟</div></div>
                <div class="stats-summary-item"><div class="ssi-val">${avgMin.toFixed(0)}</div><div class="ssi-label">日均/均次</div></div>
                <div class="stats-summary-item"><div class="ssi-val">${maxMin}</div><div class="ssi-label">最高单次</div></div>
                <div class="stats-summary-item"><div class="ssi-val">${daysCount}</div><div class="ssi-label">记录天数</div></div>
            `;

            // Detail table: show last bucket's records or all if daily
            let detailRecs = [];
            if (dimension === 'daily') {
                detailRecs = filtered.sort((a, b) => (b.startTime || '').localeCompare(a.startTime || '')).slice(0, 50);
            } else {
                // Show the most recent bucket's details
                const lastKey = sortedKeys[sortedKeys.length - 1];
                detailRecs = (buckets[lastKey]?.details || []).sort((a, b) => (b.startTime || '').localeCompare(a.startTime || ''));
            }

            if (detailRecs.length === 0) {
                $('statDetailBody').innerHTML = '<tr><td colspan="4" class="stats-empty">暂无数据</td></tr>';
            } else {
                const grandTotal = detailRecs.reduce((s, r) => s + (r.duration || 0), 0);
                let html = '';
                detailRecs.forEach(r => {
                    const durMin = (r.duration || 0) / 60000;
                    const pct = grandTotal > 0 ? ((r.duration || 0) / grandTotal * 100).toFixed(1) : 0;
                    const color = getCategoryColor(r.category);
                    html += `<tr>
                        <td>${formatDate(r.date || r.startTime)}</td>
                        <td><span style="color:${color};font-weight:600;">${r.category}</span></td>
                        <td class="num-cell">${durMin.toFixed(1)}</td>
                        <td class="num-cell">${pct}%</td>
                    </tr>`;
                });
                $('statDetailBody').innerHTML = html;
            }
        }

        // Render per-activity statistics chart
        function renderActStatChart() {
            const activity = $('actStatActivity')?.value || '';
            const dimension = $('actStatDimension')?.value || 'daily';

            if (!activity) {
                if (actStatChartInstance) { actStatChartInstance.destroy(); actStatChartInstance = null; }
                return;
            }

            const actRecs = records.filter(r => r.category === activity);
            const buckets = bucketByDimension(actRecs, dimension);
            const sortedKeys = Object.keys(buckets).sort();

            if (sortedKeys.length === 0) {
                if (actStatChartInstance) { actStatChartInstance.destroy(); actStatChartInstance = null; }
                return;
            }

            const labels = sortedKeys.map(k => formatBucketLabel(k, dimension));
            const dataMin = sortedKeys.map(k => Math.round(buckets[k].total / 60000));

            const ctx = document.getElementById('actStatChart').getContext('2d');
            if (actStatChartInstance) { actStatChartInstance.destroy(); }

            const catColor = getCategoryColor(activity);

            actStatChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: activity,
                        data: dataMin,
                        backgroundColor: catColor + 'cc',
                        borderColor: catColor,
                        borderWidth: 1,
                        borderRadius: 4,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: true, position: 'top' },
                        tooltip: {
                            callbacks: {
                                label: ctx => `${ctx.dataset.label}: ${ctx.parsed.y} 分钟`
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: { display: true, text: '分钟', font: { size: 12 } },
                            grid: { color: '#f1f5f9' }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { maxRotation: 45, font: { size: 11 } }
                        }
                    }
                }
            });
        }

        // Initialize statistics event listeners
        function initStatistics() {
            populateStatFilters();

            // Init chart dimension tabs
            const dimTabs = document.querySelectorAll('#chartDimTabs .dim-tab');
            dimTabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    dimTabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    chartDim = tab.dataset.dim;
                    renderChart();
                });
            });

            $('updateStatChart')?.addEventListener('click', () => {
                renderStatChart();
            });
            $('refreshActStat')?.addEventListener('click', () => {
                renderActStatChart();
            });

            // Auto-update on dropdown change (with scene filter)
            ['statDimension', 'statScene', 'statActivity'].forEach(id => {
                $(id)?.addEventListener('change', renderStatChart);
            });
            // 维度切换：显示/隐藏时间区间长度选择
            const dimSel = $('statDimension');
            const rangeSel = $('statRange');
            const rangeLabel = $('statRangeLabel');
            const toggleRange = () => {
                const isRange = dimSel?.value === 'range';
                if (rangeSel) rangeSel.style.display = isRange ? '' : 'none';
                if (rangeLabel) rangeLabel.style.display = isRange ? '' : 'none';
                if (isRange) renderStatChart();
            };
            dimSel?.addEventListener('change', toggleRange);
            rangeSel?.addEventListener('change', renderStatChart);
            toggleRange(); // 初始化显隐
            // 场景切换时联动重建活动筛选
            $('statScene')?.addEventListener('change', rebuildActivityFilter);
            $('actStatDimension')?.addEventListener('change', renderActStatChart);
            $('actStatActivity')?.addEventListener('change', renderActStatChart);

            // Initial render
            renderStatChart();
            renderActStatChart();
        }

        // ============================================================
        //  RENDER ALL
        // ============================================================
        function renderAll() {
            renderRecords();
            renderChart();
            renderTodos();
            // 更新 header 日期
            const now = new Date();
            headerDate.textContent = now.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric',
                weekday: 'short' });
            // 同步计时器显示
            if (timerState.running) {
                const elapsed = Date.now() - timerState.startTime;
                timerState.elapsedMs = elapsed;
                updateTimerDisplay(elapsed);
            } else {
                updateTimerDisplay(timerState.elapsedMs || 0);
            }
            // 同步类别高亮
            renderCategoryButtons();
            currentCategoryLabel.textContent = timerState.category;
            // 刷新统计（如果已初始化）
            if (typeof renderStatChart === 'function') { renderStatChart(); }
        }

        // ============================================================
        //  INIT
        // ============================================================
        function init() {
            buildCategoryData(); // 初始化类别数据（顺序/删除/自定义/场景）
            loadData();
            restoreTimer(); // 恢复可能仍在运行的计时（刷新/被杀后也能续上）

            // 标签管理：关闭按钮 + 点击遮罩关闭
            $('tagManagerClose')?.addEventListener('click', closeTagManager);
            $('tagManagerModal')?.addEventListener('click', (e) => {
                if (e.target === $('tagManagerModal')) closeTagManager();
            });
            setupTagLongPress(); // 长按/右键标签进入管理

            // 设置默认截止时间
            const now = new Date();
            now.setHours(now.getHours() + 2);
            todoDeadlineInput.value = now.toISOString().slice(0, 16);

            // 计时器控制
            timerCtrl.addEventListener('click', toggleTimer);

            // 键盘快捷键：空格切换计时
            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    toggleTimer();
                }
            });

            // 模态框
            editCancel.addEventListener('click', closeEditModal);
            editSave.addEventListener('click', saveEditModal);
            editModal.addEventListener('click', (e) => {
                if (e.target === editModal) closeEditModal();
            });

            // 新增类别弹窗
            const catModal = $('catModal');
            const catInput = $('catInput');
            $('catSave').addEventListener('click', confirmAddCategory);
            $('catCancel').addEventListener('click', cancelAddCategory);
            catModal.addEventListener('click', (e) => { if (e.target === catModal) cancelAddCategory(); });
            catInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') confirmAddCategory(); });

            // TODO 模式切换
            todoModeDeadline.addEventListener('click', () => {
                todoMode = 'deadline';
                todoModeDeadline.classList.add('active');
                todoModeCountdown.classList.remove('active');
                todoDeadlineInput.style.display = 'inline-block';
                todoCountdownGroup.style.display = 'none';
            });
            todoModeCountdown.addEventListener('click', () => {
                todoMode = 'countdown';
                todoModeCountdown.classList.add('active');
                todoModeDeadline.classList.remove('active');
                todoDeadlineInput.style.display = 'none';
                todoCountdownGroup.style.display = 'flex';
            });
            // 默认
            todoDeadlineInput.style.display = 'inline-block';
            todoCountdownGroup.style.display = 'none';

            todoAddBtn.addEventListener('click', addTodo);
            todoInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') addTodo();
            });

            // 初始化渲染
            renderAll();

            // 初始化统计功能
            initStatistics();

            // 回到前台时：startTime 才是真实起点，直接用真实时间刷新显示，绝不丢弃后台流逝的时间
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden && timerState.running) {
                    tick();
                }
            });

            // 定时刷新倒计时（每分钟）
            setInterval(() => {
                renderTodos();
                if (!timerState.running) {
                    // 如果计时器不在运行，但显示需要刷新
                }
            }, 30000);

            console.log('⏱ 时间统计已启动 — 柳比歇夫法');
            console.log(`📊 当前 ${records.length} 条记录, ${todos.length} 个待办`);
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);
    </script>
