<!DOCTYPE html>

<html lang="zh-CN">

<head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>🏠 收纳管家 · 完整版</title>

    <style>

        /* ===== CSS 变量 & 重置 ===== */

        :root {

            --primary: #4A6CF7;

            --primary-light: #6B8AFF;

            --primary-dark: #3458D6;

            --primary-bg: #EEF2FF;

            --success: #22C55E;

            --danger: #EF4444;

            --warning: #F59E0B;

            --gray-50: #F8FAFC;

            --gray-100: #F1F5F9;

            --gray-200: #E2E8F0;

            --gray-300: #CBD5E1;

            --gray-400: #94A3B8;

            --gray-500: #64748B;

            --gray-600: #475569;

            --gray-700: #334155;

            --gray-800: #1E293B;

            --gray-900: #0F172A;

            --radius: 16px;

            --radius-sm: 10px;

            --shadow: 0 4px 24px rgba(0, 0, 0, 0.06);

            --shadow-lg: 0 12px 48px rgba(0, 0, 0, 0.10);

            --transition: 0.25s ease;

            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;

        }

        html.dark {

            --gray-50: #0F172A;

            --gray-100: #1E293B;

            --gray-200: #334155;

            --gray-300: #475569;

            --gray-400: #64748B;

            --gray-500: #94A3B8;

            --gray-600: #CBD5E1;

            --gray-700: #E2E8F0;

            --gray-800: #F1F5F9;

            --gray-900: #F8FAFC;

            --shadow: 0 4px 24px rgba(0, 0, 0, 0.3);

            --shadow-lg: 0 12px 48px rgba(0, 0, 0, 0.4);

        }

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

        }

        body {

            font-family: var(--font);

            background: var(--gray-50);

            color: var(--gray-800);

            min-height: 100vh;

            padding: 20px;

            transition: background var(--transition), color var(--transition);

        }

        ::-webkit-scrollbar {

            width: 6px;

            height: 6px;

        }

        ::-webkit-scrollbar-track {

            background: var(--gray-100);

        }

        ::-webkit-scrollbar-thumb {

            background: var(--gray-300);

            border-radius: 8px;

        }

        ::-webkit-scrollbar-thumb:hover {

            background: var(--gray-400);

        }

        .app {

            max-width: 1440px;

            margin: 0 auto;

        }

        /* ===== 头部 ===== */

        .header {

            display: flex;

            flex-wrap: wrap;

            align-items: center;

            justify-content: space-between;

            gap: 16px;

            padding: 16px 24px;

            background: #fff;

            border-radius: var(--radius);

            box-shadow: var(--shadow);

            margin-bottom: 24px;

            transition: background var(--transition);

        }

        html.dark .header {

            background: var(--gray-100);

        }

        .header-left {

            display: flex;

            align-items: center;

            gap: 12px;

        }

        .header-left .logo {

            font-size: 28px;

        }

        .header-left h1 {

            font-size: 22px;

            font-weight: 700;

            background: linear-gradient(135deg, var(--primary), var(--primary-light));

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;

            background-clip: text;

        }

        .header-actions {

            display: flex;

            align-items: center;

            gap: 12px;

            flex-wrap: wrap;

        }

        .header-actions .stats-badge {

            background: var(--primary-bg);

            color: var(--primary);

            padding: 6px 16px;

            border-radius: 20px;

            font-size: 14px;

            font-weight: 600;

            display: flex;

            align-items: center;

            gap: 6px;

        }

        .btn {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 6px;

            padding: 8px 18px;

            border: none;

            border-radius: var(--radius-sm);

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            transition: var(--transition);

            background: var(--gray-100);

            color: var(--gray-700);

            text-decoration: none;

            white-space: nowrap;

            min-height: 40px;

        }

        html.dark .btn {

            background: var(--gray-200);

            color: var(--gray-800);

        }

        .btn:hover:not(:disabled) {

            transform: translateY(-1px);

            box-shadow: var(--shadow);

        }

        .btn:active:not(:disabled) {

            transform: scale(0.97);

        }

        .btn:disabled {

            opacity: 0.6;

            cursor: not-allowed;

            transform: none;

        }

        .btn-primary {

            background: var(--primary);

            color: #fff;

        }

        .btn-primary:hover:not(:disabled) {

            background: var(--primary-dark);

        }

        .btn-success {

            background: var(--success);

            color: #fff;

        }

        .btn-success:hover:not(:disabled) {

            background: #16A34A;

        }

        .btn-danger {

            background: var(--danger);

            color: #fff;

        }

        .btn-danger:hover:not(:disabled) {

            background: #DC2626;

        }

        .btn-outline {

            background: transparent;

            border: 2px solid var(--gray-200);

        }

        html.dark .btn-outline {

            border-color: var(--gray-300);

        }

        .btn-outline:hover:not(:disabled) {

            border-color: var(--primary);

            color: var(--primary);

        }

        .btn-sm {

            padding: 4px 12px;

            font-size: 12px;

            min-height: 32px;

        }

        /* ===== 统计卡片 ===== */

        .stats-grid {

            display: grid;

            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));

            gap: 12px;

            margin-bottom: 20px;

        }

        .stat-card {

            background: #fff;

            padding: 14px 18px;

            border-radius: var(--radius-sm);

            box-shadow: var(--shadow);

            display: flex;

            flex-direction: column;

            transition: background var(--transition);

        }

        html.dark .stat-card {

            background: var(--gray-100);

        }

        .stat-card .label {

            font-size: 12px;

            color: var(--gray-500);

            font-weight: 500;

            text-transform: uppercase;

            letter-spacing: 0.3px;

        }

        .stat-card .value {

            font-size: 24px;

            font-weight: 700;

            color: var(--gray-900);

            margin-top: 2px;

        }

        .stat-card .sub {

            font-size: 13px;

            color: var(--gray-500);

            margin-top: 2px;

        }

        .stat-card.accent {

            border-left: 4px solid var(--primary);

        }

        .stat-card.accent-green {

            border-left: 4px solid var(--success);

        }

        .stat-card.accent-red {

            border-left: 4px solid var(--danger);

        }

        .stat-card.accent-orange {

            border-left: 4px solid var(--warning);

        }

        .stat-card.accent-purple {

            border-left: 4px solid #9333EA;

        }

        .stat-card.accent-cyan {

            border-left: 4px solid #06B6D4;

        }

        .stat-card.accent-pink {

            border-left: 4px solid #EC4899;

        }

        /* ===== 汇总面板 ===== */

        .summary-panel {

            background: #fff;

            border-radius: var(--radius);

            box-shadow: var(--shadow);

            padding: 16px 20px;

            margin-bottom: 20px;

            transition: background var(--transition);

        }

        html.dark .summary-panel {

            background: var(--gray-100);

        }

        .summary-header {

            display: flex;

            flex-wrap: wrap;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 12px;

            gap: 10px;

        }

        .summary-header h3 {

            font-size: 16px;

            color: var(--gray-800);

        }

        .summary-buttons {

            display: flex;

            gap: 8px;

            flex-wrap: wrap;

        }

        .summary-content {

            max-height: 360px;

            overflow-y: auto;

            padding-top: 8px;

            display: none;

        }

        .summary-content.active {

            display: block;

        }

        .summary-row {

            display: flex;

            justify-content: space-between;

            padding: 6px 0;

            border-bottom: 1px dashed var(--gray-200);

        }

        html.dark .summary-row {

            border-color: var(--gray-300);

        }

        .summary-row .bar-wrap {

            display: flex;

            align-items: center;

            gap: 12px;

            flex: 1;

            max-width: 300px;

        }

        .summary-row .bar {

            height: 8px;

            background: var(--primary);

            border-radius: 4px;

            transition: width 0.3s;

        }

        /* ===== 筛选栏 ===== */

        .filter-bar {

            background: #fff;

            padding: 16px 20px;

            border-radius: var(--radius);

            box-shadow: var(--shadow);

            margin-bottom: 20px;

            display: flex;

            flex-wrap: wrap;

            align-items: center;

            gap: 12px 16px;

            transition: background var(--transition);

        }

        html.dark .filter-bar {

            background: var(--gray-100);

        }

        .filter-bar .filter-group {

            display: flex;

            align-items: center;

            gap: 6px;

            flex-wrap: wrap;

        }

        .filter-bar label {

            font-size: 13px;

            font-weight: 500;

            color: var(--gray-600);

            white-space: nowrap;

        }

        html.dark .filter-bar label {

            color: var(--gray-600);

        }

        .filter-bar select,

        .filter-bar input[type="text"],

        .filter-bar input[type="date"],

        .filter-bar input[type="number"] {

            padding: 6px 12px;

            border: 2px solid var(--gray-200);

            border-radius: var(--radius-sm);

            font-size: 13px;

            background: #fff;

            color: var(--gray-800);

            outline: none;

            transition: var(--transition);

            min-width: 100px;

        }

        html.dark .filter-bar select,

        html.dark .filter-bar input[type="text"],

        html.dark .filter-bar input[type="date"],

        html.dark .filter-bar input[type="number"] {

            background: var(--gray-100);

            border-color: var(--gray-300);

            color: var(--gray-800);

        }

        .filter-bar select:focus,

        .filter-bar input[type="text"]:focus,

        .filter-bar input[type="date"]:focus,

        .filter-bar input[type="number"]:focus {

            border-color: var(--primary);

            box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.15);

        }

        .filter-bar .search-input {

            flex: 1;

            min-width: 150px;

        }

        .filter-bar .search-input input {

            width: 100%;

            min-width: 120px;

        }

        .filter-actions {

            display: flex;

            gap: 6px;

            margin-left: auto;

        }

        /* ===== 物品列表 ===== */

        .list-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 16px;

            flex-wrap: wrap;

            gap: 8px;

        }

        .list-header h2 {

            font-size: 18px;

            font-weight: 600;

            color: var(--gray-800);

        }

        .list-header .count {

            font-size: 14px;

            color: var(--gray-500);

            font-weight: 400;

        }

        .items-grid {

            display: grid;

            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));

            gap: 16px;

        }

        /* ===== 物品卡片 ===== */

        .item-card {

            background: #fff;

            border-radius: var(--radius);

            box-shadow: var(--shadow);

            overflow: hidden;

            transition: var(--transition);

            display: flex;

            flex-direction: column;

            position: relative;

        }

        html.dark .item-card {

            background: var(--gray-100);

        }

        .item-card:hover {

            transform: translateY(-4px);

            box-shadow: var(--shadow-lg);

        }

        .item-card .card-img {

            width: 100%;

            height: 180px;

            background: var(--gray-100);

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            position: relative;

            cursor: pointer;

        }

        .item-card .card-img img {

            width: 100%;

            height: 100%;

            object-fit: cover;

        }

        .item-card .card-img .no-img {

            color: var(--gray-400);

            font-size: 40px;

            opacity: 0.5;

        }

        .item-card .card-img .status-badge {

            position: absolute;

            top: 10px;

            right: 10px;

            padding: 4px 14px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: 600;

            background: rgba(0, 0, 0, 0.7);

            color: #fff;

            backdrop-filter: blur(4px);

        }

        .item-card .card-img .status-badge.lost {

            background: rgba(239, 68, 68, 0.85);

        }

        .item-card .card-body {

            padding: 14px 16px 16px;

            flex: 1;

            display: flex;

            flex-direction: column;

            gap: 6px;

        }

        .item-card .card-body .item-name {

            font-size: 17px;

            font-weight: 700;

            color: var(--gray-900);

            line-height: 1.3;

        }

        .item-card .card-body .item-meta {

            display: flex;

            flex-wrap: wrap;

            gap: 4px 10px;

            font-size: 13px;

            color: var(--gray-500);

        }

        .item-card .card-body .item-meta .tag {

            background: var(--gray-100);

            padding: 1px 10px;

            border-radius: 12px;

            font-size: 12px;

            color: var(--gray-600);

        }

        html.dark .item-card .card-body .item-meta .tag {

            background: var(--gray-200);

            color: var(--gray-700);

        }

        .item-card .card-body .item-meta .tag.room {

            background: #DBEAFE;

            color: #1D4ED8;

        }

        html.dark .item-card .card-body .item-meta .tag.room {

            background: rgba(219, 234, 254, 0.15);

        }

        .item-card .card-body .item-meta .tag.category {

            background: #FCE7F3;

            color: #BE185D;

        }

        html.dark .item-card .card-body .item-meta .tag.category {

            background: rgba(252, 231, 243, 0.15);

        }

        .item-card .card-body .item-meta .tag.owner {

            background: #D1FAE5;

            color: #065F46;

        }

        html.dark .item-card .card-body .item-meta .tag.owner {

            background: rgba(209, 250, 229, 0.15);

        }

        .item-card .card-body .item-details {

            font-size: 13px;

            color: var(--gray-600);

            margin-top: 4px;

            display: flex;

            flex-direction: column;

            gap: 2px;

        }

        .item-card .card-body .item-details .detail-row {

            display: flex;

            justify-content: space-between;

            padding: 2px 0;

            border-bottom: 1px dashed var(--gray-100);

        }

        html.dark .item-card .card-body .item-details .detail-row {

            border-color: var(--gray-200);

        }

        .item-card .card-body .item-details .detail-row .label {

            color: var(--gray-400);

            font-weight: 400;

        }

        .item-card .card-body .item-details .life-row {

            display: flex;

            justify-content: space-between;

            padding: 2px 0;

            font-size: 13px;

        }

        .item-card .card-body .item-details .life-row .life-bar {

            width: 80px;

            height: 6px;

            background: var(--gray-200);

            border-radius: 3px;

            overflow: hidden;

            display: inline-block;

            margin-left: 6px;

        }

        .item-card .card-body .item-details .life-row .life-bar .fill {

            height: 100%;

            border-radius: 3px;

            transition: width 0.4s;

        }

        .item-card .card-body .item-reason {

            font-size: 13px;

            color: var(--gray-500);

            background: var(--gray-50);

            padding: 6px 12px;

            border-radius: var(--radius-sm);

            margin-top: 4px;

            border-left: 3px solid var(--gray-300);

        }

        html.dark .item-card .card-body .item-reason {

            background: var(--gray-100);

        }

        .item-card .card-actions {

            display: flex;

            gap: 8px;

            padding: 10px 16px 14px;

            border-top: 1px solid var(--gray-100);

            justify-content: flex-end;

            flex-wrap: wrap;

        }

        html.dark .item-card .card-actions {

            border-color: var(--gray-200);

        }

        /* ===== 空状态 ===== */

        .empty-state {

            text-align: center;

            padding: 60px 20px;

            color: var(--gray-400);

        }

        .empty-state .icon {

            font-size: 64px;

            margin-bottom: 16px;

            opacity: 0.6;

        }

        .empty-state h3 {

            font-size: 20px;

            color: var(--gray-600);

            margin-bottom: 8px;

        }

        .empty-state p {

            font-size: 15px;

            max-width: 400px;

            margin: 0 auto 16px;

        }

        /* ===== 模态框 ===== */

        .modal-overlay {

            position: fixed;

            inset: 0;

            background: rgba(15, 23, 42, 0.5);

            backdrop-filter: blur(6px);

            display: none;

            align-items: center;

            justify-content: center;

            z-index: 999;

            padding: 20px;

            animation: fadeIn 0.2s ease;

        }

        .modal-overlay.active {

            display: flex;

        }

        .modal {

            background: #fff;

            border-radius: var(--radius);

            max-width: 680px;

            width: 100%;

            max-height: 92vh;

            overflow-y: auto;

            padding: 24px 28px 28px;

            box-shadow: var(--shadow-lg);

            animation: slideUp 0.25s ease;

            transition: background var(--transition);

        }

        html.dark .modal {

            background: var(--gray-100);

        }

        @keyframes fadeIn {

            from {

                opacity: 0;

            }

            to {

                opacity: 1;

            }

        }

        @keyframes slideUp {

            from {

                transform: translateY(30px);

                opacity: 0;

            }

            to {

                transform: translateY(0);

                opacity: 1;

            }

        }

        .modal-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 20px;

        }

        .modal-header h2 {

            font-size: 20px;

            font-weight: 700;

            color: var(--gray-900);

        }

        .modal-close {

            background: none;

            border: none;

            font-size: 28px;

            cursor: pointer;

            color: var(--gray-400);

            transition: var(--transition);

            line-height: 1;

            padding: 0 4px;

        }

        .modal-close:hover {

            color: var(--gray-700);

            transform: rotate(90deg);

        }

        .modal .form-group {

            margin-bottom: 14px;

        }

        .modal .form-group label {

            display: block;

            font-size: 13px;

            font-weight: 600;

            color: var(--gray-700);

            margin-bottom: 4px;

        }

        html.dark .modal .form-group label {

            color: var(--gray-700);

        }

        .modal .form-group label .required {

            color: var(--danger);

            margin-left: 2px;

        }

        .modal .form-group input,

        .modal .form-group select,

        .modal .form-group textarea {

            width: 100%;

            padding: 8px 14px;

            border: 2px solid var(--gray-200);

            border-radius: var(--radius-sm);

            font-size: 14px;

            font-family: var(--font);

            transition: var(--transition);

            background: #fff;

            color: var(--gray-800);

        }

        html.dark .modal .form-group input,

        html.dark .modal .form-group select,

        html.dark .modal .form-group textarea {

            background: var(--gray-50);

            border-color: var(--gray-300);

        }

        .modal .form-group input:focus,

        .modal .form-group select:focus,

        .modal .form-group textarea:focus {

            border-color: var(--primary);

            box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.12);

            outline: none;

        }

        .modal .form-group textarea {

            resize: vertical;

            min-height: 50px;

        }

        .modal .form-row {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 14px;

        }

        .modal .form-row-3 {

            display: grid;

            grid-template-columns: 1fr 1fr 1fr;

            gap: 14px;

        }

        .modal .form-group .file-input-wrapper {

            display: flex;

            align-items: center;

            gap: 12px;

            flex-wrap: wrap;

        }

        .modal .form-group .file-input-wrapper input[type="file"] {

            flex: 1;

            padding: 6px;

            border: 2px dashed var(--gray-300);

            border-radius: var(--radius-sm);

            background: var(--gray-50);

            font-size: 13px;

            min-width: 140px;

        }

        .modal .form-group .file-input-wrapper .preview {

            width: 60px;

            height: 60px;

            border-radius: var(--radius-sm);

            overflow: hidden;

            border: 2px solid var(--gray-200);

            flex-shrink: 0;

            background: var(--gray-100);

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 24px;

            color: var(--gray-400);

        }

        .modal .form-group .file-input-wrapper .preview img {

            width: 100%;

            height: 100%;

            object-fit: cover;

        }

        .modal .form-actions {

            display: flex;

            gap: 12px;

            justify-content: flex-end;

            margin-top: 20px;

            padding-top: 16px;

            border-top: 1px solid var(--gray-100);

        }

        html.dark .modal .form-actions {

            border-color: var(--gray-200);

        }

        /* ===== Toast ===== */

        .toast-container {

            position: fixed;

            bottom: 24px;

            right: 24px;

            z-index: 9999;

            display: flex;

            flex-direction: column;

            gap: 10px;

            max-width: 360px;

        }

        .toast {

            padding: 12px 20px;

            border-radius: var(--radius-sm);

            background: var(--gray-900);

            color: #fff;

            font-size: 14px;

            font-weight: 500;

            box-shadow: var(--shadow-lg);

            animation: slideIn 0.3s ease;

            display: flex;

            align-items: center;

            gap: 10px;

        }

        .toast.success {

            background: var(--success);

        }

        .toast.error {

            background: var(--danger);

        }

        .toast.info {

            background: var(--primary);

        }

        @keyframes slideIn {

            from {

                transform: translateX(60px);

                opacity: 0;

            }

            to {

                transform: translateX(0);

                opacity: 1;

            }

        }

        /* ===== 图片预览 ===== */

        .img-preview-overlay {

            position: fixed;

            inset: 0;

            background: rgba(0, 0, 0, 0.88);

            z-index: 1000;

            display: none;

            align-items: center;

            justify-content: center;

            padding: 20px;

        }

        .img-preview-overlay.active {

            display: flex;

        function debounce(fn, delay = 250) {

            let timer;

            return function(...args) { clearTimeout(timer);

        }



        function generateId() {

            return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

        }



        function formatDate(dateStr) {

            if (!dateStr) return '—';

            const d = new Date(dateStr);

            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

        }



        function formatMonth(dateStr) {

            if (!dateStr) return '未知';

            const d = new Date(dateStr);

            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;

        }



        function formatPrice(val) {

            if (val === undefined || val === null || val === '') return '¥0.00';

            const n = Number(val);

            if (isNaN(n) || n === 0) return '¥0.00';

            return `¥${n.toFixed(2)}`;

        }



        function getStatus(item) {

            if (item.loseDate && item.loseDate.trim() !== '') return 'lost';

            return 'active';

            return getStatus(item) === 'active' ? '✅ 现有' : '❌ 已失去';

        function escapeHtml(text) {

            if (!text) return '';

            const div = document.createElement('div');

            div.textContent = text;

            return div.innerHTML;

        }



        function getRemainingLife(item) {

            if (!item.lifeSpan || !item.acquireDate) return null;

            const years = Number(item.lifeSpan);

            if (isNaN(years) || years <= 0) return null;

            const acquire = new Date(item.acquireDate);

            const now = new Date();

            const used = (now - acquire) / (365.25 * 24 * 60 * 60 * 1000);

            const remain = years - used;

            return Math.max(0, remain);

        }



        function getLifeStatus(remain) {

            if (remain === null || remain === undefined) return '未设置';

            if (remain <= 0) return '已过期';

            if (remain < 1) return '0-1年';

            if (remain < 3) return '1-3年';

            if (remain < 5) return '3-5年';

            if (remain < 10) return '5-10年';

            return '10年以上';

        }



        function getLifeColor(remain) {

            if (remain === null || remain === undefined) return 'var(--gray-400)';

            if (remain <= 0) return 'var(--danger)';

            if (remain < 2) return '#F59E0B';

            if (remain < 5) return '#3B82F6';

            return '#22C55E';

        }



        async function compressImage(file, maxWidth = 1200, quality = 0.7) {

            return new Promise((resolve) => {

                const reader = new FileReader();

                reader.readAsDataURL(file);

                reader.onload = e => {

                    const img = new Image();

                    img.src = e.target.result;

                    img.onload = () => {

                        const canvas = document.createElement('canvas');

                        let width = img.width,

                            height = img.height;

                        if (width > maxWidth) { height = (maxWidth / width) * height;

                            width = maxWidth; }

                        canvas.width = width;

                        canvas.height = height;

                        const ctx = canvas.getContext('2d');

                        ctx.drawImage(img, 0, 0, width, height);

                        resolve(canvas.toDataURL('image/jpeg', quality));

                    };

                };

            });

        }

        // ============================================================

        function getFilteredItems() {

            const room = filterRoom.value;

            const mainCat = filterMainCat.value;

            const subCat = filterSubCat.value;

            const owner = filterOwner.value;

            const status = filterStatus.value;

            const search = filterSearch.value.trim().toLowerCase();

            const hasImg = filterHasImg.value;



            let result = items.filter(item => {

                if (room && item.room !== room) return false;

                if (mainCat && item.mainCat !== mainCat) return false;

                if (subCat && item.subCat !== subCat) return false;

                if (owner && item.owner !== owner) return false;

                if (status === 'active' && getStatus(item) !== 'active') return false;

                if (status === 'lost' && getStatus(item) !== 'lost') return false;

                if (search && !item.name.toLowerCase().includes(search)) return false;

                if (hasImg === 'yes' && (!item.photo || item.photo === '')) return false;

                if (hasImg === 'no' && item.photo && item.photo !== '') return false;

                return true;

            });



            result.sort((a, b) => {

                let cmp = 0;

                if (currentSort === 'name') {

                    cmp = a.name.localeCompare(b.name, 'zh-CN');

                } else if (currentSort === 'price') {

                    cmp = (Number(a.acquirePrice) || 0) - (Number(b.acquirePrice) || 0);

                } else if (currentSort === 'life') {

                    const ra = getRemainingLife(a) ?? -1;

                    const rb = getRemainingLife(b) ?? -1;

                    cmp = ra - rb;

                } else {

                    const da = a.acquireDate || '';

                    const db = b.acquireDate || '';

                    cmp = da.localeCompare(db);

                }

                return sortAsc ? cmp : -cmp;

            });

            return result;

        }

        function renderStats() {

            const total = items.length;

            const activeList = items.filter(it => getStatus(it) === 'active');

            const lostList = items.filter(it => getStatus(it) === 'lost');

            const cats = new Set(items.map(it => it.subCat).filter(Boolean));

            const owners = new Set(items.map(it => it.owner).filter(Boolean));

            const rooms = new Set(items.map(it => it.room).filter(Boolean));



            const activeVal = activeList.reduce((s, it) => s + (Number(it.acquirePrice) || 0), 0);

            const lostVal = lostList.reduce((s, it) => s + (Number(it.acquirePrice) || 0), 0);



            // 平均剩余寿命（仅统计在库且有使用寿命的）

            const lifeItems = activeList.filter(it => it.lifeSpan && Number(it.lifeSpan) > 0 && it.acquireDate);

            let avgLife = 0;

            if (lifeItems.length > 0) {

                const sum = lifeItems.reduce((s, it) => s + getRemainingLife(it), 0);

                avgLife = sum / lifeItems.length;

            }



            statTotal.textContent = total;

            statActive.textContent = activeList.length;

            statLost.textContent = lostList.length;

            statCategories.textContent = cats.size;

            statOwners.textContent = owners.size;

            statRooms.textContent = rooms.size;

            statActiveValue.textContent = formatPrice(activeVal);

            statLostValue.textContent = formatPrice(lostVal);

            statAvgLife.textContent = avgLife > 0 ? `${avgLife.toFixed(1)} 年` : '—';

            totalBadge.textContent = `📊 ${total} 件物品`;

        }

        // ============================================================

        // 汇总统计

        // ============================================================

        function renderSummary(type) {

            summaryContent.classList.add('active');

            let html = '';

            const activeItems = items.filter(it => getStatus(it) === 'active');



            if (type === 'room') {

                const group = {};

                items.forEach(i => {

                    if (!group[i.room]) group[i.room] = { count: 0, value: 0 };

                    group[i.room].count++;

                    group[i.room].value += Number(i.acquirePrice) || 0;

                });

                html = `<h4>🏠 按房间汇总（数量/总价）</h4>`;

                Object.entries(group).sort((a, b) => b[1].count - a[1].count).forEach(([k, v]) => {

                    html +=

                        `<div class="summary-row"><span>${escapeHtml(k)}</span><span>${v.count}件 / ${formatPrice(v.value)}</span></div>`;

                });

            } else if (type === 'owner') {

                const group = {};

                items.forEach(i => {

                    if (!group[i.owner]) group[i.owner] = { count: 0, value: 0 };

                    group[i.owner].count++;

                    group[i.owner].value += Number(i.acquirePrice) || 0;

                });

                html = `<h4>👤 按归属人汇总（数量/总资产）</h4>`;

                Object.entries(group).sort((a, b) => b[1].value - a[1].value).forEach(([k, v]) => {

                    html +=

                        `<div class="summary-row"><span>${escapeHtml(k)}</span><span>${v.count}件 / ${formatPrice(v.value)}</span></div>`;

                });

            } else if (type === 'category') {

                const group = {};

                items.forEach(i => {

                    const key = i.subCat || i.mainCat || '未分类';

                    if (!group[key]) group[key] = { count: 0, value: 0 };

                    group[key].count++;

                    group[key].value += Number(i.acquirePrice) || 0;

                });

                html = `<h4>📂 按物品子分类汇总（数量/总价）</h4>`;

                Object.entries(group).sort((a, b) => b[1].count - a[1].count).forEach(([k, v]) => {

                    html +=

                        `<div class="summary-row"><span>${escapeHtml(k)}</span><span>${v.count}件 / ${formatPrice(v.value)}</span></div>`;

                });

            } else if (type === 'month') {

                const group = {};

                items.forEach(i => {

                    const m = formatMonth(i.acquireDate);

                    if (!group[m]) group[m] = { count: 0, value: 0 };

                    group[m].count++;

                    group[m].value += Number(i.acquirePrice) || 0;

                });

                html = `<h4>📅 按购入年月汇总（新增数量/当月花费）</h4>`;

                Object.entries(group).sort((a, b) => a[0].localeCompare(b[0])).forEach(([k, v]) => {

                    html +=

                        `<div class="summary-row"><span>${k}</span><span>${v.count}件 / ${formatPrice(v.value)}</span></div>`;

                });

            } else if (type === 'life') {

                // 按剩余使用寿命汇总（仅统计在库且有寿命的物品）

                const groups = {

                    '已过期': { count: 0, items: [] },

                    '0-1年': { count: 0, items: [] },

                    '1-3年': { count: 0, items: [] },

                    '3-5年': { count: 0, items: [] },

                    '5-10年': { count: 0, items: [] },

                    '10年以上': { count: 0, items: [] },

                    '未设置': { count: 0, items: [] }

                };

                activeItems.forEach(it => {

                    const remain = getRemainingLife(it);

                    let key = '未设置';

                    if (remain !== null) {

                        if (remain <= 0) key = '已过期';

                        else if (remain < 1) key = '0-1年';

                        else if (remain < 3) key = '1-3年';

                        else if (remain < 5) key = '3-5年';

                        else if (remain < 10) key = '5-10年';

                        else key = '10年以上';

                    }

                    groups[key].count++;

                    groups[key].items.push(it);

                });



                html = `<h4>⏳ 按剩余使用寿命汇总（在库物品）</h4>`;

                const total = activeItems.length;

                const order = ['已过期', '0-1年', '1-3年', '3-5年', '5-10年', '10年以上', '未设置'];

                order.forEach(key => {

                    const g = groups[key];

                    if (g.count === 0) return;

                    const pct = total > 0 ? (g.count / total * 100) : 0;

                    const color = key === '已过期' ? 'var(--danger)' :

                        key === '未设置' ? 'var(--gray-400)' :

                        key === '0-1年' ? '#F59E0B' :

                        key === '1-3年' ? '#F59E0B' :

                        key === '3-5年' ? '#3B82F6' :

                        key === '5-10年' ? '#22C55E' : '#22C55E';

                    html += `<div class="summary-row">

                        <span>${key}</span>

                        <span style="display:flex;align-items:center;gap:12px;">

                            <span>${g.count}件 (${pct.toFixed(1)}%)</span>

                            <span class="bar-wrap"><span class="bar" style="width:${Math.max(2,pct)}%;background:${color};"></span></span>

                        </span>

                    </div>`;

                });

                if (activeItems.length === 0) {

                    html += `<div class="summary-row"><span style="color:var(--gray-400);">暂无在库物品</span></div>`;

                }

            }

            summaryContent.innerHTML = html;

        }

            const lifeSpan = formLifeSpan.value ? parseInt(formLifeSpan.value) : null;

            const buyReason = formBuyReason.value.trim();

            const loseDate = formLoseDate.value;

            const loseReason = formLoseReason.value.trim();



            if (!name || !room || !mainCat || !subCat || !owner || !acquireDate) {

                showToast('请填写所有必填项（* 标记）', 'error');

                return;

            }



            if (lifeSpan !== null && (isNaN(lifeSpan) || lifeSpan < 0)) {

                showToast('请输入有效的使用寿命（年）', 'error');

                return;

            }



            submitLock = true;

            modalSubmitBtn.disabled = true;

            modalSubmitBtn.textContent = '⏳ 保存中...';



            try {

                let photoData = '';

                if (formPhoto.files && formPhoto.files.length > 0) {

                    const file = formPhoto.files[0];

                    if (file.size > 2 * 1024 * 1024) {

                        showToast('图片超过2MB，请压缩后重新上传', 'error');

                        submitLock = false;

                        modalSubmitBtn.disabled = false;

                        modalSubmitBtn.textContent = '💾 保存';

                        return;

                    }

                    photoData = await compressImage(file);

                } else if (editingId) {

                    const existing = items.find(it => it.id === editingId);

                    if (existing && existing.photo) photoData = existing.photo;

                }



                const newItem = {

                    id: editingId || generateId(),

                    name,

                    room,

                    mainCat,

                    subCat,

                    owner,

                    acquireDate,

                    acquirePrice,

                    lifeSpan,

                    buyReason,

                    loseDate,

                    loseReason,

                    photo: photoData

                };



                if (editingId) {

                    const idx = items.findIndex(it => it.id === editingId);

                    if (idx !== -1) items[idx] = newItem;

                } else {

                    items.push(newItem);

                }



                saveData();

                renderAll();

                closeModal();

                showToast(editingId ? '物品已更新' : '物品添加成功', 'success');

            } catch (err) {

                console.error(err);

                showToast('保存失败，请重试', 'error');

            } finally {

                submitLock = false;

                modalSubmitBtn.disabled = false;

                modalSubmitBtn.textContent = '💾 保存';

            }

        });



        // ============================================================

        // 事件绑定

        // ============================================================

        document.addEventListener('DOMContentLoaded', function() {

            // 初始化主题

            initTheme();



            // 填充表单下拉（房间和归属人）

            ROOMS.forEach(r => {

                const opt = document.createElement('option');

                opt.value = r;

                opt.textContent = r;

                formRoom.appendChild(opt);

            
            // 绑定类别管理按钮
            const catBtn = document.getElementById('manageCategoriesBtn');
            if (catBtn) catBtn.addEventListener('click', openCategoryManager);});

            OWNERS.forEach(o => {

                const opt = document.createElement('option');

                opt.value = o;

                opt.textContent = o;

                formOwner.appendChild(opt);

            });



            // 分类联动

            populateMainCats();

            populateFilterCats();

            formMainCat.addEventListener('change', function() {

                updateSubCats(this.value);

            });

            filterMainCat.addEventListener('change', function() {

                updateFilterSubCats(this.value);

                renderItems();

            });

            filterSubCat.addEventListener('change', renderItems);



            // 加载数据

            loadData();

            renderAll();



            // 添加按钮

            $('openAddBtn').addEventListener('click', openAddModal);

            $('emptyAddBtn').addEventListener('click', openAddModal);



            // 关闭模态框

            $('modalCloseBtn').addEventListener('click', closeModal);

            $('modalCancelBtn').addEventListener('click', closeModal);

            modalOverlay.addEventListener('click', function(e) {

                if (e.target === modalOverlay) closeModal();

            });



            // 主题切换

            $('themeToggleBtn').addEventListener('click', toggleTheme);



            // 导出



            // 导入

            $('importFileInput').addEventListener('change', function(e) {

                if (this.files && this.files.length > 0) {

                    importData(this.files[0]);

                    this.value = '';

                }

            });



            // 筛选监听

            const filterInputs = [filterRoom, filterStatus, filterHasImg, filterSearch];

            filterInputs.forEach(el => {

                el.addEventListener('input', debounce(renderItems, 200));

                el.addEventListener('change', renderItems);

            });



            // 清除筛选

            $('clearFiltersBtn').addEventListener('click', function() {

                filterRoom.value = '';

                filterMainCat.value = '';

                filterSubCat.innerHTML = '<option value="">全部</option>';

                filterOwner.value = '';

                filterStatus.value = '';

                filterHasImg.value = '';

                filterSearch.value = '';

                renderItems();

                showToast('已清除所有筛选条件', 'info');

            });



            // 排序

            $('sortByNameBtn').addEventListener('click', function() {

                if (currentSort === 'name') sortAsc = !sortAsc;

                else { currentSort = 'name';

                    sortAsc = true; }

                renderItems();

            });

            $('sortByDateBtn').addEventListener('click', function() {

                if (currentSort === 'date') sortAsc = !sortAsc;

                else { currentSort = 'date';

                    sortAsc = false; }

                renderItems();

            });

            $('sortByPriceBtn').addEventListener('click', function() {

                if (currentSort === 'price') sortAsc = !sortAsc;

                else { currentSort = 'price';

                    sortAsc = true; }

                renderItems();

            });

            $('sortByLifeBtn').addEventListener('click', function() {

                if (currentSort === 'life') sortAsc = !sortAsc;

                else { currentSort = 'life';

                    sortAsc = false; }

                renderItems();

            });



            // 汇总按钮

            summaryBtns.forEach(btn => {

                btn.addEventListener('click', function() {

                    const type = this.dataset.type;

                    renderSummary(type);

                });

            });



            // 图片预览关闭

            $('imgPreviewClose').addEventListener('click', () => imgPreviewOverlay.classList.remove('active'));

            imgPreviewOverlay.addEventListener('click', function(e) {

                if (e.target === imgPreviewOverlay) imgPreviewOverlay.classList.remove('active');

            });



            // 图片预览

            formPhoto.addEventListener('change', function(e) {

                const file = e.target.files[0];

                if (file) {

                    const reader = new FileReader();

                    reader.onload = function(ev) {

                        formPhotoPreview.innerHTML = `<img src="${ev.target.result}" alt="预览" />`;

                    };

                    reader.readAsDataURL(file);

                } else {

                    formPhotoPreview.innerHTML = '📷';

                }

            });



            console.log('🏠 收纳管家 · 完整版 已加载！');

            console.log(`📦 共 ${items.length} 件物品`);

            console.log(`🏠 房间列表: ${ROOMS.join(', ')}`);

            console.log(`👤 归属人: ${OWNERS.join(', ')}`);

        });

    
    // ========== 类别管理功能 ==========
    function openCategoryManager() {
        const modal = document.createElement('div');
        modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center;';
        modal.innerHTML = `
            <div style="background:white;border-radius:12px;padding:24px;max-width:600px;width:90%;max-height:80vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.2)">
                <h2 style="margin:0 0 16px;font-size:20px">⚙ 管理分类</h2>
                <div id="categoryList"></div>
                <div style="margin-top:16px;padding-top:16px;border-top:1px solid #e2e8f0;display:flex;gap:10px">
                    <button id="addCategoryBtn" class="btn" style="padding:8px 16px;font-size:14px;background:#4A6CF7;color:white;border:none;border-radius:8px;cursor:pointer">+ 添加主分类</button>
                    <button id="closeCategoryBtn" class="btn" style="padding:8px 16px;font-size:14px;background:#f1f5f9;color:#475569;border:1px solid #e2e8f0;border-radius:8px;cursor:pointer">关闭</button>
                </div>
            </div>`;
        document.body.appendChild(modal);
        renderCategoryList();
        modal.querySelector('#closeCategoryBtn').onclick = () => modal.remove();
        modal.querySelector('#addCategoryBtn').onclick = addNewCategory;
        modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });
    }

    function renderCategoryList() {
        const cats = CATEGORIES;
        const list = document.getElementById('categoryList');
        if (!list) return;
        list.innerHTML = '';
        if (Object.keys(cats).length === 0) {
            list.innerHTML = '<p style="color:#94a3b8;text-align:center;padding:20px">暂无分类，点击"添加主分类"开始</p>';
            return;
        }
        Object.entries(cats).forEach(([parent, children]) => {
            const item = document.createElement('div');
            item.style.cssText = 'margin-bottom:12px;padding:12px;background:#f8fafc;border-radius:8px;border:1px solid #e2e8f0;';
            item.innerHTML = `
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
                    <strong>${parent}</strong>
                    <div style="display:flex;gap:6px">
                        <button class="btn" onclick="addSubCategory('${parent}')" style="padding:4px 8px;font-size:12px;background:#EEF2FF;color:#4A6CF7;border:1px solid #4A6CF7;border-radius:6px;cursor:pointer">+ 子分类</button>
                        <button class="btn" onclick="removeCategory('${parent}')" style="padding:4px 8px;font-size:12px;color:#ef4444;border:1px solid #ef4444;border-radius:6px;cursor:pointer">删除</button>
                    </div>
                </div>
                <div style="padding-left:16px">
                    ${(children || []).map(c => `
                        <div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #f1f5f9">
                            <span>${c}</span>
                            <button class="btn" onclick="removeSubCategory('${parent}', '${c}')" style="padding:2px 6px;font-size:11px;color:#ef4444;cursor:pointer">✕</button>
                        </div>
                    `).join('')}
                </div>`;
            list.appendChild(item);
        });
    }

    function addNewCategory() {
        const name = prompt('请输入主分类名称：');
        if (!name || !name.trim()) return;
        const cat = name.trim();
        if (CATEGORIES[cat]) { alert('该分类已存在'); return; }
        CATEGORIES[cat] = [];
        saveCategoryData(CATEGORIES);
        renderCategoryList();
        refreshCategorySelects();
    }

    function addSubCategory(parent) {
        const name = prompt('请输入子分类名称：', '');
        if (!name || !name.trim()) return;
        if (!CATEGORIES[parent]) CATEGORIES[parent] = [];
        const list = CATEGORIES[parent];
        if (list.includes(name.trim())) { alert('该子分类已存在'); return; }
        list.push(name.trim());
        CATEGORIES[parent] = list;
        saveCategoryData(CATEGORIES);
        renderCategoryList();
        refreshCategorySelects();
    }

    function removeCategory(parent) {
        if (!confirm('确定删除分类「' + parent + '」及其所有子分类？')) return;
        delete CATEGORIES[parent];
        saveCategoryData(CATEGORIES);
        renderCategoryList();
        refreshCategorySelects();
    }

    function removeSubCategory(parent, child) {
        if (!confirm('确定删除「' + parent + '」下的「' + child + '」？')) return;
        const list = CATEGORIES[parent] || [];
        CATEGORIES[parent] = list.filter(c => c !== child);
        saveCategoryData(CATEGORIES);
        renderCategoryList();
        refreshCategorySelects();
    }

    function refreshCategorySelects() {
        // Refresh filter selects
        const filterMain = document.getElementById('filterMainCat');
        const filterSub = document.getElementById('filterSubCat');
        if (filterMain) {
            const current = filterMain.value;
            filterMain.innerHTML = '<option value="">全部</option>';
            Object.keys(CATEGORIES).forEach(k => {
                const opt = document.createElement('option');
                opt.value = k;
                opt.textContent = k;
                filterMain.appendChild(opt);
            });
            if (current && CATEGORIES[current]) filterMain.value = current;
        }
        if (filterSub) {
            filterSub.innerHTML = '<option value="">全部</option>';
            const main = filterMain ? filterMain.value : '';
            (CATEGORIES[main] || []).forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.textContent = c;
                filterSub.appendChild(opt);
            });
        }
        // Refresh form selects
        const formMain = document.getElementById('formMainCat');
        const formSub = document.getElementById('formSubCat');
        if (formMain) {
            const current = formMain.value;
            formMain.innerHTML = '<option value="">选择主分类</option>';
            Object.keys(CATEGORIES).forEach(k => {
                const opt = document.createElement('option');
                opt.value = k;
                opt.textContent = k;
                formMain.appendChild(opt);
            });
            if (current && CATEGORIES[current]) formMain.value = current;
        }
        if (formSub) {
            formSub.innerHTML = '<option value="">请先选择主分类</option>';
            const main = formMain ? formMain.value : '';
            (CATEGORIES[main] || []).forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.textContent = c;
                formSub.appendChild(opt);
            });
        }
    }
</script>
